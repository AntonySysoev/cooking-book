id: pistachio-gelato
title: Фисташковое джелато
description: Итальянское ореховое мороженое с насыщенным натуральным вкусом фисташек, заварной молочной основой и мягкой кремовой текстурой.
category: ice-cream
also_in: [desserts]

tags:
  - джелато
  - фисташка
  - мороженое
  - Ankarsrum
  - Ninja CB350
yield:
  quantity: 1000
  unit: г основы
time:
  active_minutes: 45
  total_minutes_min: 600
  total_minutes_max: 1200
equipment:
  - Ankarsrum с мороженицей
  - Блендер Ninja CB350
  - Кастрюля с толстым дном
  - Термометр
  - Весы с точностью 0,1 г
  - Ледяная баня для быстрого охлаждения
ingredient_groups:
  - id: pistachio
    title: Фисташковая паста
  - id: base
    title: Молочная основа
  - id: flavour
    title: Для завершения
ingredients:
  - id: pistachios
    name: Очищенные несолёные фисташки
    quantity: 150
    unit: г
    group: pistachio
  - id: milk
    name: Цельное молоко 3–3,5%
    quantity: 500
    unit: г
    group: base
    parts:
      - id: pistachio-paste
        name: Для фисташковой пасты
        quantity: 300
        group: base
      - id: milk-base
        name: Для молочной основы
        quantity: 200
        group: base
  - id: cream
    name: Сливки 30%
    quantity: 150
    unit: г
    group: base
  - id: sugar
    name: Белый сахар
    quantity: 96
    unit: г
    group: base
    parts:
      - id: pistachio-paste
        name: Для фисташковой пасты
        quantity: 30
        group: base
      - id: milk-base
        name: Для молочной основы
        quantity: 66
        group: base
    note: Если нет декстрозы, используй 108 г сахара вместо 96 г сахара и 15 г декстрозы; распределение сахара по этапам смотри в совете ниже.
  - id: dextrose
    name: Декстроза
    quantity: 15
    unit: г
    group: base
    optional: true
  - id: skim-milk-powder
    name: Сухое обезжиренное молоко
    quantity: 37.5
    unit: г
    group: base
  - id: yolks
    name: Яичные желтки
    quantity: 55
    unit: г
    group: base
  - id: locust-bean-gum
    name: Камедь рожкового дерева E410
    quantity: 0.8
    unit: г
    group: base
  - id: salt
    name: Соль
    quantity: 0.5
    unit: г
    group: base
  - id: alcohol
    name: Виски, ром или коньяк
    quantity: 8
    unit: г
    group: flavour
    optional: true
steps:
  - id: roast
    title: Подготовить фисташки
    ingredients:
      - ingredient: pistachios
    instructions: >-
      Розовую кожицу снимать не обязательно. Прогрей фисташки на сухой
      толстостенной сковороде на среднем огне 3–4 минуты, часто перемешивая,
      пока не появится выраженный ореховый аромат. Не допускай заметного
      потемнения. Полностью остуди.
  - id: paste
    title: Измельчить фисташки
    ingredients:
      - ingredient: pistachios
      - ingredient: milk
        part: pistachio-paste
      - ingredient: sugar
        part: pistachio-paste
    instructions: >-
      Отложи сахар, указанный для фисташковой пасты в списке ингредиентов.
      Используй молоко, указанное для фисташковой пасты в списке ингредиентов,
      и измельчи его с фисташками в Ninja CB350 до максимально гладкой пасты. Периодически выключай
      блендер и счищай массу со стенок. Работай короткими циклами, чтобы
      не перегреть мотор; если нож перестаёт захватывать массу, добавь немного
      молока из отложенного количества.
  - id: dry-mix
    title: Смешать сухие ингредиенты и желтки
    ingredients:
      - ingredient: sugar
        part: milk-base
      - ingredient: dextrose
      - ingredient: skim-milk-powder
      - ingredient: locust-bean-gum
      - ingredient: salt
      - ingredient: yolks
    instructions: >-
      Смешай сахар для молочной основы, декстрозу, сухое молоко, соль и E410
      особенно тщательно, чтобы камедь равномерно распределилась и не образовала
      комочков. Добавь желтки и перемешай до густой однородной массы, не взбивая
      в пену. В Ankarsrum для этой операции можно использовать венчики для печенья.
  - id: heat
    title: Нагреть молочно-фисташковую смесь
    ingredients:
      - ingredient: milk
        part: milk-base
      - ingredient: cream
    instructions: >-
      Соедини фисташковую пасту с молоком, указанным для молочной основы, и сливками в кастрюле.
      Нагрей до 80–85 °C, не доводя до кипения, периодически перемешивая,
      чтобы паста не оседала на дно.
  - id: temper
    title: Заварить основу
    instructions: >-
      Медленно влей горячую молочно-фисташковую смесь в желтковую массу,
      постоянно перемешивая. Верни всё в кастрюлю и нагревай на слабом или
      умеренно слабом огне до 82–84 °C, постоянно проходя лопаткой по дну
      и стенкам. Не кипяти. Основа должна слегка загустеть и покрывать
      лопатку тонким слоем.
  - id: cool
    title: Быстро охладить и пробить блендером
    ingredients:
      - ingredient: alcohol
    instructions: >-
      Как можно быстрее охлади основу на ледяной бане, периодически помешивая.
      Когда смесь остынет, добавь алкоголь, если используешь его. Коротко
      пробей блендером для однородности, не захватывая лишний воздух. Накрой
      и выдержи в холодильнике 6–12 часов, лучше ночь; перед замораживанием
      основа должна быть около 4 °C.
  - id: churn
    title: Заморозить в Ankarsrum
    instructions: >-
      Перемешай охлаждённую основу до однородности и залей в предварительно
      подготовленную мороженицу, не превышая допустимую загрузку. Замораживай
      до густого мягкого джелато. Не пытайся добиться полной твёрдости в машине.
      Если весь объём не помещается с запасом для перемешивания, проведи два
      цикла, а оставшуюся основу держи в холодильнике при температуре около 4 °C
      и используй как можно скорее.
  - id: harden
    title: Дозреть в морозильнике
    instructions: >-
      Переложи джелато в заранее охлаждённый контейнер, разровняй поверхность
      и закрой крышкой. Поставь в морозильник на 2–4 часа. Перед подачей
      выдержи при комнатной температуре примерно 5–10 минут, ориентируясь
      на твёрдость.
tips:
  - >-
    Если декстрозы нет, используй 108 г обычного белого сахара вместо 96 г сахара
    и 15 г декстрозы. Тогда распределение для исходной партии составит 33,75 г
    для пасты и 74,25 г для молочной основы; при масштабировании оба количества
    должны масштабироваться вместе. С декстрозой джелато обычно получается менее
    сладким и мягче при одинаковой температуре хранения.
  - >-
    Выход около 1 кг ориентировочный: фактическая масса будет зависеть от потерь
    на стенках кастрюли и блендера.
  - >-
    Фисташковая смесь густая и может нагружать блендер. Используй короткие
    импульсы и делай паузы; не продолжай работу, если мотор перегревается.
storage:
  - Храни джелато в герметичном контейнере в морозильнике. Для лучшей текстуры не допускай многократного оттаивания и повторного замораживания.
