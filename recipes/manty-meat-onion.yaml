id: manty-meat-onion
title: Манты с мясом и луком
description: Сочные манты с тонким упругим тестом, мясной начинкой, большим количеством лука и кусочками жира. Начинка остаётся сочной благодаря пару и крупному измельчению мяса.
category: main-dishes
subcategory: dumplings
tags: [манты, мясо, тесто, приготовление на пару, центральноазиатская кухня]
yield:
  quantity_min: 24
  quantity_max: 28
  unit: шт.
time:
  active_minutes_min: 60
  active_minutes_max: 80
  total_minutes_min: 120
  total_minutes_max: 150
equipment:
  - Тестомес Ankarsrum или миска для замеса
  - Мясорубка с решёткой 8 мм или острый нож
  - Скалка
  - Мантоварка или многоярусная пароварка
ingredient_groups:
  - id: dough
    title: Тесто
  - id: filling
    title: Мясная начинка
  - id: serving
    title: Для подачи
ingredients:
  - id: flour
    name: Пшеничная мука
    quantity: 500
    unit: г
    group: dough
  - id: water
    name: Вода
    quantity: 220
    unit: г
    group: dough
    note: Начни с 210 г; оставшиеся 10 г добавь, если мука забирает много воды.
  - id: egg
    name: Яйцо без скорлупы
    quantity: 50
    unit: г
    group: dough
  - id: dough-salt
    name: Соль для теста
    quantity: 8
    unit: г
    group: dough
  - id: meat
    name: Мясо
    quantity: 500
    unit: г
    group: filling
    note: Баранина — классический вариант; также подойдут говядина или смесь говядины со свининой. Не бери совсем постное мясо.
  - id: onion
    name: Репчатый лук, очищенный
    quantity: 350
    unit: г
    group: filling
    note: Вес после очистки.
  - id: fat
    name: Курдючный или свиной жир
    quantity: 80
    unit: г
    group: filling
    note: Нарезать кубиками 5–7 мм. Если мясо очень жирное, можно уменьшить до 40–50 г.
  - id: filling-salt
    name: Соль для начинки
    quantity: 9
    unit: г
    group: filling
  - id: cumin
    name: Зира
    quantity: 2
    unit: г
    group: filling
  - id: black-pepper
    name: Чёрный перец
    quantity: 1
    unit: г
    group: filling
  - id: oil
    name: Растительное масло для смазывания ярусов
    quantity: 15
    unit: г
    group: serving
    note: Примерное количество; использовать по необходимости.
steps:
  - id: dough
    title: Замесить тесто
    ingredients:
      - ingredient: flour
      - ingredient: water
      - ingredient: egg
      - ingredient: dough-salt
    instructions: Смешай муку с солью. Добавь яйцо и 210 г воды, замеси до грубого теста. При необходимости постепенно добавь оставшуюся воду. Вымешивай 8–10 минут до плотного, гладкого и упругого теста. В Ankarsrum используй ролик и нож; не добавляй воду сразу всю, если тесто уже собирается.
  - id: rest-dough
    title: Дать тесту отдохнуть
    instructions: Накрой тесто и оставь при комнатной температуре на 30–40 минут. После отдыха оно станет заметно податливее и будет легче раскатываться.
  - id: prepare-filling
    title: Подготовить начинку
    ingredients:
      - ingredient: meat
      - ingredient: onion
      - ingredient: fat
      - ingredient: filling-salt
      - ingredient: cumin
      - ingredient: black-pepper
    instructions: Мясо нарежь кусочками, подходящими для мясорубки, и пропусти через решётку 8 мм. Для более выраженной мясной текстуры можно нарезать мясо ножом кубиками 5–7 мм. Лук нарежь мелким кубиком ножом — не измельчай его в блендере и не отжимай сок. Жир нарежь кубиками 5–7 мм. Смешай мясо, лук, жир, соль, зиру и перец. Перемешивай только до равномерного распределения. Если начинка кажется суховатой, добавь 20–30 г холодной воды.
  - id: divide-dough
    title: Разделить и раскатать тесто
    instructions: Раздели тесто на 2–3 части, остальные держи накрытыми. Раскатай каждую часть в пласт толщиной около 1,5–2 мм и нарежь квадратами примерно 10–11 см. Не подпыляй мукой чрезмерно: сухие края хуже склеиваются.
  - id: fill-manty
    title: Сформовать манты
    instructions: На каждый квадрат положи примерно 30–35 г начинки. Соедини противоположные углы и тщательно защипни швы, затем сформуй привычную закрытую форму мантов. Не переполняй заготовки и не оставляй отверстий, через которые вытечет сок.
  - id: steam
    title: Приготовить на пару
    ingredients:
      - ingredient: oil
    instructions: Закипяти воду в мантоварке. Слегка смажь маслом решётки или окуни донышко каждого манта в масло, чтобы тесто не прилипало. Расставь манты с промежутками, чтобы они не соприкасались. Готовь под крышкой на активном пару 40–45 минут; время отсчитывай после восстановления устойчивого кипения.
  - id: serve
    title: Подать
    instructions: Осторожно сними манты, дай им постоять 1–2 минуты и подавай горячими. Хорошо подходят чёрный перец, немного сливочного масла или сметана; не прокалывай манты при переносе, чтобы сохранить сок внутри.
tips:
  - Лук здесь не второстепенный ингредиент: он отдаёт сок и помогает сделать начинку сочной. Не заменяй его луковой кашицей из блендера — текстура получится хуже.
  - Решётка 8 мм даёт более выраженную мясную текстуру, чем 4–6 мм. Не прокручивай мясо повторно.
  - Если используешь свиной жир из брикета, проверь, что это именно чистый топлёный жир без добавок; нарезать кубиками удобнее, когда он хорошо охлаждён или слегка подморожен.
  - Не укладывай манты вплотную: пар должен свободно проходить между ними.
storage:
  - Сырые сформованные манты можно заморозить на подносе в один слой, затем переложить в пакет. Готовь из замороженных без размораживания примерно 45–50 минут, проверяя готовность теста и начинки.
  - Готовые манты храни в холодильнике в закрытой ёмкости до 3 дней и разогревай на пару.
