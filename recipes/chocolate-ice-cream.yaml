id: chocolate-ice-cream
title: Шоколадное мороженое
description: Насыщенное шоколадное мороженое на заварной молочной основе с какао и тёмным шоколадом.
category: desserts
subcategory: ice-cream
tags: [мороженое, шоколад, какао, Ankarsrum]
yield:
  quantity: 1100
  unit: г
time:
  active_minutes: 35
  total_minutes_min: 420
  total_minutes_max: 900
equipment:
  - Ankarsrum с мороженицей
  - Кастрюля
  - Венчик или лопатка
ingredient_groups:
  - id: base
    title: Основа
ingredients:
  - id: milk
    name: Молоко 3–3,5%
    quantity: 560
    unit: г
    group: base
  - id: cream
    name: Сливки 30%
    quantity: 220
    unit: г
    group: base
  - id: sugar
    name: Сахар
    quantity: 125
    unit: г
    group: base
  - id: yolks
    name: Яичные желтки
    quantity: 75
    unit: г
    group: base
  - id: chocolate
    name: Тёмный шоколад 60–70%
    quantity: 120
    unit: г
    group: base
  - id: cocoa
    name: Какао-порошок без сахара
    quantity: 28
    unit: г
    group: base
  - id: skim-milk-powder
    name: Сухое обезжиренное молоко
    quantity: 25
    unit: г
    group: base
  - id: dextrose
    name: Декстроза
    quantity: 20
    unit: г
    group: base
    optional: true
  - id: locust-bean-gum
    name: Камедь рожкового дерева E410
    quantity: 0.8
    unit: г
    group: base
  - id: salt
    name: Соль
    quantity: 1
    unit: г
    group: base
steps:
  - id: dry
    title: Подготовить сухую смесь
    ingredients:
      - ingredient: sugar
      - ingredient: cocoa
      - ingredient: skim-milk-powder
      - ingredient: dextrose
      - ingredient: locust-bean-gum
      - ingredient: salt
    instructions: Смешай сахар, какао, сухое молоко, декстрозу, камедь и соль до однородности.
  - id: heat
    title: Нагреть молочную основу
    ingredients:
      - ingredient: milk
      - ingredient: cream
    instructions: Нагрей молоко со сливками примерно до 40 °C, постепенно вмешай сухую смесь венчиком. Нагрей до 60–70 °C.
  - id: chocolate
    title: Растворить шоколад
    ingredients:
      - ingredient: chocolate
    instructions: Сними кастрюлю с огня, добавь мелко нарезанный шоколад и размешай до полного растворения.
  - id: custard
    title: Заварить желтки
    ingredients:
      - ingredient: yolks
    instructions: Темперируй желтки частью горячей смеси, верни всё в кастрюлю и нагревай при постоянном перемешивании до 82–84 °C. Не кипяти.
  - id: chill
    title: Охладить и выдержать
    instructions: Пробей погружным блендером при необходимости до полной гладкости, быстро охлади и выдержи в холодильнике 6–12 часов.
  - id: churn
    title: Заморозить
    instructions: Перемешай основу и замораживай в чаше Ankarsrum до консистенции мягкого мороженого. Переложи в контейнер и дозаморозь 2–4 часа.
tips:
  - Для более выраженного вкуса выбирай шоколад 65–70%; для более мягкого — около 60%.
  - Декстроза делает мороженое мягче после морозильника; если её не добавлять, текстура будет плотнее.
storage:
  - Храни в герметичном контейнере в морозильнике.
