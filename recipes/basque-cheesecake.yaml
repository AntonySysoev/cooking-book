id: basque-cheesecake
title: Баскский чизкейк
description: Баскский чизкейк на смеси крем-чиза и маскарпоне: тёмная карамелизированная корочка и плотная, очень кремовая середина.
category: desserts
subcategory: cakes-and-pastries
tags: [чизкейк, крем-чиз, маскарпоне, баскский, десерт]
yield:
  quantity: 8
  unit: порций
time:
  active_minutes: 20
  total_minutes_min: 360
  total_minutes_max: 720
equipment:
  - Разъёмная форма диаметром 20 см
  - Пергамент
  - Ankarsrum с лопаткой
  - Термометр для проверки температуры центра, по желанию
ingredient_groups:
  - id: batter
    title: Основа
ingredients:
  - id: cream-cheese
    name: Крем-чиз
    quantity: 500
    unit: г
    group: batter
    note: Полностью жирный сливочный сыр, не плавленый; комнатной температуры.
  - id: mascarpone
    name: Маскарпоне
    quantity: 250
    unit: г
    group: batter
    note: Комнатной температуры.
  - id: cream
    name: Сливки 30%
    quantity: 250
    unit: г
    group: batter
  - id: eggs
    name: Яйца без скорлупы
    quantity: 200
    unit: г
    group: batter
    note: Примерно 4 крупных яйца; взвешивай без скорлупы.
  - id: sugar
    name: Белый сахар
    quantity: 180
    unit: г
    group: batter
  - id: starch
    name: Кукурузный крахмал
    quantity: 12
    unit: г
    group: batter
  - id: salt
    name: Соль
    quantity: 1
    unit: г
    group: batter
steps:
  - id: prepare
    title: Подготовить форму и духовку
    instructions: Разогрей духовку до фактических 230 °C, режим верхнего и нижнего нагрева без конвекции. Выстели форму диаметром 20 см двумя перекрёстными листами пергамента, оставляя края выше борта.
  - id: mix-cheeses
    title: Размешать сыры с сахаром
    ingredients:
      - ingredient: cream-cheese
      - ingredient: mascarpone
      - ingredient: sugar
      - ingredient: salt
    instructions: Доведи сыры до комнатной температуры. На низкой скорости размешай крем-чиз, маскарпоне, сахар и соль до гладкости. Не взбивай пышно: лишний воздух может привести к чрезмерному подъёму и последующему оседанию.
  - id: eggs
    title: Ввести яйца
    ingredients:
      - ingredient: eggs
    instructions: Вводи яйца порциями, каждый раз дожидаясь однородности. Не добавляй следующее яйцо, пока предыдущее не вмешалось.
  - id: cream-starch
    title: Добавить сливки и крахмал
    ingredients:
      - ingredient: cream
      - ingredient: starch
    instructions: Влей сливки и перемешай на низкой скорости. Просей кукурузный крахмал и вмешай до однородности. Если остались комочки, пропусти массу через сито.
  - id: bake
    title: Выпечь до тёмной корочки
    instructions: Перелей массу в подготовленную форму. Выпекай при фактических 230 °C примерно 35–45 минут, пока верх не станет очень тёмно-коричневым, а центр при лёгком покачивании формы будет заметно дрожать. Если используешь термометр, ориентир температуры центра — около 68–72 °C. Если корочка не успевает потемнеть, кратко включи верхний гриль в конце, внимательно наблюдая за поверхностью.
  - id: cool
    title: Остудить и стабилизировать
    instructions: Дай чизкейку остыть в форме при комнатной температуре. Затем убери в холодильник минимум на 6 часов, лучше на ночь. Перед подачей можно подержать при комнатной температуре 20–30 минут, чтобы кремовая текстура раскрылась.
tips:
  - Масса должна быть гладкой, но не воздушной; перемешивай на низкой скорости и очищай стенки чаши.
  - Не жди, пока центр станет неподвижным в духовке: при охлаждении чизкейк уплотнится.
  - Пергамент должен выступать над формой, поскольку чизкейк сильно поднимается во время выпечки.
storage:
  - Храни в холодильнике при температуре не выше 4 °C до 4 дней.
