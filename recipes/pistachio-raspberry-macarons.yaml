id: pistachio-raspberry-macarons
title: Французские макароны с фисташкой и малиной
description: >-
  Макароны на итальянской меренге с тонкой хрустящей оболочкой, нежным ганашем
  из домашних фисташек и яркой малиновой сердцевиной. Вкус натуральный,
  ореховый, с выраженной ягодной кислинкой и умеренной сладостью начинки.
category: desserts
subcategory: cakes-and-pastries
tags:
  - макароны
  - macarons
  - фисташка
  - малина
  - итальянская меренга
  - ганаш
yield:
  quantity: 32
  unit: макарона
time:
  active_minutes: 100
  total_minutes_min: 300
  total_minutes_max: 420
equipment:
  - Весы с точностью до 0,1 г
  - Планетарный тестомес Ankarsrum с Balloon Whisks для взбивания белков
  - Блендер Ninja с небольшой чашей PowerBowl
  - Кондитерский мешок с круглой насадкой 8–10 мм
  - Кухонный термометр для сахарного сиропа
  - Противни и пергамент для выпечки
  - Сито для миндальной муки и сахарной пудры
  - Сетка для орехового молока или мелкое сито для малины
ingredient_groups:
  - id: shells
    title: Миндальные оболочки
  - id: pistachio-ganache
    title: Фисташковый ганаш
  - id: raspberry-insert
    title: Малиновая сердцевина
ingredients:
  - id: almond-flour
    name: Миндальная мука
    quantity: 150
    unit: г
    group: shells
    note: Мелкого помола, без крупных частиц.
  - id: icing-sugar
    name: Сахарная пудра
    quantity: 150
    unit: г
    group: shells
  - id: egg-whites
    name: Яичные белки
    quantity: 110
    unit: г
    group: shells
    note: Без следов желтка; разделить на две порции по 55 г.
    parts:
      - id: almond-mixture
        name: Для миндальной пасты
        quantity: 55
        group: shells
      - id: meringue
        name: Для меренги
        quantity: 55
        group: shells
  - id: caster-sugar
    name: Сахар
    quantity: 150
    unit: г
    group: shells
  - id: syrup-water
    name: Вода для сиропа
    quantity: 38
    unit: г
    group: shells
  - id: pistachios
    name: Фисташки очищенные, сырые
    quantity: 100
    unit: г
    group: pistachio-ganache
    note: Без соли; слегка прогреть для раскрытия аромата и полностью остудить.
  - id: white-chocolate
    name: Белый шоколад
    quantity: 75
    unit: г
    group: pistachio-ganache
    note: Обычный магазинный шоколад, мелко нарубленный.
  - id: cream
    name: Сливки 30%
    quantity: 65
    unit: г
    group: pistachio-ganache
    note: 20–25 г использовать при измельчении фисташек, остальное — для эмульсии.
  - id: ganache-salt
    name: Мелкая соль
    quantity: 0.4
    unit: г
    group: pistachio-ganache
  - id: raspberries
    name: Малина свежая или замороженная
    quantity: 120
    unit: г
    group: raspberry-insert
  - id: raspberry-sugar
    name: Сахар
    quantity: 10
    unit: г
    group: raspberry-insert
  - id: pectin
    name: Пектин NH
    quantity: 1.6
    unit: г
    group: raspberry-insert
    note: Формула рассчитана именно на NH; обычный яблочный пектин не заменять в той же дозировке.
  - id: lemon-juice
    name: Лимонный сок
    quantity: 4
    unit: г
    group: raspberry-insert
steps:
  - id: prepare
    title: Подготовить ингредиенты и противни
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
      - ingredient: egg-whites
        part: almond-mixture
      - ingredient: egg-whites
        part: meringue
      - ingredient: caster-sugar
      - ingredient: syrup-water
    instructions: >-
      Заранее точно отвесь все ингредиенты. Протри чашу и венчики для белков
      обезжиренной салфеткой. Подготовь шаблон кругов диаметром 3,5–4 см под
      пергаментом. Для равномерной выпечки лучше отсаживать оболочки на холодный
      противень; перед следующей партией полностью остуди его.
  - id: roast-pistachios
    title: Раскрыть аромат фисташек
    ingredients:
      - ingredient: pistachios
    instructions: >-
      Разложи сырые очищенные фисташки в один слой и прогрей в духовке при
      фактической температуре 130 °C примерно 8–10 минут, пока не появится
      лёгкий ореховый аромат. Не допускай потемнения. Полностью остуди.
      Если хочешь максимально свежий, травянистый профиль, этот прогрев можно
      пропустить.
  - id: make-raspberry-insert
    title: Приготовить малиновую сердцевину
    ingredients:
      - ingredient: raspberries
      - ingredient: raspberry-sugar
      - ingredient: pectin
      - ingredient: lemon-juice
    instructions: >-
      Разомни малину и слегка прогрей до 40–50 °C, чтобы пюре легче проходило
      через сетку для орехового молока. Протри через мелкую сетку или сито,
      аккуратно отжимая мякоть, но не продавливая семена. Отмерь полученное
      пюре: ориентир — около 90 г. Смешай сахар с пектином. Нагрей пюре примерно
      до 40 °C, всыпь сахарно-пектиновую смесь тонкой струёй, постоянно
      перемешивая, доведи до кипения и провари 30–60 секунд. Сними с огня,
      добавь лимонный сок и перемешай. Переложи в неглубокую ёмкость, накрой
      плёнкой в контакт и охлади до полного загустения. Если после фильтрации
      пюре заметно меньше 80 г, уменьши количество пектина и сахара пропорционально
      фактической массе пюре.
  - id: sift-dry
    title: Подготовить сухую смесь
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
    instructions: >-
      Просей миндальную муку и сахарную пудру вместе. Если остаются крупные
      кусочки миндаля, измельчи их отдельно короткими импульсами и просей снова.
      Не перемалывай долго: миндаль может начать выделять масло.
  - id: make-almond-paste
    title: Смешать миндальную пасту
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
      - ingredient: egg-whites
        part: almond-mixture
    instructions: >-
      Добавь 55 г белков к сухой смеси и тщательно перемешай лопаткой до густой
      однородной миндальной пасты. Накрой, чтобы поверхность не подсыхала,
      пока готовится сироп и меренга.
  - id: make-italian-meringue
    title: Приготовить итальянскую меренгу
    ingredients:
      - ingredient: egg-whites
        part: meringue
      - ingredient: caster-sugar
      - ingredient: syrup-water
    instructions: >-
      В небольшом сотейнике смешай сахар и воду. Нагревай без перемешивания
      после растворения сахара до 118 °C по термометру. Когда сироп достигнет
      примерно 108–110 °C, начни взбивать оставшиеся 55 г белков в Ankarsrum
      с Balloon Whisks до мягких пиков. Не останавливая взбивание, влей сироп
      тонкой струёй между венчиком и стенкой чаши. Взбивай до плотной блестящей
      меренги, пока чаша не станет лишь слегка тёплой, а температура меренги
      не опустится примерно до 40–45 °C. Следи, чтобы сироп не попадал на венчик
      и стенки чаши.
  - id: macaronage
    title: Выполнить макаронаж
    ingredients:
      - ingredient: egg-whites
        part: almond-mixture
      - ingredient: egg-whites
        part: meringue
      - ingredient: almond-flour
      - ingredient: icing-sugar
    instructions: >-
      Вмешай примерно треть меренги в миндальную пасту, чтобы облегчить её.
      Затем в 2–3 приёма введи оставшуюся меренгу лопаткой, складывая массу
      снизу вверх и поворачивая миску. Остановись, когда тесто станет блестящим
      и будет стекать с лопатки непрерывной широкой лентой; след от ленты должен
      постепенно сливаться с поверхностью примерно за 10–20 секунд. Не перемешивай
      до жидкого состояния.
  - id: pipe-shells
    title: Отсадить оболочки
    instructions: >-
      Переложи массу в кондитерский мешок с круглой насадкой 8–10 мм и отсади
      круги диаметром 3,5–4 см, держа мешок вертикально. Несколько раз уверенно
      постучи противнем по столу, чтобы вышли крупные пузырьки воздуха. Проколи
      видимые пузырьки зубочисткой. Оставь оболочки при комнатной температуре
      примерно на 20–45 минут, пока поверхность не станет сухой на ощупь и не
      будет прилипать к чистому пальцу. Влажность воздуха может заметно менять
      время подсушивания.
  - id: bake-shells
    title: Выпечь оболочки
    instructions: >-
      Разогрей духовку до фактической температуры 145 °C, верхний и нижний
      нагрев, без конвекции. Выпекай один противень за раз на среднем уровне
      примерно 15–18 минут. Начни проверять с 14-й минуты: готовая оболочка
      держит юбочку, верх не скользит отдельно от основания при очень лёгком
      касании, а низ отделяется от пергамента после полного остывания. Если
      оболочки темнеют, снизь температуру на 5 °C в следующей партии; если
      трескаются, проверь подсушивание, пузырьки и стабильность нагрева. Полностью
      остуди перед снятием с пергамента.
  - id: make-pistachio-ganache
    title: Приготовить фисташковый ганаш
    ingredients:
      - ingredient: pistachios
      - ingredient: white-chocolate
      - ingredient: cream
      - ingredient: ganache-salt
    instructions: >-
      Положи остывшие фисташки в PowerBowl Ninja и измельчи короткими импульсами.
      Добавь 20–25 г сливок из общего количества и продолжай измельчать, регулярно
      останавливая мотор и соскребая массу со стенок. Если масса перестала
      захватываться ножом, добавляй оставшиеся сливки понемногу; не перегревай
      блендер и смесь. Цель — максимально мелкая густая фисташково-сливочная
      масса, а не жидкость. Растопи белый шоколад импульсами или на водяной бане,
      не перегревая. Подогрей оставшиеся сливки до горячего состояния, но не
      кипяти, и постепенно эмульгируй с шоколадом. Введи фисташковую смесь и
      соль, перемешай до однородности. При наличии погружного блендера можно
      кратко пробить эмульсию, удерживая насадку погружённой, чтобы не вводить
      воздух. Накрой плёнкой в контакт и охлади в холодильнике не менее 6 часов,
      лучше 10–12 часов.
  - id: fill-macarons
    title: Собрать макароны
    ingredients:
      - ingredient: pistachios
      - ingredient: white-chocolate
      - ingredient: cream
      - ingredient: ganache-salt
      - ingredient: raspberries
      - ingredient: raspberry-sugar
      - ingredient: pectin
      - ingredient: lemon-juice
    instructions: >-
      Подбери оболочки попарно по размеру. Переложи стабилизированный ганаш в
      кондитерский мешок и отсади кольцо или невысокий валик по краю одной
      половинки, оставляя центр свободным. В центр добавь примерно 1,5–2 г
      малиновой вставки, затем слегка прижми второй половинкой так, чтобы начинка
      подошла к центру, но не вытекала. На один макарон ориентируйся примерно
      на 5–6 г ганаша и 1,5–2 г малиновой вставки; не обязательно использовать всю начинку.
  - id: mature
    title: Дать макаронам созреть
    instructions: >-
      Разложи макароны в герметичный контейнер одним слоем или слоями с пергаментом
      между ними. Убери в холодильник на 12–24 часа: оболочка станет нежнее,
      а вкус фисташки и малины объединится. Перед подачей дай постоять при комнатной
      температуре примерно 15–20 минут.
tips:
  - >-
    Для итальянской меренги особенно важно точно отвесить белки и сироп, а также
    довести сироп до 118 °C. Капли сиропа на стенке сотейника могут кристаллизоваться.
  - >-
    Магазинный белый шоколад различается по содержанию какао-масла и сахара.
    Если после стабилизации ганаш слишком мягкий, в следующей партии немного
    увеличь шоколад; если чрезмерно плотный — слегка увеличь сливки.
  - >-
    Натуральная фисташковая паста со сливками может остаться чуть зернистой.
    Измельчай короткими импульсами и не перегружай PowerBowl. Не добавляй
    нейтральное масло автоматически: оно ослабит чистый ореховый вкус.
  - >-
    Сетка для орехового молока подходит для удаления малиновых косточек, но
    очень мелкие частицы могут пройти сквозь неё. При необходимости используй
    мелкое сито.
  - >-
    Не добавляй фисташковую пасту в оболочки: дополнительный жир может ухудшить
    структуру меренги. Пусть фисташка остаётся в ганаше.
  - >-
    Цвет оболочек оставлен натуральным. Для этой версии важнее чистый вкус,
    чем ярко-зелёный цвет.
storage:
  - >-
    Храни собранные макароны в герметичном контейнере в холодильнике до 3 дней.
    Перед подачей дай им немного согреться. Из-за сливочной начинки не оставляй
    их надолго при комнатной температуре.
  - >-
    Незаполненные полностью остывшие оболочки можно заморозить в герметичном
    контейнере. Размораживай в закрытом контейнере, чтобы на поверхности
    не образовался конденсат.
