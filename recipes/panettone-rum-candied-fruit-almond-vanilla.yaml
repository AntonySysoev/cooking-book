id: panettone-rum-candied-fruit-almond-vanilla
title: Панеттоне с ромовыми цукатами, миндалём и ванилью
description: >-
  Воздушная итальянская сдоба с волокнистым мякишем, цукатами,
  вымоченными в роме, апельсиновой цедрой, ванилью и тонким миндальным ароматом.
  Тесто готовится в Ankarsrum на ночной опаре с дрожжами.
category: baking-and-dough
also_in: [desserts]
subcategory: buns-and-pastries
tags:
  - панеттоне
  - итальянская выпечка
  - цукаты
  - ром
  - ваниль
  - миндаль
  - сдобное тесто
yield:
  quantity: 1
  unit: большой панеттоне (около 1,15 кг теста)
time:
  active_minutes: 90
  total_minutes_min: 1260
  total_minutes_max: 1680
equipment:
  - Тестомес Ankarsrum
  - Ролик и скребок Ankarsrum
  - Весы с точностью до 0,1 г
  - Большая ёмкость для брожения
  - Бумажная форма для панеттоне диаметром около 16 см и высотой 11–12 см
  - Острый нож или лезвие
  - Термометр-щуп
  - Две длинные металлические спицы для охлаждения вверх дном
ingredient_groups:
  - id: preferment
    title: Ночная опара
  - id: dough
    title: Основное тесто
  - id: inclusions
    title: Цукаты и оформление
ingredients:
  - id: flour
    name: Сильная пшеничная мука
    quantity: 450
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 100
        group: preferment
      - id: dough
        name: В основное тесто
        quantity: 350
        group: dough
    note: >-
      Предпочтительна хлебная мука с содержанием белка около 13–14%.
  - id: water
    name: Вода
    quantity: 95
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 70
        group: preferment
      - id: dough
        name: В основное тесто
        quantity: 25
        group: dough
  - id: yeast
    name: Инстантные сухие дрожжи
    quantity: 3.2
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 0.2
        group: preferment
      - id: dough
        name: В основное тесто
        quantity: 3
        group: dough
    note: Для свежих дрожжей потребуется примерно 9–10 г на весь рецепт.
  - id: eggs
    name: Яйца без скорлупы
    quantity: 100
    unit: г
    group: dough
    note: Примерно 2 яйца; ориентируйся на массу.
  - id: yolks
    name: Яичные желтки
    quantity: 75
    unit: г
    group: dough
    note: Примерно 4 желтка, в зависимости от размера яиц.
  - id: sugar
    name: Сахар
    quantity: 90
    unit: г
    group: dough
  - id: honey
    name: Мёд
    quantity: 15
    unit: г
    group: dough
  - id: butter
    name: Сливочное масло 82%
    quantity: 130
    unit: г
    group: dough
    note: Пластичное, примерно 18–20 °C, не растопленное.
  - id: salt
    name: Соль
    quantity: 7
    unit: г
    group: dough
  - id: vanilla
    name: Ванильный экстракт
    quantity: 5
    unit: г
    group: dough
  - id: almond-extract
    name: Миндальный экстракт
    quantity: 1
    unit: г
    group: dough
    note: Не увеличивай количество без проверки интенсивности экстракта.
  - id: orange-zest
    name: Свежая апельсиновая цедра
    quantity: 5
    unit: г
    group: dough
  - id: candied-fruit
    name: Цукаты, вымоченные в роме
    quantity: 150
    unit: г
    group: inclusions
    note: Масса после стекания лишнего рома и обсушивания поверхности.
  - id: almond-flakes
    name: Миндальные лепестки
    quantity: 20
    unit: г
    group: inclusions
    optional: true
  - id: butter-finish
    name: Сливочное масло для надреза
    quantity: 5
    unit: г
    group: inclusions
steps:
  - id: prepare-fruit
    title: Подготовить ромовые цукаты
    ingredients:
      - ingredient: candied-fruit
    instructions: >-
      Если цукаты уже вымочены в роме, повторно не замачивай их. Откинь на сито
      на 30–60 минут, затем тщательно промокни поверхность бумажным полотенцем.
      Крупные кусочки нарежь размером около 5–7 мм и отвесь 150 г после обсушивания.
      Не выливай весь ром в тесто: лишняя жидкость и спирт могут ухудшить развитие
      клейковины.
  - id: make-preferment
    title: Замесить ночную опару
    ingredients:
      - ingredient: flour
        part: preferment
      - ingredient: water
        part: preferment
      - ingredient: yeast
        part: preferment
    instructions: >-
      Смешай 100 г муки, 70 г воды и 0,2 г дрожжей до однородного плотного теста.
      Накрой и оставь на 10–14 часов при фактической температуре 20–22 °C.
      К утру опара должна заметно увеличиться, стать пористой и иметь чистый,
      слегка сладковатый дрожжевой аромат. Не используй опару, которая полностью
      осела и резко пахнет спиртом.
  - id: prepare-dough
    title: Подготовить ингредиенты для теста
    ingredients:
      - ingredient: eggs
      - ingredient: yolks
      - ingredient: butter
      - ingredient: sugar
      - ingredient: honey
      - ingredient: salt
      - ingredient: vanilla
      - ingredient: almond-extract
      - ingredient: orange-zest
    instructions: >-
      Нарежь масло кубиками и оставь пластичным при 18–20 °C. Растери апельсиновую
      цедру с сахаром пальцами, чтобы высвободить эфирные масла. Яйца и желтки
      взвесь отдельно; они должны быть прохладными или комнатной температуры,
      но не тёплыми.
  - id: develop-gluten
    title: Развить клейковину
    ingredients:
      - ingredient: flour
        part: dough
      - ingredient: water
        part: dough
      - ingredient: yeast
        part: dough
      - ingredient: eggs
      - ingredient: yolks
    instructions: >-
      Установи в Ankarsrum ролик и скребок. Раздели опару на небольшие кусочки.
      Добавь опару, 350 г муки, 25 г воды, 3 г дрожжей, яйца и желтки.
      Начни на низкой скорости до исчезновения сухой муки, затем меси на умеренной
      скорости до гладкого, связного и эластичного теста. В зависимости от муки
      это может занять 10–20 минут. До добавления сахара и масла тесто должно
      растягиваться в тонкую плёнку, прежде чем порвётся.
  - id: add-sugar
    title: Ввести сахар и мёд
    ingredients:
      - ingredient: sugar
      - ingredient: honey
    instructions: >-
      Добавляй сахар с цедрой в 3–4 приёма, каждый раз дожидаясь, пока тесто снова
      соберётся и станет однородным. Затем введи мёд. После добавления сахара
      тесто временно может стать более рыхлым — продолжай замес, пока структура
      не восстановится.
  - id: add-butter
    title: Постепенно ввести масло
    ingredients:
      - ingredient: butter
    instructions: >-
      Вводи мягкое масло порциями по 10–15 г, не добавляя следующую порцию,
      пока предыдущая полностью не поглощена. Если масло начинает мазаться
      по стенкам, останови машину на 3–5 минут и дай тесту остыть. Не подсыпай
      дополнительную муку. После введения масла тесто должно быть гладким,
      блестящим и очень эластичным.
  - id: season-dough
    title: Завершить замес
    ingredients:
      - ingredient: salt
      - ingredient: vanilla
      - ingredient: almond-extract
    instructions: >-
      Введи соль, ванильный и миндальный экстракты. Продолжай замес до полной
      однородности и хорошего развития клейковины. Целевая температура теста
      после замеса — 24–26 °C; если оно приближается к 28 °C, остановись и
      охлади его. Готовое тесто должно проходить проверку на тонкую полупрозрачную
      плёнку.
  - id: first-proof
    title: Первое брожение
    instructions: >-
      Переложи тесто в слегка смазанную маслом ёмкость и накрой. Оставь при
      фактической температуре около 26 °C на 1,5–2,5 часа, пока оно заметно
      не увеличится и не станет воздушным. Не обязательно ждать удвоения объёма;
      ориентируйся на состояние теста.
  - id: add-fruit
    title: Вмешать цукаты
    ingredients:
      - ingredient: candied-fruit
    instructions: >-
      Осторожно выложи тесто на рабочую поверхность и расплющи в прямоугольник.
      Равномерно распредели 150 г цукатов, сложи тесто конвертом и аккуратно
      сверни. Не вымешивай долго, чтобы не повредить клейковинный каркас.
  - id: pre-shape
    title: Предварительно округлить
    instructions: >-
      Собери тесто в шар, подтягивая края к центру. Накрой и оставь на столе
      на 20–30 минут. Не используй много муки; при необходимости слегка смажь
      руки и рабочую поверхность маслом.
  - id: final-shape
    title: Сформовать и переложить в форму
    instructions: >-
      Повторно округли тесто, создавая натяжение на поверхности. Переложи швом
      вниз в бумажную форму для панеттоне диаметром около 16 см и высотой
      11–12 см. Форма должна быть рассчитана примерно на 1 кг выпечки.
  - id: final-proof
    title: Финальная расстойка
    instructions: >-
      Накрой так, чтобы поверхность не подсыхала, и оставь при фактической
      температуре 27–28 °C ориентировочно на 3–5 часов. Тесто должно подняться
      примерно до 1–2 см ниже края формы и стать очень воздушным. Не начинай
      выпечку, пока тесто заметно не поднимется.
  - id: score
    title: Надрезать поверхность
    ingredients:
      - ingredient: butter-finish
      - ingredient: almond-flakes
    instructions: >-
      Разогрей духовку до фактических 170 °C в режиме верхнего и нижнего нагрева,
      без конвекции. Острым лезвием сделай неглубокий крест на поверхности теста.
      Слегка приподними четыре уголка надреза и положи в центр 5 г сливочного
      масла. При желании посыпь миндальными лепестками, не прижимая их к тесту.
  - id: bake
    title: Выпечь до готовности
    instructions: >-
      Поставь форму на решётку в нижнюю или средне-нижнюю часть духовки. Выпекай
      первые 15 минут при фактических 170 °C, затем снизь до 160 °C и выпекай
      ещё примерно 30–40 минут. Если верх быстро темнеет, прикрой фольгой.
      Готовность определяй термометром: температура в центре мякиша должна
      достигнуть 93–94 °C. Общее время обычно около 45–55 минут, но ориентируйся
      прежде всего на температуру в центре.
  - id: invert-cool
    title: Охладить вверх дном
    instructions: >-
      Ещё до выпечки подготовь две длинные металлические спицы и устойчивые опоры.
      Сразу после духовки аккуратно проколи бумажную форму насквозь в нижней
      части, примерно в 2 см от основания, и переверни панеттоне вверх дном,
      опирая концы спиц на опоры. Оставь минимум на 6–8 часов, до полного
      остывания. Не используй тонкие деревянные шпажки, которые могут прогнуться.
  - id: store
    title: Упаковать после остывания
    instructions: >-
      Когда панеттоне полностью остынет, герметично упакуй его. Дай ароматам
      объединиться в течение 12–24 часов. Не упаковывай горячую выпечку, чтобы
      не образовался конденсат.
tips:
  - >-
    Сильная мука и полноценное развитие клейковины до введения масла важнее,
    чем точное время замеса.
  - >-
    Не добавляй в тесто весь ром от замачивания цукатов: избыток жидкости и
    спирта затрудняет развитие структуры.
  - >-
    Для волокнистого мякиша необходимы полная финальная расстойка и охлаждение
    вверх дном.
storage:
  - >-
    После полного остывания храни герметично упакованным при комнатной
    температуре несколько дней. Для более длительного хранения заморозь.
