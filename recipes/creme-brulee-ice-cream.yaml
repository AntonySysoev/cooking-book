id: creme-brulee-ice-cream
title: Мороженое «Крем-брюле» с ванилью и виски
description: Богатое сливочное мороженое на заварной основе с глубокой карамелью, натуральной мадагаскарской ванилью и лёгким ароматом Jack Daniel's. Декстрозу можно заменить равной массой белого сахара.
category: desserts
subcategory: ice-cream

tags: [мороженое, крем-брюле, карамель, ваниль, виски, Ankarsrum]
yield:
  quantity: 1150
  unit: г
time:
  active_minutes: 45
  total_minutes_min: 600
  total_minutes_max: 1080
equipment:
  - Ankarsrum с мороженицей
  - Кастрюля с толстым дном
  - Погружной блендер
  - Мелкое сито
  - Термометр
ingredients:
  - id: cream
    name: Сливки 30%
    quantity: 500
    unit: г
  - id: milk
    name: Молоко 3–3,5%
    quantity: 285
    unit: г
  - id: skim-milk-powder
    name: Сухое обезжиренное молоко
    quantity: 25
    unit: г
  - id: yolks
    name: Яичные желтки
    quantity: 90
    unit: г
  - id: caramel-sugar
    name: Белый сахар для карамели
    quantity: 112
    unit: г
  - id: muscovado
    name: Светлый мусковадо
    quantity: 28
    unit: г
  - id: dextrose
    name: Декстроза (можно заменить 35 г белого сахара)
    quantity: 35
    unit: г
  - id: water
    name: Вода для карамели
    quantity: 38
    unit: г
  - id: locust-bean-gum
    name: Камедь рожкового дерева E410
    quantity: 0.6
    unit: г
  - id: salt
    name: Соль
    quantity: 0.8
    unit: г
  - id: vanilla-pod
    name: Стручок мадагаскарской ванили
    quantity: 1.5
    unit: г
  - id: whiskey
    name: Jack Daniel's, 45%
    quantity: 12
    unit: г
steps:
  - id: vanilla-infusion
    title: Ароматизировать молочно-сливочную смесь
    ingredients:
      - ingredient: cream
      - ingredient: milk
      - ingredient: vanilla-pod
    instructions: >-
      Разрежь стручок вдоль, выскреби семена. Добавь семена и сам стручок к молоку и сливкам. Медленно нагрей до 65–70 °C, сними с огня, накрой и оставь на 20–30 минут. Пока смесь настаивается, приготовь карамель.
  - id: caramel
    title: Приготовить карамель
    ingredients:
      - ingredient: caramel-sugar
      - ingredient: water
    instructions: >-
      Соедини сахар с водой в сотейнике. Нагревай без перемешивания ложкой до 175–178 °C и глубокого янтарно-медного оттенка. Не передерживай: слишком тёмная карамель будет горчить.
  - id: deglaze
    title: Растворить карамель в молочной смеси
    ingredients:
      - ingredient: cream
      - ingredient: milk
    instructions: >-
      Удали стручок ванили. Подогрей примерно половину настоявшейся молочно-сливочной смеси почти до кипения. Осторожно, небольшими порциями, введи её в карамель, постоянно перемешивая: смесь будет сильно пениться. Если карамель затвердеет, прогрей на слабом огне до полного растворения. Соедини с оставшейся молочно-сливочной смесью.
  - id: dry-mix
    title: Подготовить сухую смесь
    ingredients:
      - ingredient: skim-milk-powder
      - ingredient: muscovado
      - ingredient: dextrose
      - ingredient: locust-bean-gum
      - ingredient: salt
    instructions: >-
      Тщательно смешай сухое молоко, мусковадо, декстрозу, камедь и соль венчиком, разбивая комочки. Если используешь сахар вместо декстрозы, возьми 35 г белого сахара.
  - id: custard
    title: Заварить мороженую основу
    ingredients:
      - ingredient: yolks
    instructions: >-
      Нагрей карамельно-молочную смесь примерно до 40 °C. Постепенно всыпь сухую смесь при интенсивном перемешивании погружным блендером. Отдельно слегка размешай желтки, темперируй их частью горячей смеси и верни всё в кастрюлю. Нагревай при постоянном перемешивании до 82–84 °C, не допуская кипения. Подержи при этой температуре около минуты, чтобы камедь полностью гидратировалась.
  - id: chill
    title: Процедить, охладить и выдержать
    instructions: >-
      Процеди основу через мелкое сито и быстро охлади в холодной водяной бане. Когда смесь остынет до 10 °C или ниже, вмешай виски. Накрой плёнкой в контакт и выдержи в холодильнике при 2–4 °C минимум 6 часов, предпочтительно 8–12 часов.
  - id: churn
    title: Заморозить в мороженице
    instructions: >-
      Перемешай созревшую основу и замораживай в предварительно подготовленной чаше мороженицы Ankarsrum до плотной консистенции мягкого мороженого. Переложи в охлаждённый герметичный контейнер, разровняй и дозаморозь при −18 °C примерно 4–6 часов.
tips:
  - Без декстрозы используй вместо неё ровно 35 г белого сахара. Мороженое получится немного слаще и твёрже после хранения в морозильнике.
  - Масса 1,5 г относится ко всему стручку ванили вместе с семенами; используй и семена, и сам стручок для настаивания.
  - Для карамели используй белый сахар, а не мусковадо: так проще контролировать цвет и получить чистый карамельный вкус. Светлый мусковадо добавляется в заварную основу.
  - Виски добавляй только в охлаждённую основу: нагревать его не нужно.
  - Декстроза и алкоголь смягчают мороженое при отрицательной температуре. Не увеличивай их количество без корректировки общего сахарного баланса.
storage:
  - Храни в морозильнике при −18 °C в герметичном контейнере. Для более удобной подачи дай постоять при комнатной температуре несколько минут.
