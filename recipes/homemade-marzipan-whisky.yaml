id: homemade-marzipan-whisky
title: Домашний марципан с виски
description: >-
  Миндальный марципан с умеренной сладостью и выраженным вкусом сырого миндаля.
  Одна базовая масса подходит и для шоколадных конфет, и для выпечки:
  консистенцию регулируют количеством воды в зависимости от способа формовки.
  Сахарная пудра измельчается вместе с охлаждённым миндалём, а виски добавляет
  мягкие ванильно-древесные ноты.
category: desserts
subcategory: cookies-and-candies
tags: [марципан, миндаль, домашние конфеты, начинка, штоллен, виски]
yield:
  quantity: 1
  unit: порция (около 325 г)
time:
  active_minutes: 25
  total_minutes_min: 145
  total_minutes_max: 1485
equipment:
  - Блендер Ninja с чашей PowerBowl или основной чашей с ножом
  - Весы с точностью до 0,1 г
  - Сито для сахарной пудры (по необходимости)
  - Пищевая плёнка
ingredient_groups:
  - id: almond-base
    title: Миндальная основа
  - id: binding
    title: Для связывания
ingredients:
  - id: almonds
    name: Сырой бланшированный миндаль
    quantity: 200
    unit: г
    group: almond-base
  - id: powdered-sugar
    name: Сахарная пудра
    quantity: 110
    unit: г
    group: almond-base
  - id: whiskey
    name: Виски
    quantity: 8
    unit: г
    group: binding
    note: Подойдёт мягкий виски без добавленного сахара; Tennessee whiskey или бурбон дадут ванильно-карамельные ноты.
  - id: water
    name: Холодная вода
    quantity_min: 6
    quantity_max: 10
    unit: г
    group: binding
    note: Добавляй постепенно. Для конфет обычно достаточно нижней границы; для начинки выпечки может понадобиться верхняя граница или ещё 1–3 г при формовке.
  - id: salt
    name: Мелкая соль
    quantity: 0.4
    unit: г
    group: binding
steps:
  - id: prepare-almonds
    title: Подготовить миндаль
    ingredients:
      - ingredient: almonds
    instructions: >-
      Если миндаль не бланшированный, залей его кипятком на 1–2 минуты,
      слей воду и сними коричневую кожицу. Разложи ядра и полностью обсуши:
      на поверхности не должно оставаться влаги. Для более чистого вкуса
      не обжаривай миндаль. Чтобы ножи меньше нагревали орехи, охлади сухой
      миндаль в морозилке 20–30 минут непосредственно перед измельчением.
  - id: grind
    title: Измельчить миндаль с пудрой
    ingredients:
      - ingredient: almonds
      - ingredient: powdered-sugar
    instructions: >-
      Смешай миндаль с сахарной пудрой до измельчения. Работай короткими
      импульсами, останавливаясь и очищая стенки чаши по необходимости.
      Удобно измельчать в два захода по 100 г миндаля и 55 г пудры.
      В Ninja используй PowerBowl, если масса свободно захватывается ножами;
      не утрамбовывай её и не запускай мотор надолго непрерывно. Остановись,
      когда получится мелкая однородная крошка, до выделения масла и
      превращения смеси в жирную пасту. Если есть крупные частицы, просей
      массу и отдельно измельчи остаток.
  - id: combine
    title: Собрать марципан
    ingredients:
      - ingredient: whiskey
      - ingredient: water
      - ingredient: salt
    instructions: >-
      Переложи миндально-сахарную крошку в миску. Добавь виски и соль,
      перемешай. Воду вводи постепенно, небольшими порциями, каждый раз
      тщательно перемешивая и сжимая массу рукой. Остановись, когда марципан
      начнёт собираться в пластичный комок и перестанет рассыпаться.
      Необязательно использовать всю воду: итоговое количество зависит
      от влажности миндаля и тонкости помола. Не добавляй лишнюю жидкость,
      иначе масса станет липкой.
  - id: rest
    title: Выдержать и использовать
    instructions: >-
      Сформируй плотный брусок, заверни в пищевую плёнку и убери в холодильник
      минимум на 2 часа, лучше на 12–24 часа. За это время влага распределится,
      а текстура станет более однородной. Перед формовкой дай марципану немного
      согреться при комнатной температуре. Выбери консистенцию под задачу:
      для шоколадных конфет держи массу плотной и формоустойчивой; для выпечки
      она должна быть мягче и пластичнее, чтобы раскатываться в цилиндр без
      трещин. Если марципан для выпечки крошится или трескается при раскатке,
      вмешай дополнительно 1–3 г воды, понемногу, и дай массе постоять
      несколько минут. Для штоллена сформируй цилиндр и полностью оберни
      его тестом, чтобы начинка не выступала наружу.
tips:
  - >-
    Доля миндаля составляет около 64,5% от суммы миндаля и сахара
    (200 г из 310 г). Это единая базовая пропорция для конфет и выпечки:
    не нужно готовить два разных марципана, достаточно подобрать влажность
    и плотность при формовке.
  - >-
    Для шоколадных конфет используй более плотную массу: начни с 6 г воды
    и добавляй ещё только если крошка не собирается. Сформируй брусок,
    охлади до уплотнения и покрой темперированным шоколадом. Для бруска
    около 150 г ориентир — 115–125 г марципана и 25–35 г шоколада.
  - >-
    Для выпечки, в том числе штоллена, нужна более податливая масса:
    используй воду в пределах указанного диапазона, а если при раскатке
    появляются трещины, добавь ещё 1–3 г воды. Марципан должен гнуться
    и раскатываться без растрескивания, но не липнуть к рукам и рабочей
    поверхности. Не увлажняй его заранее сильнее необходимого.
  - >-
    Добавление сахарной пудры сразу вместе с миндалём помогает получить
    рассыпчатый помол и уменьшает слипание частиц. Используй пудру без
    ароматизаторов; небольшое количество крахмала в составе допустимо.
  - >-
    Главная опасность при измельчении — перегрев и выделение миндального масла.
    Холодный миндаль, короткие импульсы и работа небольшими порциями помогают
    сохранить сухую мелкую крошку. Не пытайся превратить её в гладкую пасту
    в блендере: пластичность появится после добавления жидкости и вымешивания.
  - >-
    Виски здесь не заменяет миндальный экстракт: он добавляет собственные
    зерновые, древесные и ванильно-карамельные оттенки. 8 г на эту порцию
    дают фоновый аромат, не превращая марципан в алкогольную начинку.
    Если нужен максимально чистый миндальный вкус, виски можно не добавлять,
    заменив его таким же количеством воды.
storage:
  - >-
    Храни плотно завёрнутым в пищевую плёнку в герметичной ёмкости при 0–4 °C.
    Из-за добавления воды используй в течение 5–7 дней. Для более долгого
    хранения заморозь герметично упакованными порциями на срок до 2 месяцев;
    размораживай в холодильнике.
