id: espresso-macarons
title: Макароны с эспрессо и тёмным шоколадом
description: >-
  Кофейные макароны с интенсивным вкусом эспрессо и мягкой горчинкой тёмного
  шоколада. Начинка — шоколадный ганаш с концентрированным кофе, без лишней
  сладости и без водянистой текстуры.
category: desserts
subcategory: cakes-and-pastries
tags:
  - макароны
  - macarons
  - эспрессо
  - кофе
  - тёмный шоколад
  - итальянская меренга
yield:
  quantity: 42
  unit: макарона
time:
  active_minutes: 100
  total_minutes_min: 300
  total_minutes_max: 420
equipment:
  - Весы с точностью до 0,1 г
  - Ankarsrum с Balloon Whisks для итальянской меренги
  - Блендер Ninja PowerBowl или большая чаша с короткими импульсами
  - Кондитерский мешок с круглой насадкой 8–10 мм
  - Кухонный термометр для сиропа
  - Противни и пергамент
  - Мелкое сито для сухих ингредиентов
  - Нейлоновая мелкая сетка для фильтрации ароматизированных сливок при необходимости
ingredient_groups:
  - id: shells
    title: Миндальные оболочки
  - id: coffee-ganache
    title: Приготовить ганаш с эспрессо
    ingredients:
      - ingredient: chocolate
      - ingredient: cream
      - ingredient: espresso
      - ingredient: butter
      - ingredient: salt
      - ingredient: whiskey
    instructions: >-
      Мелко наруби шоколад. Нагрей сливки почти до кипения, сними с огня
      и добавь эспрессо. Влей горячую смесь на шоколад, подожди 1 минуту
      и эмульгируй от центра к краям. Добавь масло и соль. Когда ганаш
      немного остынет, вмешай виски. Накрой плёнкой в контакт и охлади
      6–12 часов.
  - id: fill
    title: Наполнить макароны
    instructions: >-
      Размешай охлаждённый ганаш лопаткой до пластичности. Отсади примерно по
      6 г на половину оболочек и накрой оставшимися. Оставь в закрытом контейнере
      в холодильнике на 12–24 часа для созревания вкуса. Перед подачей дай постоять
      15–20 минут при комнатной температуре.
tips:
  - >-
    Дополнительные сливки уже учтены в формуле и дают менее плотный,
    пластичный ганаш после созревания. Не добавляй сливки сверх указанного
    количества до оценки консистенции после полного охлаждения.
  - >-
    Для более выраженного кофейного профиля можно использовать робустовый бленд
    или двойной ристретто, но всё равно отвесить ровно 33 г готового напитка.
  - >-
    Если ганаш кажется мягким после ночи в холодильнике, дай ему ещё 2–3 часа
    охлаждения; не добавляй шоколад на глаз в уже готовую эмульсию.
storage:
  - >-
    Храни собранные макароны в холодильнике в герметичном контейнере до 3 дней.
    Перед подачей дай им постоять 15–20 минут.
  - >-
    Пустые оболочки можно заморозить в герметичной упаковке.
