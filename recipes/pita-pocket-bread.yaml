id: pita-pocket-bread
title: Пита с кармашком
description: Мягкие пшеничные лепёшки, которые при выпечке на хорошо прогретой поверхности раздуваются и образуют кармашек для фалафеля, хумуса и овощей.
category: baking-and-dough
subcategory: pizza-and-flatbreads
tags:
  - пита
  - лепёшки
  - хлеб
  - фалафель
yield:
  quantity: 8
  unit: пит
time:
  prep_minutes: 30
  proof_minutes: 90
  cook_minutes: 25
equipment:
  - Ankarsrum
  - Духовка с верхним и нижним нагревом
  - Тяжёлый противень или жаропрочная поверхность
  - Скалка
ingredient_groups:
  - id: dough
    title: Тесто
ingredients:
  - id: flour
    name: Пшеничная мука
    quantity: 500
    unit: г
    group: dough
  - id: water
    name: Вода комнатной температуры
    quantity: 310
    unit: г
    group: dough
  - id: yeast
    name: Сухие быстродействующие дрожжи
    quantity: 5
    unit: г
    group: dough
  - id: salt
    name: Соль
    quantity: 10
    unit: г
    group: dough
  - id: sugar
    name: Сахар
    quantity: 5
    unit: г
    group: dough
steps:
  - id: mix
    title: Замесить тесто
    ingredients:
      - ingredient: flour
      - ingredient: yeast
      - ingredient: sugar
      - ingredient: water
      - ingredient: salt
    instructions: >-
      Смешай муку, дрожжи и сахар. Добавь воду и перемешивай до исчезновения
      сухой муки. Оставь на 10 минут, затем добавь соль и вымешивай до однородного
      эластичного теста. В Ankarsrum ориентируйся примерно на 6–8 минут работы
      после добавления соли на умеренной скорости. Тесто должно быть мягким,
      но не жидким. Масло в тесто не добавляется.
  - id: proof
    title: Дать тесту подняться
    instructions: >-
      Переложи тесто в слегка смазанную миску, накрой и оставь при комнатной
      температуре примерно на 60–90 минут, пока объём не увеличится примерно
      вдвое. Время зависит от температуры в помещении.
  - id: divide
    title: Разделить на заготовки
    instructions: >-
      Раздели тесто на 8 равных частей примерно по 103 г. Подкати каждую часть
      в шар, накрой и оставь на 15–20 минут. Эта пауза расслабит клейковину
      и облегчит раскатывание.
  - id: preheat
    title: Разогреть духовку и поверхность
    instructions: >-
      Установи фактическую температуру духовки 250 °C по термометру, режим
      верхнего и нижнего нагрева. Поставь внутрь перевёрнутый тяжёлый противень
      или другую подходящую для духовки поверхность и прогревай не менее
      30–45 минут. Если используешь чугунную сковороду IKEA, убедись, что она
      целиком подходит для духовки и выдерживает эту температуру. Не переноси
      горячий чугун мокрыми руками.
  - id: roll
    title: Раскатать питы
    instructions: >-
      На слегка подпылённой мукой поверхности раскатай каждый шар в круг
      диаметром 15–17 см и толщиной примерно 3–4 мм. Старайся сохранять
      равномерную толщину: слишком толстые лепёшки могут не надуться, а тонкие
      и неоднородные иногда рвутся. Не прокалывай тесто.
  - id: bake
    title: Испечь
    instructions: >-
      Аккуратно перенеси одну или две питы на горячую поверхность. Выпекай
      примерно 2–4 минуты. Сначала лепёшка может начать пузыриться, а затем
      раздуться целиком. Доставай, когда кармашек сформировался, а поверхность
      лишь слегка окрасилась. Не жди тёмной корочки: пересушенная пита станет
      ломкой.
  - id: keep-soft
    title: Сохранить мягкость
    instructions: >-
      Сразу складывай готовые питы стопкой под чистое полотенце. После остывания
      переложи в закрывающийся пакет или контейнер, чтобы лепёшки не высыхали.
tips:
  - >-
    Для кармашка особенно важен сильный жар: поверхность должна быть хорошо
    прогрета ещё до первой питы. Если духовка и противень недостаточно горячие,
    лепёшка может высохнуть раньше, чем пар внутри раздует её.
  - >-
    Равномерная толщина важнее идеального круга. Раскатывай от центра к краям,
    не оставляя толстого центра или тонких участков. Не прижимай тесто повторно
    после раскатывания.
  - >-
    Дополнительный пар обычно не нужен. Не лей воду на противень, камень или
    чугунную сковороду: резкий перепад температуры может повредить поверхность.
  - >-
    Если пита не надулась, проверь температуру поверхности, толщину раскатки
    и равномерность теста. Не передерживай лепёшки в духовке: для мягкости
    важно быстро завершить выпечку.
storage:
  - >-
    Полностью остывшие питы храни в закрытом пакете при комнатной температуре
    около 2 дней. Для более долгого хранения заморозь их, переложив пергаментом.
  - >-
    Разогревай из размороженного состояния на сухой сковороде или в духовке
    при фактических 180–200 °C до мягкости. Если пита стала суховатой, слегка
    сбрызни её водой перед разогревом.
