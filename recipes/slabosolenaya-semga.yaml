id: slabosolenaya-semga
title: Слабосолёная сёмга
description: Сёмга сухого посола с солью, небольшим количеством сахара и перцем. Плотная нежная рыба для тонкой нарезки и бутербродов.
category: snacks-and-light-meals
subcategory: sandwiches
tags: [сёмга, лосось, слабосолёная рыба, гравлакс, бутерброды]
yield:
  quantity: 1
  unit: кг филе
time:
  active_minutes: 10
  total_minutes_min: 24
  total_minutes_max: 36
equipment:
  - Ёмкость с крышкой для посола
  - Пинцет для удаления костей
ingredient_groups:
  - id: fish
    title: Рыба
  - id: cure
    title: Посолочная смесь
  - id: aromatics
    title: Ароматические добавки (по желанию)
ingredients:
  - id: salmon
    name: Филе атлантической сёмги с кожей
    quantity: 1000
    unit: г
    group: fish
  - id: salt
    name: Соль
    quantity: 30
    unit: г
    group: cure
  - id: sugar
    name: Сахар
    quantity: 15
    unit: г
    group: cure
  - id: black-pepper
    name: Чёрный перец свежемолотый
    quantity: 1
    unit: г
    group: cure
  - id: dill
    name: Укроп
    quantity: 15
    unit: г
    group: aromatics
    optional: true
  - id: lemon-zest
    name: Цедра лимона
    quantity: 2
    unit: г
    group: aromatics
    optional: true
steps:
  - id: safety
    title: Проверить безопасность рыбы
    ingredients:
      - ingredient: salmon
    instructions: >-
      Для употребления без термообработки используй только рыбу, прошедшую надлежащую обработку против паразитов или имеющую подтверждённое поставщиком соответствие требованиям для сырого употребления. Сам по себе посол не уничтожает паразитов. Если история обработки неизвестна, не подавай рыбу сырой после одного лишь посола.
  - id: prepare
    title: Подготовить филе
    instructions: >-
      Проверь филе на наличие оставшихся костей и удали их пинцетом. Кожу оставь: она поможет сохранить форму филе. Промокни рыбу бумажными полотенцами.
  - id: cure-mix
    title: Смешать посолочную смесь
    ingredients:
      - ingredient: salt
      - ingredient: sugar
      - ingredient: black-pepper
    instructions: >-
      Равномерно смешай соль, сахар и свежемолотый чёрный перец.
  - id: apply-cure
    title: Посолить рыбу
    ingredients:
      - ingredient: salmon
      - ingredient: dill
      - ingredient: lemon-zest
    instructions: >-
      Распредели посолочную смесь по мясной стороне филе. На кожу смесь наносить не обязательно. Если используешь укроп или цедру, распредели их сверху. Положи рыбу кожей вниз в подходящую ёмкость и накрой крышкой или плёнкой.
  - id: cure
    title: Выдержать в холодильнике
    instructions: >-
      Держи рыбу при температуре 0–4 °C. Время зависит от толщины самой толстой части: около 12–16 часов для 2 см, 18–24 часов для 3 см, 24–30 часов для 4 см и 30–36 часов для 5 см. Для умеренно просоленной текстуры ориентируйся на нижнюю или среднюю границу диапазона. Выделившаяся жидкость — нормальная часть процесса.
  - id: finish
    title: Завершить посол
    instructions: >-
      Слей выделившуюся жидкость, удали остатки смеси и тщательно промокни филе. Если рыба кажется слишком солёной, быстро ополосни её холодной водой и снова тщательно обсуши. Не замачивай надолго.
  - id: slice
    title: Нарезать и подать
    instructions: >-
      Нарезай очень острым ножом тонкими ломтиками под углом, отделяя мякоть от кожи. Подавай на ржаном или поджаренном хлебе со сливочным маслом либо сливочным сыром, укропом, каперсами или тонкими кольцами красного лука.
storage:
  - После посола храни в холодильнике при 0–4 °C в чистом закрытом контейнере и употреби в течение 2–3 дней.
  - Посол не заменяет противопаразитарную обработку и не делает небезопасную для сырого употребления рыбу безопасной.
