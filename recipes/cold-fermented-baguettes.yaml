id: cold-fermented-baguettes
title: Багеты с холодной ферментацией
description: Пшеничные багеты с тонкой хрустящей корочкой и более выразительным вкусом благодаря длительной ферментации теста в холодильнике. Замес в Ankarsrum роликом и скребком, четыре багета примерно по 282 г.
category: baking-and-dough
subcategory: bread
tags:
  - багеты
  - французский хлеб
  - холодная ферментация
  - Ankarsrum
  - хлеб
yield:
  quantity: 4
  unit: багета примерно по 282 г до выпечки
time:
  active_minutes: 60
  total_minutes_min: 970
  total_minutes_max: 1410
equipment:
  - Ankarsrum с роликом и скребком
  - Весы с точностью 0,1 г
  - Ёмкость с крышкой для ферментации теста
  - Полотенце или льняная ткань для расстойки
  - Перфорированный алюминиевый противень для багетов или обычный стальной противень
  - Духовка с верхним и нижним нагревом
  - Термометр для духовки
  - Небольшая жаропрочная металлическая ёмкость для пара
  - Острый нож или лезвие для надрезов
ingredient_groups:
  - id: dough
    title: Тесто
ingredients:
  - id: flour
    name: Пшеничная хлебная мука
    quantity: 660
    unit: г
    group: dough
    note: Sofia Mel «За баница» подходит отлично; содержание белка около 13,2%.
  - id: water
    name: Вода
    quantity: 455
    unit: г
    group: dough
    note: Прохладная или комнатной температуры, примерно 18–22 °C; гидратация теста около 69%.
  - id: salt
    name: Соль
    quantity: 13
    unit: г
    group: dough
  - id: yeast
    name: Инстантные сухие дрожжи
    quantity: 1.5
    unit: г
    group: dough
steps:
  - id: mix
    title: Смешать воду, дрожжи и муку
    ingredients:
      - ingredient: water
      - ingredient: yeast
      - ingredient: flour
    instructions: >-
      Установи в чашу Ankarsrum ролик и скребок. Размешай инстантные дрожжи
      в воде до равномерного распределения. Запусти миксер на низкой скорости
      и постепенно добавь муку в 3–4 приёма. Перемешивай только до тех пор,
      пока вся мука не увлажнится и не останется сухих участков. Тесто на этом
      этапе может быть грубым и неоднородным.
  - id: fermentolyse
    title: Дать тесту предварительно гидратироваться
    instructions: >-
      Накрой чашу и оставь тесто на 20–25 минут при комнатной температуре.
      Это ферментолиз: мука успевает впитать воду и начать формировать
      клейковину, а небольшое количество дрожжей уже находится в тесте.
      Длительная ферментация на этом этапе не нужна.
  - id: knead
    title: Внести соль и завершить замес
    ingredients:
      - ingredient: salt
    instructions: >-
      Равномерно распредели соль по поверхности теста. Продолжи замес роликом
      и скребком на низкой или средне-низкой скорости примерно 4–6 минут.
      Соль растворится и распределится в тесте во время замеса — отдельно
      растворять её в воде не требуется. Остановись, когда тесто станет
      заметно более гладким, эластичным и начнёт собираться вокруг ролика.
      Оно должно оставаться мягким и слегка липким; не нужно добиваться
      полного развития клейковины до тончайшего оконного теста.
  - id: bulk-start
    title: Начать первичную ферментацию
    instructions: >-
      Переложи тесто в слегка смазанную ёмкость, накрой и оставь примерно на
      30 минут при комнатной температуре около 22–24 °C.
  - id: folds
    title: Укрепить тесто складываниями
    instructions: >-
      Сделай складывание теста: подтяни один край вверх и сложи к центру,
      повтори со всех четырёх сторон. Повтори складывание ещё два раза
      с интервалом около 30 минут. После третьего складывания оставь тесто
      ещё на 30 минут. Оно должно стать заметно более упругим и немного
      увеличиться в объёме, но не обязано удваиваться.
  - id: cold-ferment
    title: Провести холодную ферментацию
    instructions: >-
      Накрой ёмкость герметично и убери тесто в холодильник при 3–4 °C на
      12–18 часов. Желательно, чтобы тесто успело немного начать ферментацию
      до охлаждения. За время выдержки оно станет ароматнее и обычно заметно
      увеличится в объёме. Если холодильник держит температуру выше 5 °C,
      начинай проверять тесто раньше.
  - id: divide
    title: Разделить и предварительно сформовать
    instructions: >-
      Достань холодное тесто и аккуратно выложи на слегка подпылённую мукой
      поверхность. Раздели на 4 части примерно по 282 г. Не выдавливай весь газ.
      Каждую часть собери в короткий неплотный цилиндр, накрой и оставь на
      15–20 минут, чтобы клейковина расслабилась.
  - id: shape
    title: Сформовать багеты
    instructions: >-
      Расплющи заготовку в прямоугольник. Сложи верхнюю треть к середине и
      прижми шов, затем нижнюю треть к середине и снова прижми. Сложи заготовку
      вдоль пополам и тщательно защипни продольный шов. Положи швом вниз и
      мягко раскатай от центра к краям до длины примерно 35–40 см. Если тесто
      сопротивляется и стягивается, дай ему полежать 5–10 минут и продолжи.
  - id: final-proof
    title: Провести финальную расстойку
    instructions: >-
      Переложи багеты швом вверх на хорошо присыпанное мукой полотенце или
      льняную ткань, сделав между ними складки-опоры. Накрой и оставь примерно
      на 40–60 минут при комнатной температуре. Заготовки должны стать воздушнее,
      но сохранять упругость и не расплываться. Если при лёгком нажатии пальцем
      вмятина медленно и частично выравнивается, багеты готовы к выпечке.
  - id: preheat
    title: Разогреть духовку
    instructions: >-
      Разогрей духовку до фактических 250 °C по отдельному термометру, режим
      верхнего и нижнего нагрева, без конвекции. Размещай решётку на среднем
      или чуть ниже среднего уровне. Не оставляй массивную чугунную сковороду
      на дне духовки: она может экранировать излучение нижнего нагревателя.
      Если используешь ёмкость для пара, поставь её на нижнюю решётку сбоку,
      а не непосредственно под багетами.
  - id: score
    title: Сделать надрезы
    instructions: >-
      Аккуратно переверни багеты швом вниз на перфорированный профиль или
      противень. Сделай на каждом 4–5 диагональных надрезов глубиной примерно
      5–7 мм, слегка перекрывая их друг другом. Работай острым лезвием и не
      прижимай заготовки.
  - id: bake-steam
    title: Выпечь с паром
    instructions: >-
      Быстро загрузи багеты в духовку. Осторожно влей 100–150 г кипятка
      в предварительно нагретую жаропрочную металлическую ёмкость для пара
      и сразу закрой дверцу. Берегись горячего пара. Выпекай первые 8–10 минут
      при фактических 250 °C, верхний и нижний нагрев, без конвекции.
  - id: bake-dry
    title: Подрумянить и подсушить корочку
    instructions: >-
      Через 8–10 минут быстро выпусти пар, не наклоняясь к дверце. Продолжай
      выпекать при 250 °C ещё примерно 12–18 минут, до насыщенной золотисто-
      коричневой корочки. Не снижай температуру автоматически: если багеты
      темнеют слишком быстро, можно уменьшить её до 230–240 °C. Готовность
      мякиша — примерно 96–98 °C в центре самого толстого участка.
  - id: cool
    title: Остудить
    instructions: >-
      Переложи багеты на решётку и оставь открытыми минимум на 40 минут,
      лучше на 45–60 минут. Не накрывай полотенцем и не складывай друг на друга:
      так корочка останется суше и хрустящей, а мякиш успеет стабилизироваться.
tips:
  - >-
    Ферментолиз здесь короткий и содержит дрожжи: он нужен для предварительной
    гидратации муки, а не для заметного подъёма теста. Если в помещении жарко,
    сократи выдержку до 15–20 минут.
  - >-
    Длительность ферментации зависит от температуры теста, помещения и
    холодильника. Ориентируйся не только на часы: после комнатной ферментации
    тесто должно стать упругим и слегка увеличиться, а после холода — сохранить
    газ и не перекиснуть. Если оно заметно перерасстоялось, сократи холодную
    выдержку в следующей партии.
  - >-
    Не добавляй при формовке много муки. Излишек мешает надёжно защипнуть шов,
    а открытый шов может разойтись при расстойке или выпечке.
  - >-
    Для выпечки на перфорированном алюминиевом профиле можно класть заготовки
    непосредственно на него, без смазывания. Если используешь обычный
    противень, подойдёт пергамент, рассчитанный на 250 °C. Не ставь профиль
    на холодную массивную чугунную сковороду.
  - >-
    Если низ багетов остаётся бледным, сначала убери чугун со дна духовки
    и попробуй поставить решётку с багетами на уровень ниже. Не переворачивай
    багеты до конца выпечки, если можно исправить положение и прогрев.
  - >-
    Пар нужен в начале выпечки, чтобы поверхность оставалась растяжимой
    и надрезы раскрылись. После первых 8–10 минут его нужно выпустить,
    иначе корочка будет медленнее подсыхать и окрашиваться.
storage:
  - >-
    Багеты лучше всего есть в день выпечки, через 45–60 минут после остывания.
    Для хранения до следующего дня держи полностью остывшие багеты в бумажном
    пакете. Для более долгого хранения заморозь в день выпечки; после
    размораживания освежи несколько минут в духовке при 180–200 °C.
