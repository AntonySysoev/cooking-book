id: vito-iacopelli-pizza-dough
title: Тесто для пиццы на пулише с двойной холодной ферментацией
description: Адаптированное тесто для пиццы на сильной муке типа 650 с добавлением цельнозерновой муки. Пулиш, длительная ферментация и воздушный бортик.
category: baking-and-dough
subcategory: pizza-and-flatbreads
tags:
  - пицца
  - пулиш
  - холодная ферментация
  - мука тип 650
  - цельнозерновая мука
yield:
  quantity: 7
  unit: пицц диаметром около 28–30 см, шарики теста по 245–250 г
time:
  active_minutes_min: 45
  active_minutes_max: 60
  total_minutes_min: 2160
  total_minutes_max: 3600
equipment:
  - Точные весы
  - Контейнер с крышкой для холодной ферментации
  - Миксер Ankarsrum с роликом и скребком или крюком для теста
  - Чугунная сковорода диаметром 35 см
ingredient_groups:
  - id: poolish
    title: День 1 — пулиш
  - id: dough
    title: День 2 — основной замес
ingredients:
  - id: poolish-water
    name: Вода комнатной температуры
    quantity: 300
    unit: г
    group: poolish
  - id: poolish-flour
    name: Пшеничная мука типа 650
    quantity: 300
    unit: г
    group: poolish
  - id: honey
    name: Мёд
    quantity: 5
    unit: г
    group: poolish
  - id: yeast-poolish
    name: Сухие дрожжи
    quantity: 1.5
    unit: г
    group: poolish
    note: >-
      Уменьшенное количество рассчитано на длительную ферментацию: около 1 часа
      при комнатной температуре и 16–24 часа в холодильнике для пулиша, затем
      ещё 16–24 часа для основного теста. Скорректируй время по активности дрожжей
      и температуре холодильника.
  - id: dough-water
    name: Холодная вода
    quantity: 400
    unit: г
    group: dough
    note: Добавляй постепенно; вместе с 300 г воды в пулише это даёт ровно 70% гидратации при 1000 г общей муки.
  - id: dough-flour
    name: Пшеничная мука типа 650
    quantity: 550
    unit: г
    group: dough
  - id: whole-wheat-flour
    name: Цельнозерновая пшеничная мука
    quantity: 150
    unit: г
    group: dough
  - id: salt
    name: Морская соль
    quantity: 25
    unit: г
    group: dough
  - id: olive-oil
    name: Оливковое масло
    quantity: 10
    unit: г
    group: dough
steps:
  - id: make-poolish
    title: Приготовить пулиш — день 1
    ingredients:
      - ingredient: poolish-water
      - ingredient: poolish-flour
      - ingredient: honey
      - ingredient: yeast-poolish
    instructions: >-
      Раствори мёд и сухие дрожжи в воде, затем вмешай 300 г муки до однородной
      консистенции без сухих комков. Накрой и оставь примерно на 1 час при
      комнатной температуре, затем убери в холодильник на 16–24 часа. Готовый
      пулиш должен быть пузырчатым и ароматным; не жди, пока он полностью
      опадёт и начнёт резко пахнуть спиртом.
  - id: mix-dough
    title: Замесить основное тесто — день 2
    ingredients:
      - ingredient: dough-water
      - ingredient: dough-flour
      - ingredient: whole-wheat-flour
      - ingredient: salt
    instructions: >-
      Достань пулиш из холодильника. Отмерь все 400 г холодной воды для основного
      замеса, но сначала добавь примерно 350 г и аккуратно размешай пулиш. Всыпь
      обе муки и соль, перемешай до исчезновения сухих участков, затем постепенно
      введи оставшиеся 50 г воды. Так суммарно получится 700 г воды на 1000 г муки,
      то есть 70% гидратации. Не вливай остаток залпом: дай тесту время впитать воду.
      Оставь на 15–20 минут для гидратации муки.
  - id: knead
    title: Вымесить тесто
    ingredients:
      - ingredient: olive-oil
    instructions: >-
      Добавь оливковое масло и вымешивай до гладкости и эластичности. В Ankarsrum
      используй ролик со скребком на умеренной скорости; начинай с коротких
      интервалов и делай паузы, чтобы тесто не перегревалось. Обычно потребуется
      около 8–15 минут, но ориентируйся на развитие клейковины, а не только на
      время. Тесто должно растягиваться в тонкую плёнку, хотя цельнозерновая
      мука сделает её менее прозрачной.
  - id: cold-fermentation
    title: Холодная ферментация — день 2
    instructions: >-
      Сформируй шар, положи в слегка смазанный контейнер и плотно закрой.
      Убери в холодильник ещё на 16–24 часа. Контейнер должен иметь запас места
      для увеличения объёма теста.
  - id: divide
    title: Разделить и согреть — день 3
    instructions: >-
      За 2–3 часа до выпечки достань тесто и раздели на 7 частей примерно по
      245–250 г — общей массы около 1,74 кг как раз хватит на семь шариков без
      остатка. Подкати шарики, накрой и оставь при комнатной температуре на
      1.5–2 часа.
  - id: shape
    title: Сформовать пиццу
    instructions: >-
      Слегка припудри рабочую поверхность семолиной или манкой. Растягивай тесто
      руками от центра к краям, сохраняя более толстый бортик. Не раскатывай
      скалкой, чтобы не вытеснить газ из края. Добавь тонкий слой соуса и
      начинку; влажные ингредиенты используй умеренно, а моцареллу добавь ближе
      к концу выпечки, если она выделяет много влаги.
  - id: bake
    title: Выпечь в домашней духовке
    instructions: >-
      Разогрей духовку до максимальной фактической температуры 250 °C. Для
      наилучшего результата поставь чугунную сковороду вверх дном или используй
      её как тяжёлую площадку для выпечки, предварительно прогрев не менее
      35–45 минут. Не клади холодное тесто на раскалённую сковороду, если не
      уверен, что можешь безопасно перенести пиццу: удобнее собирать её на
      пергаменте и переносить вместе с ним, если пергамент рассчитан на такую
      температуру. Выпекай до расплавления сыра и хорошо подрумяненного бортика;
      время зависит от толщины теста и фактической температуры духовки.
tips:
  - >-
    Пулиш должен быть пузырчатым и зрелым, но не опавшим. При тёплом холодильнике
    или очень активных дрожжах проверяй его раньше; ориентируйся на состояние
    теста, а не только на часы.
  - >-
    Общая масса теста — примерно 1,74 кг: раздели её на семь шариков примерно
    по 245–250 г, чтобы использовать всё тесто без остатка. Такой размер хорошо
    подходит для тонкой пиццы диаметром около 28–30 см.
  - >-
    При общей муке 1000 г и общей воде 700 г гидратация составляет ровно 70%.
    Соль 25 г — 2,5% от массы муки.
storage:
  - После холодной ферментации тесто лучше использовать в пределах 24 часов; шарики можно заморозить после порционирования и разморозить в холодильнике.
