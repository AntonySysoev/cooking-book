id: caramel-macarons
title: Французские макароны с солёной карамелью
description: >-
  Макароны на итальянской меренге с карамельно-бежевыми оболочками без красителя
  и плотной, но нежной начинкой из сухой карамели, сливок и белого шоколада.
  Соль подчёркивает карамель и уравновешивает сладость.
category: desserts
subcategory: cakes-and-pastries
tags:
  - макароны
  - macarons
  - карамель
  - солёная карамель
  - итальянская меренга
yield:
  quantity: 32
  unit: макарона
time:
  active_minutes: 100
  total_minutes_min: 300
  total_minutes_max: 420
equipment:
  - Весы с точностью до 0,1 г
  - Ankarsrum с Balloon Whisks для итальянской меренги
  - Блендер Ninja PowerBowl или большая чаша с короткими импульсами
  - Кондитерский мешок с круглой насадкой 8–10 мм
  - Кухонный термометр для сиропа
  - Противни и пергамент
  - Мелкое сито для сухих ингредиентов
  - Нейлоновая мелкая сетка для фильтрации ароматизированных сливок при необходимости
ingredient_groups:
  - id: shells
    title: Миндальные оболочки
  - id: caramel-ganache
    title: Ганаш из солёной карамели
ingredients:
  - id: almond-flour
    name: Миндальная мука
    quantity: 150
    unit: г
    group: shells
    note: Мелкого помола, без крупных частиц.
  - id: icing-sugar
    name: Сахарная пудра
    quantity: 150
    unit: г
    group: shells
  - id: egg-whites
    name: Яичные белки
    quantity: 110
    unit: г
    group: shells
    note: Без следов желтка; разделить на две порции по 55 г.
    parts:
      - id: almond-mixture
        name: Для миндальной пасты
        quantity: 55
        group: shells
      - id: meringue
        name: Для меренги
        quantity: 55
        group: shells
  - id: caster-sugar
    name: Сахар
    quantity: 150
    unit: г
    group: shells
  - id: syrup-water
    name: Вода для сиропа
    quantity: 38
    unit: г
    group: shells
  - id: cream
    name: Сливки 30%
    quantity: 100
    unit: г
    group: caramel-ganache
  - id: sugar
    name: Сахар для карамели
    quantity: 90
    unit: г
    group: caramel-ganache
  - id: butter
    name: Сливочное масло 82%
    quantity: 20
    unit: г
    group: caramel-ganache
  - id: white-chocolate
    name: Белый шоколад
    quantity: 100
    unit: г
    group: caramel-ganache
    note: Обычный магазинный белый шоколад, мелко нарубленный.
  - id: salt
    name: Мелкая соль
    quantity: 1
    unit: г
    group: caramel-ganache
steps:
  - id: prepare
    title: Подготовить ингредиенты и противни
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
      - ingredient: egg-whites
        part: almond-mixture
      - ingredient: egg-whites
        part: meringue
      - ingredient: caster-sugar
      - ingredient: syrup-water
    instructions: >-
      Точно отвесь ингредиенты. Обезжирь чашу и Balloon Whisks. Подготовь
      противень с пергаментом и шаблон кругов диаметром 3,5–4 см.
  - id: sift
    title: Подготовить сухую смесь
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
    instructions: >-
      Просей миндальную муку с сахарной пудрой. Если остаются крупные частицы,
      измельчи их короткими импульсами и просей повторно; не перемалывай долго,
      чтобы миндаль не начал выделять масло.
  - id: almond-paste
    title: Смешать миндальную пасту
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
      - ingredient: egg-whites
        part: almond-mixture
    instructions: >-
      Добавь 55 г белков к сухой смеси и перемешай лопаткой до густой однородной
      пасты. Накрой, чтобы она не подсыхала.
  - id: meringue
    title: Приготовить итальянскую меренгу
    ingredients:
      - ingredient: egg-whites
        part: meringue
      - ingredient: caster-sugar
      - ingredient: syrup-water
    instructions: >-
      Нагрей сахар с водой в сотейнике до 118 °C по термометру, не перемешивая
      после растворения сахара. Когда сироп достигнет 108–110 °C, начни взбивать
      оставшиеся 55 г белков в Ankarsrum с Balloon Whisks до мягких пиков.
      Влей сироп тонкой струёй между венчиком и стенкой чаши и взбивай до плотной
      блестящей меренги, остывшей примерно до 40–45 °C.
  - id: macaronage
    title: Выполнить макаронаж
    ingredients:
      - ingredient: egg-whites
        part: almond-mixture
      - ingredient: egg-whites
        part: meringue
      - ingredient: almond-flour
      - ingredient: icing-sugar
    instructions: >-
      Вмешай треть меренги в миндальную пасту, затем в 2–3 приёма введи остаток.
      Складывай массу лопаткой снизу вверх. Остановись, когда тесто блестит,
      стекает широкой непрерывной лентой, а след исчезает за 10–20 секунд.
  - id: pipe
    title: Отсадить и подсушить оболочки
    instructions: >-
      Отсади круги 3,5–4 см вертикально держа мешок с круглой насадкой 8–10 мм.
      Постучи противнем по столу, проколи видимые пузырьки и оставь на 20–45 минут,
      пока поверхность не станет сухой и не будет липнуть к пальцу.
  - id: bake
    title: Выпечь оболочки
    instructions: >-
      Выпекай при фактической температуре 145 °C, верхний и нижний нагрев без
      конвекции, на среднем уровне 15–18 минут, по одному противню. Начни проверять
      с 14-й минуты. Полностью остуди перед снятием с пергамента. Готовая оболочка
      не должна скользить верхом отдельно от основания при лёгком касании.
  - id: caramel-ganache
    title: Приготовить карамельный ганаш
    ingredients:
      - ingredient: cream
      - ingredient: sugar
      - ingredient: butter
      - ingredient: white-chocolate
      - ingredient: salt
    instructions: >-
      Нагрей сливки почти до кипения и держи горячими. В сухом сотейнике растопи
      сахар на среднем огне до глубокого янтарного цвета, осторожно вращая сотейник,
      но не размешивая кристаллы. Сними с огня и постепенно, в несколько приёмов,
      влей горячие сливки: смесь будет сильно пениться и выделять пар. Размешай
      до растворения карамели, при необходимости верни на слабый огонь. Добавь
      масло и соль. Вылей горячую карамель на белый шоколад, оставь на минуту,
      затем перемешай до гладкой эмульсии. Не добавляй холодные сливки в горячую
      карамель. Накрой плёнкой в контакт и охлади 6–12 часов.
  - id: fill
    title: Наполнить макароны
    ingredients:
      - ingredient: cream
      - ingredient: sugar
      - ingredient: butter
      - ingredient: white-chocolate
      - ingredient: salt
    instructions: >-
      Перемешай охлаждённый ганаш лопаткой до пластичности. Если он слишком плотный,
      дай ему постоять 10–15 минут при комнатной температуре; не разогревай сильно.
      Отсади на половину оболочек примерно по 6–7 г начинки и накрой второй
      половиной, слегка прижимая до заполнения центра. Созревай 12–24 часа
      в холодильнике в закрытом контейнере, затем подавай слегка согретыми
      до прохладной комнатной температуры.
tips:
  - >-
    Цвет оболочек остаётся натуральным. Для карамельного оттенка не добавляй
    жидкую карамель в макаронаж: лишняя влага нарушит структуру.
  - >-
    Для насыщенного вкуса доведи сахар до янтарного цвета, но не до тёмно-коричневого:
    пережжённая карамель будет горчить.
  - >-
    Если ганаш после охлаждения кажется слишком мягким, охлади ещё несколько часов;
    обычный белый шоколад различается по составу и плотности.
storage:
  - >-
    Храни собранные макароны в холодильнике в герметичном контейнере до 3 дней.
    Перед подачей дай им постоять 15–20 минут при комнатной температуре.
  - >-
    Пустые оболочки можно заморозить в герметичной упаковке.
