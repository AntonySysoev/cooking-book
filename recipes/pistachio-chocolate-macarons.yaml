steps:
  - id: prepare-almond
    title: Подготовить миндальную смесь
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
    instructions: >-
      Смешай миндальную муку с сахарной пудрой и тщательно просей через мелкое
      сито. Если смесь остаётся крупной, не проталкивай через сито влажные
      комки: лучше отдельно измельчить и просеять сухую смесь.
  - id: meringue
    title: Взбить меренгу в Ankarsrum
    ingredients:
      - ingredient: egg-whites
      - ingredient: salt-shells
      - ingredient: caster-sugar
    instructions: >-
      Белки должны быть комнатной температуры, около 20–24 °C. В чистую чашу
      Ankarsrum добавь белки и соль. Начни взбивать на средней скорости. Когда
      появится пена, постепенно всыпай сахар по одной ложке. Увеличь скорость
      и взбивай до плотной, гладкой, блестящей меренги с устойчивым пиком.
  - id: macaronage
    title: Выполнить макронаж
    instructions: >-
      Добавь треть миндальной смеси в меренгу и аккуратно вмешай лопаткой.
      Всыпь оставшуюся смесь и продолжай складывающими движениями, периодически
      прижимая массу к стенкам чаши. Остановись, когда тесто стекает с лопатки
      широкой непрерывной лентой, а след на поверхности исчезает примерно за
      10–20 секунд. Не перемешивай до слишком жидкого состояния.
  - id: pipe
    title: Отсадить и подсушить оболочки
    instructions: >-
      Переложи тесто в кондитерский мешок с круглой насадкой 8–10 мм. Отсади
      кружки диаметром 3,5–4 см на противни, застеленные пергаментом, оставляя
      промежутки. Несколько раз постучи противнем по столу, чтобы выпустить
      крупные пузырьки; видимые пузырьки проколи зубочисткой. Оставь при комнатной
      температуре на 30–60 минут, пока поверхность полностью не подсохнет
      и перестанет липнуть к пальцу.
  - id: bake
    title: Выпечь оболочки
    instructions: >-
      Разогрей духовку с конвекцией до фактических 145–150 °C по термометру.
      Выпекай на среднем уровне ориентировочно 14–18 минут, подбирая время
      под свою духовку и противень. Не открывай дверцу первые 8–10 минут.
      Оболочки готовы, когда сформировалась юбочка, верх стабилен, а оболочка
      не скользит по юбочке при лёгком касании. Полностью остуди на противне,
      прежде чем снимать.
  - id: chocolate-ganache
    title: Приготовить шоколадный ганаш
    ingredients:
      - ingredient: dark-chocolate
      - ingredient: cream-chocolate
      - ingredient: butter-chocolate
      - ingredient: rum
      - ingredient: vanilla-chocolate
      - ingredient: salt-chocolate
    instructions: >-
      Мелко поруби шоколад и положи в жаропрочную миску. Нагрей сливки до
      80–85 °C, залей шоколадом и оставь на 1–2 минуты. Перемешивай от центра
      к краям до эмульсии. Вмешай мягкое сливочное масло. Когда ганаш остынет
      примерно до 35–40 °C, добавь ром, ваниль и соль, перемешай до однородности.
  - id: pistachio-ganache
    title: Приготовить фисташковый ганаш
    ingredients:
      - ingredient: white-chocolate
      - ingredient: cream-pistachio
      - ingredient: pistachio-paste
      - ingredient: butter-pistachio
      - ingredient: salt-pistachio
      - ingredient: vanilla-pistachio
    instructions: >-
      Мелко поруби белый шоколад. Нагрей сливки до 80–85 °C, залей шоколадом,
      подожди 1–2 минуты и перемешай до гладкости. Добавь фисташковую пасту.
      Коротко пробей импульсами в небольшой чаше Ninja до глянцевой эмульсии,
      не перегревая смесь. Добавь мягкое масло и снова коротко пробей. Когда
      ганаш станет тёплым, но не горячим, вмешай соль и ваниль.
  - id: chill-ganaches
    title: Охладить ганаши
    instructions: >-
      Накрой оба ганаша плёнкой в контакт и охлади до рабочей плотности.
      Если ганаш стал слишком твёрдым, дай ему немного постоять при комнатной
      температуре; не нагревай резко.
  - id: assemble
    title: Собрать макаруны
    instructions: >-
      Отсади примерно 8–10 г ганаша на плоскую сторону половинки оболочки,
      накрой второй половинкой и слегка проверни, чтобы начинка распределилась.
      Чередуй шоколадную и фисташковую начинку. Фактический выход зависит от
      размера оболочек и количества начинки.
  - id: mature
    title: Созреть в холодильнике
    instructions: >-
      Уложи макаруны в герметичный контейнер и выдержи в холодильнике при
      4–6 °C 12–24 часа для созревания. Перед подачей оставь при комнатной
      температуре на 20–30 минут.
tips:
  - >-
    Температура духовки 200 °C на панели из исходного описания не универсальна:
    текущая духовка пользователя достигает заданной температуры фактически.
    Для макарунов начинай с фактических 145–150 °C с конвекцией и корректируй
    по тестовой партии. Слишком высокая температура может окрасить оболочки,
    вызвать трещины или полые середины.
  - >-
    Две начинки указаны в объёмах примерно на половину партии каждая. Если
    готовишь оболочки диаметром 3,5–4 см, количество ганаша может оказаться
    избыточным или недостаточным в зависимости от числа оболочек и толщины
    отсадки; остаток храни отдельно.
  - >-
    Для фисташкового ганаша используй чашу PowerBowl, если масса уверенно
    захватывается ножом. Не запускай блендер надолго с очень густой смесью.
storage:
  - >-
    Храни собранные макаруны в герметичном контейнере в холодильнике при 4–6 °C.
    Для подачи дай им согреться 20–30 минут. Ганаш содержит сливки и требует
    холодильного хранения.
