id: cold-fermented-bagels
title: Бейглы с холодной ферментацией
description: Упругие бейглы с плотным жевательным мякишем и блестящей корочкой, замешанные в Ankarsrum и выдержанные в холодильнике 12–16 часов.
category: baking-and-dough
subcategory: bread
tags:
  - бейглы
  - холодная ферментация
  - Ankarsrum
  - хлеб
yield:
  quantity: 6
  unit: шт. примерно по 140 г до варки и выпечки
time:
  active_minutes: 45
  total_minutes_min: 900
  total_minutes_max: 1200
equipment:
  - Ankarsrum с роликом и скребком
  - Духовка с верхним и нижним нагревом
  - Противень
  - Пергамент
  - Большая кастрюля для варки
  - Весы с точностью 0,1 г
ingredient_groups:
  - id: dough
    title: Тесто
  - id: boiling
    title: Раствор для варки — выбери один вариант
ingredients:
  - id: flour
    name: Пшеничная мука
    quantity: 500
    unit: г
    group: dough
  - id: water-dough
    name: Вода 20–23 °C
    quantity: 300
    unit: г
    group: dough
  - id: sugar-dough
    name: Сахар
    quantity: 30
    unit: г
    group: dough
  - id: salt
    name: Соль
    quantity: 8
    unit: г
    group: dough
  - id: yeast
    name: Инстантные сухие дрожжи
    quantity: 1.5
    unit: г
    group: dough
  - id: water-boiling
    name: Вода для варки
    quantity: 2500
    unit: мл
    group: boiling
    note: 2–3 л; количество ориентировочное, не масштабировать вместе с тестом
  - id: malt-syrup
    name: Ячменный солодовый сироп
    quantity: 18
    unit: г
    group: boiling
    optional: true
    note: Вариант A — рекомендуемый; не добавляй одновременно сахар и соду
  - id: boiling-sugar
    name: Сахар для раствора
    quantity: 18
    unit: г
    group: boiling
    optional: true
    note: Вариант B — вместо солодового сиропа
  - id: baking-soda
    name: Пищевая сода
    quantity: 7
    unit: г
    group: boiling
    optional: true
    note: Вариант C — вместо солодового сиропа или сахара
steps:
  - id: mix
    title: Замесить тесто
    ingredients:
      - ingredient: flour
      - ingredient: water-dough
      - ingredient: sugar-dough
      - ingredient: yeast
      - ingredient: salt
    instructions: >-
      Положи в чашу Ankarsrum муку, воду, сахар и дрожжи. Начни замес на небольшой
      скорости с роликом и скребком. Когда тесто соберётся, добавь соль.
      Продолжай замешивать примерно 8–12 минут, пока тесто не станет однородным,
      упругим и эластичным. Это достаточно плотное тесто; не добавляй воду
      без необходимости.
  - id: rest
    title: Дать тесту коротко отдохнуть
    instructions: >-
      Накрой тесто и оставь на 15–20 минут при комнатной температуре. Это отдых
      перед формовкой, а не полноценная расстойка: не жди увеличения объёма вдвое.
  - id: divide
    title: Разделить и округлить
    instructions: >-
      Раздели тесто на 6 равных частей примерно по 140 г. Подкатай в шарики,
      накрой и оставь на 10–15 минут, чтобы тесто немного расслабилось.
  - id: shape
    title: Сформовать бейглы
    instructions: >-
      Раскатай каждый кусок в жгут длиной 25–28 см. Оберни жгут вокруг ладони,
      перекрой концы и тщательно прокатай место соединения по столу. Шов должен
      быть надёжно запечатан. Сделай отверстие достаточно большим: при расстойке
      и варке оно уменьшится.
  - id: cold-proof
    title: Выдержать в холодильнике
    instructions: >-
      Выложи бейглы на пергамент с промежутками. Накрой так, чтобы поверхность
      не подсыхала, и сразу поставь в холодильник при 3–4 °C на 12–16 часов.
      Не оставляй сформованные заготовки надолго на столе перед охлаждением
      и не ставь противень в дверцу холодильника или рядом с тёплыми продуктами.
  - id: preheat
    title: Разогреть духовку
    instructions: >-
      Разогревай духовку 30–45 минут до фактических 250 °C по термометру,
      верхний и нижний нагрев, без конвекции. Используй средний уровень,
      если особенности духовки не требуют другого положения.
  - id: boiling-water
    title: Подготовить раствор для варки
    ingredients:
      - ingredient: water-boiling
      - ingredient: malt-syrup
      - ingredient: boiling-sugar
      - ingredient: baking-soda
    instructions: >-
      Выбери один вариант добавки на 2–3 л воды: 15–20 г ячменного солодового
      сиропа (рекомендуется), или 15–20 г сахара, или 5–10 г пищевой соды.
      Раствори выбранную добавку в воде до нагревания и доведи до спокойного
      кипения. Не смешивай все варианты одновременно. Используй только пищевую
      соду, не каустическую соду (гидроксид натрия).
  - id: boil
    title: Сварить бейглы
    instructions: >-
      Доставай бейглы из холодильника непосредственно перед варкой. Опускай
      партиями, не переполняя кастрюлю. Вари при спокойном кипении 30–45 секунд
      с первой стороны и столько же с другой. Дай воде стечь; если используешь
      посыпку, наноси её сразу, пока поверхность влажная.
  - id: bake
    title: Выпечь
    instructions: >-
      Выпекай при фактических 250 °C, верхний и нижний нагрев, без конвекции,
      ориентировочно 15–20 минут. Начни проверять цвет примерно с 12–14-й минуты.
      Если поверхность быстро темнеет, а бейглы ещё не готовы, снизь температуру
      до фактических 230–240 °C и продолжай выпечку до готовности.
  - id: cool
    title: Остудить
    instructions: >-
      Переложи бейглы на решётку и дай остыть 30–45 минут перед разрезанием,
      чтобы мякиш успел стабилизироваться и не казался липким.
tips:
  - >-
    1,5 г инстантных дрожжей — осторожная стартовая дозировка для 12–16 часов
    в холодильнике при 3–4 °C, особенно если предыдущая партия перерасстоялась
    за 24 часа. Фактическая активность зависит от дрожжей и скорости охлаждения теста.
  - >-
    Если заготовки снова расплылись, в следующей партии сократи холодную
    выдержку до 8–12 часов и проверь развитие клейковины, плотность формовки,
    качество шва и фактическую температуру холодильника. Не увеличивай время
    ферментации.
  - >-
    Переходи к более длительной выдержке постепенно: сначала добейся стабильного
    результата за 12–16 часов, затем проверь 18 часов, не меняя одновременно
    дозировку дрожжей и остальные условия. Только после успешной партии пробуй
    20–24 часа.
storage:
  - >-
    Полностью остывшие бейглы храни в закрытом пакете или контейнере. Для более
    длительного хранения заморозь в день выпечки; размораживай при комнатной
    температуре и при желании освежи в духовке.
