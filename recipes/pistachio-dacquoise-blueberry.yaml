id: pistachio-dacquoise-blueberry
title: Фисташковый дакуаз с ягодным конфи
description: "Два толстых фисташковых коржа 35 × 25 см с щедрой прослойкой фисташкового швейцарского масляного крема и ягодным конфи на выбор: малиновым, вишнёвым или черничным."
