steps:
  - id: nut-mixture
    title: Подготовить ореховую смесь
    ingredients:
      - ingredient: pistachios
      - ingredient: icing-sugar
      - ingredient: almond-flour
      - ingredient: cornstarch
      - ingredient: salt-dacquoise
    instructions: >-
      Измельчи фисташки в Ninja PowerBowl вместе с примерно 40–50 г сахарной
      пудры, чтобы орехи меньше выделяли масло. Коротко импульсно измельчай,
      не перегревая чашу и останавливаясь до выделения масла и образования пасты.
      Смешай с миндальной мукой, оставшейся сахарной пудрой, крахмалом и солью.
      Если смесь сбилась в комки, аккуратно разрыхли её.
  - id: meringue
    title: Взбить меренгу
    ingredients:
      - ingredient: egg-whites-dacquoise
      - ingredient: caster-sugar
    instructions: >-
      В чистой чаше Ankarsrum начни взбивать белки воздушными венчиками.
      Когда пена станет устойчивой, постепенно добавь мелкий сахар. Взбивай
      до плотной, гладкой и глянцевой меренги, которая держит форму.
  - id: fold
    title: Соединить меренгу с ореховой смесью
    instructions: >-
      Введи сухую смесь в меренгу в 3–4 приёма, аккуратно складывая массу
      лопаткой снизу вверх. Не перемешивай слишком долго: масса должна остаться
      воздушной, но быть достаточно однородной.
  - id: shape
    title: Сформировать один прямоугольный пласт
    instructions: >-
      Застели противень пергаментом и установи регулируемую форму размером
      35 × 25 см. Распредели тесто внутри формы ровным слоем одинаковой толщины,
      ориентировочно 20–22 мм. Не отсаживай два отдельных коржа: после полного
      охлаждения пласт нужно будет разрезать пополам по стороне 35 см, получив
      две полосы примерно 17,5 × 25 см, которые сложатся друг на друга.
      Готовый торт будет иметь примерно 17,5 × 25 см в основании и два слоя.
  - id: bake
    title: Выпечь дакуаз
    instructions: >-
      Выпекай с конвекцией при фактических 165 °C примерно 22–26 минут,
      начиная проверять с 22-й минуты. Из-за увеличенной толщины ориентируйся
      прежде всего на признаки готовности, а не только на время. Поверхность должна подсохнуть и слегка
      позолотиться, а центр — пружинить при лёгком нажатии. Внутри не должно
      оставаться сырого влажного слоя, но корж не нужно пересушивать: после
      остывания он станет плотнее. Полностью остуди пласт на пергаменте и только
      затем аккуратно разрежь пополам по стороне 35 см.
  - id: prepare-meringue
    title: Нагреть белки с сахаром для крема
    ingredients:
      - ingredient: egg-whites-cream
      - ingredient: sugar-cream
    instructions: >-
      Смешай белки и сахар в чистой жаропрочной металлической чаше. Поставь
      на водяную баню так, чтобы дно чаши не касалось воды. Постоянно перемешивая,
      нагрей до 72–74 °C и убедись, что сахар растворился. Используй чистый
      термометр; для максимальной пищевой безопасности можно использовать
      пастеризованные белки и следовать инструкции производителя.
  - id: whip-meringue
    title: Взбить и охладить швейцарскую меренгу
    instructions: >-
      Перелей смесь в чашу Ankarsrum и взбивай воздушными венчиками на высокой
      скорости до плотной меренги. Продолжай взбивать, пока меренга и чаша
      не остынут примерно до комнатной температуры. Если меренга ещё тёплая,
      масло при добавлении может растаять и крем станет жидким.
  - id: make-buttercream
    title: Собрать фисташковый масляный крем
    ingredients:
      - ingredient: butter
      - ingredient: pistachio-paste
      - ingredient: rum
      - ingredient: salt-cream
      - ingredient: vanilla
    instructions: >-
      Масло должно быть мягким, но не тёплым, примерно 20–22 °C. Постепенно
      вводи его в меренгу небольшими кусочками, взбивая до гладкого крема.
      Если крем сначала выглядит жидким или слегка расслоившимся, продолжай
      взбивать: эмульсия часто собирается через несколько минут. Добавь
      фисташковую пасту, соль и семена половины стручка ванили. В самом конце
      постепенно вмешай ром. Взбей до однородности. Если крем перегрелся
      и стал жидким, охлади чашу 10–15 минут и снова взбей.
  - id: blueberry-layer
    title: Загустить и подкислить черничное варенье
    ingredients:
      - ingredient: blueberry-jam
      - ingredient: pectin-nh
      - ingredient: sugar-blueberry
      - ingredient: citric-acid
      - ingredient: water
    instructions: >-
      Тщательно смешай пектин NH с сахаром, чтобы пектин распределился без комков.
      Нагрей варенье примерно до 40 °C, тонкой струйкой всыпь смесь пектина
      с сахаром, постоянно перемешивая венчиком. Доведи до уверенного кипения
      и провари около 30–45 секунд, помешивая. Сними с огня. Для варианта
      с лимонной кислотой раствори 0,3 г кислоты в 2 г воды и вмешай в горячее
      варенье. Вместо кислоты и воды можно добавить 5–6 г свежего лимонного
      сока. Если варенье уже достаточно кислое, начни с половины выбранной
      добавки и отрегулируй вкус. Полностью остуди: после охлаждения прослойка
      станет гуще. Если варенье изначально очень плотное, воду не добавляй.
      Перед сборкой размешай до однородной пластичной консистенции.
  - id: assemble
    title: Собрать торт
    instructions: >-
      Положи первую полосу дакуаза на подложку. Отложи примерно 60–70 г готового
      фисташкового крема для тонкого закрывающего слоя и бортика. Распредели
      300–320 г оставшегося крема ровным слоем по коржу. Нанеси охлаждённую
      черничную прослойку тонким слоем, используя примерно 70–80 г, и оставляя
      около 2 см до края. С помощью кондитерского мешка или лопатки покрой
      чернику тонким слоем отложенного крема, особенно тщательно закрывая
      периметр, чтобы прослойка не выдавливалась наружу. Накрой второй полосой
      дакуазa и аккуратно прижми. Оставшимся кремом покрой верх и бока.
      На наружное покрытие ориентировочно уйдёт 400–450 г; если крема останется,
      не нужно наносить его весь. Ромовую пропитку не используй — дакуаз
      оставляем без дополнительной жидкости.
  - id: mature
    title: Выдержать перед подачей
    instructions: >-
      Убери торт в закрытом контейнере в холодильник на несколько часов,
      лучше на ночь, чтобы слои стабилизировались. Перед подачей достань
      примерно на 30–45 минут, чтобы масляный крем стал мягче и аромат
      фисташки и ванили раскрылся.
tips:
  - >-
    Температура духовки указана как фактическая по термометру: 165 °C с
    конвекцией. Проверяй готовность по состоянию коржа, поскольку толщина
    пласта и особенности противня влияют на время.
  - >-
    Крем увеличен с запасом: ожидаемый выход около 850 г. Для сборки ориентируйся
    на 300–320 г основного слоя, 60–70 г закрывающего слоя и 400–450 г наружного
    покрытия. Остаток можно сохранить отдельно.
  - >-
    Пектин NH добавляй только после предварительного смешивания с сахаром
    и обязательно проваривай. Окончательная густота проявится после охлаждения.
  - >-
    Внутреннюю черничную прослойку оставляй тонкой и не доводи до самого края.
    Кремовый бортик помогает удержать варенье внутри торта.
storage:
  - Храни торт в закрытом контейнере в холодильнике. Перед подачей дай ему постоять при комнатной температуре 30–45 минут.
