id: pistachio-dacquoise-blueberry
title: Фисташковый дакуаз с черникой
description: Прямоугольный фисташковый дакуаз, разрезанный пополам и собранный в два слоя с толстым слоем фисташкового швейцарского масляного крема и тонкой кислой черничной прослойкой.
category: desserts
subcategory: cakes-and-pastries
also_in: [baking-and-dough]
tags:
  - дакуаз
  - фисташка
  - черника
  - масляный крем
  - торт
yield:
  quantity: 8
  unit: порций
time:
  active_minutes: 110
  total_minutes_min: 360
  total_minutes_max: 900
equipment:
  - Духовка с конвекцией
  - Ankarsrum с воздушными венчиками
  - Ninja CB350 PowerBowl
  - Противень
  - Регулируемая прямоугольная форма
  - Пергамент
  - Кондитерский мешок или лопатка
  - Кухонный термометр
  - Весы с точностью 0,1 г
