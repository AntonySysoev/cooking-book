steps:
  - id: nut-mixture
    title: Подготовить ореховую смесь
    ingredients:
      - ingredient: pistachios
      - ingredient: icing-sugar
      - ingredient: almond-flour
      - ingredient: cornstarch
      - ingredient: salt-dacquoise
    instructions: >-
      Измельчи фисташки в Ninja PowerBowl вместе с примерно 40–50 г сахарной
      пудры, чтобы орехи меньше выделяли масло. Коротко импульсно измельчай,
      не перегревая чашу. Смешай с миндальной мукой, оставшейся сахарной пудрой,
      крахмалом и солью. Если смесь сбилась в комки, аккуратно разрыхли её.
  - id: meringue
    title: Взбить меренгу
    ingredients:
      - ingredient: egg-whites-dacquoise
      - ingredient: caster-sugar
    instructions: >-
      В чистой чаше Ankarsrum начни взбивать белки. Когда пена станет устойчивой,
      постепенно добавь мелкий сахар. Взбивай до плотной, гладкой и глянцевой
      меренги, которая держит форму.
  - id: fold
    title: Соединить меренгу с ореховой смесью
    instructions: >-
      Введи сухую смесь в меренгу в 3–4 приёма, аккуратно складывая массу
      лопаткой снизу вверх. Не перемешивай слишком долго: масса должна остаться
      воздушной, но быть достаточно однородной.
  - id: shape
    title: Сформировать один прямоугольный пласт
    instructions: >-
      Застели противень пергаментом. Разровняй тесто в один цельный прямоугольник
      одинаковой толщины, ориентировочно 15–17 мм. Не отсаживай два отдельных
      коржа: после полного охлаждения пласт будет разрезан вдоль на две равные
      половины, которые затем сложатся в торт исходного прямоугольного размера.
  - id: bake
    title: Выпечь дакуаз
    instructions: >-
      Выпекай с конвекцией при фактических 165 °C примерно 18–21 минуту,
      начиная проверять с 18-й минуты. Поверхность должна подсохнуть и слегка
      позолотиться, а центр — пружинить при лёгком нажатии. Не пересушивай:
      внутри корж должен остаться мягким и слегка тягучим. Полностью остуди
      пласт на пергаменте и только затем аккуратно разрежь по длине на две
      равные половины.
  - id: prepare-meringue
    title: Нагреть белки с сахаром для крема
    ingredients:
      - ingredient: egg-whites-cream
      - ingredient: sugar-cream
    instructions: >-
      Смешай белки и сахар в чистой жаропрочной металлической чаше. Поставь
      на водяную баню так, чтобы дно чаши не касалось воды. Постоянно перемешивая,
      нагрей до 72–74 °C и убедись, что сахар растворился. Используй чистый
      термометр; для максимальной пищевой безопасности можно использовать
      пастеризованные белки и следовать инструкции производителя.
  - id: whip-meringue
    title: Взбить и охладить швейцарскую меренгу
    instructions: >-
      Перелей смесь в чашу Ankarsrum и взбивай на высокой скорости до плотной
      меренги. Продолжай взбивать, пока меренга и чаша не остынут примерно
      до комнатной температуры. Если меренга ещё тёплая, масло при добавлении
      может растаять и крем станет жидким.
  - id: make-buttercream
    title: Собрать фисташковый масляный крем
    ingredients:
      - ingredient: butter
      - ingredient: pistachio-paste
      - ingredient: rum
      - ingredient: salt-cream
      - ingredient: vanilla
    instructions: >-
      Масло должно быть мягким, но не тёплым, примерно 20–22 °C. Постепенно
      вводи его в меренгу небольшими кусочками, взбивая до гладкого крема.
      Если крем сначала выглядит жидким или слегка расслоившимся, продолжай
      взбивать: эмульсия часто собирается через несколько минут. Добавь
      фисташковую пасту, соль и ваниль. В самом конце постепенно вмешай 10 г
      рома, попробуй и при желании добавь остаток до общего количества 12 г
      (максимум 15 г по вкусу). Если крем перегрелся и стал жидким, охлади чашу
      10–15 минут и снова взбей.
  - id: blueberry-layer
    title: Подкислить черничное варенье
    ingredients:
      - ingredient: blueberry-jam
      - ingredient: citric-acid
      - ingredient: water
    instructions: >-
      Раствори лимонную кислоту в небольшом количестве воды и тщательно вмешай
      в варенье. Начни с 0,25–0,3 г кислоты, попробуй и при необходимости
      скорректируй в пределах 0,4 г. Цель — отчётливая кислинка, а не вкус лимона.
      Если варенье достаточно жидкое, воду можно не добавлять.
  - id: assemble
    title: Собрать торт
    ingredients:
      - ingredient: butter
      - ingredient: pistachio-paste
      - ingredient: blueberry-jam
    instructions: >-
      Положи первую половину коржа на подложку. Распредели примерно 250–270 г
      крема толстым ровным слоем. Нанеси 70–80 г черничного варенья, оставляя
      около 2 см до края. Сверху распредели ещё 50–60 г крема, особенно тщательно
      закрывая чернику по краям, чтобы прослойка не выдавливалась наружу.
      Накрой второй половиной коржа и аккуратно прижми. Оставшимся кремом покрой
      верх и бока: ориентировочно должно остаться 300–350 г, в зависимости
      от толщины наружного покрытия. Ромовую пропитку не используй — дакуаз
      оставляем без дополнительной жидкости.
  - id: mature
    title: Выдержать перед подачей
    instructions: >-
      Убери торт в холодильник на несколько часов, лучше на ночь, чтобы слои
      стабилизировались. Перед подачей достань примерно на 30–45 минут, чтобы
      масляный крем стал мягче и аромат фисташки раскрылся.
tips:
  - >-
    Температура духовки указана как фактическая по термометру: 165 °C с
    конвекцией. Проверяй готовность по состоянию коржа, поскольку толщина
    пласта и особенности противня влияют на время.
  - >-
    Масса крема получится примерно 650–680 г. Для ровной сборки сначала отмерь
    крем на внутренний слой и закрывающий слой, а остаток используй для покрытия
    верха и боков.
  - >-
    Внутреннюю черничную прослойку оставляй тонкой и не доводи до самого края.
    Кремовый бортик помогает удержать варенье внутри торта.
storage:
  - Храни торт в закрытом контейнере в холодильнике. Перед подачей дай ему постоять при комнатной температуре 30–45 минут.
