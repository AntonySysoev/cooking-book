steps:
  - id: prepare-trays
    title: Подготовить противни
    instructions: >-
      На двух листах пергамента разметь прямоугольники 35 × 25 см и переверни
      пергамент разметкой вниз. Подготовь два уровня духовки: на нижнем будет
      решётка с перфорированным алюминиевым противнем, на верхнем — обычный
      сплошной противень. Убедись, что оба противня помещаются с зазором для
      циркуляции воздуха.
  - id: nut-mixture
    title: Подготовить ореховую смесь
    ingredients:
      - ingredient: pistachios
      - ingredient: icing-sugar
      - ingredient: almond-flour
      - ingredient: cornstarch
      - ingredient: salt-dacquoise
    instructions: >-
      Измельчи фисташки в Ninja PowerBowl вместе примерно с 70–80 г сахарной
      пудры короткими импульсами, не перегревая чашу и не допуская выделения
      масла. Смешай с миндальной мукой, оставшейся сахарной пудрой, крахмалом
      и солью. Если смесь сбилась в комки, аккуратно разрыхли её.
  - id: meringue
    title: Взбить меренгу для дакуаза
    ingredients:
      - ingredient: egg-whites-dacquoise
      - ingredient: caster-sugar
    instructions: >-
      В чистой чаше Ankarsrum начни взбивать белки воздушными венчиками.
      Когда пена станет устойчивой, постепенно добавь мелкий сахар. Взбивай
      до плотной, гладкой и глянцевой меренги, которая держит форму.
  - id: fold
    title: Соединить меренгу с ореховой смесью
    instructions: >-
      Введи сухую смесь в меренгу в 3–4 приёма, аккуратно складывая массу
      лопаткой снизу вверх. Не перемешивай слишком долго: масса должна остаться
      воздушной, но быть достаточно однородной.
  - id: shape
    title: Сформировать два коржа
    instructions: >-
      Раздели массу на две равные части примерно по 493–494 г. Переложи первую
      часть в кондитерский мешок без насадки с отверстием около 2 см. Отсаживай
      параллельные полосы внутри разметки 35 × 25 см, оставляя небольшие
      промежутки. Аккуратно соедини полосы и выровняй поверхность лопаткой,
      не уплотняя массу. Повтори со второй частью на отдельном листе пергамента.
      Стремись к одинаковой толщине по всей площади; ориентир для сырого слоя
      — около 10–12 мм, фактическая толщина зависит от плотности меренги.
  - id: bake
    title: Одновременно выпечь оба коржа
    instructions: >-
      Выпекай оба коржа одновременно при фактических 165 °C с конвекцией.
      На нижнем уровне поставь перфорированный алюминиевый противень на решётку,
      на верхнем — сплошной противень. Примерное время — 20–25 минут; начинай
      проверять с 20-й минуты. Примерно через 8–10 минут поменяй противни
      уровнями и разверни каждый на 180°, если духовка печёт неравномерно.
      Если один корж готов раньше, достань его отдельно. Поверхность должна
      подсохнуть и слегка позолотиться, а центр — пружинить при лёгком нажатии.
      Полностью остуди коржи на пергаменте.
  - id: prepare-meringue
    title: Нагреть белки с сахаром для крема
    ingredients:
      - ingredient: egg-whites-cream
      - ingredient: sugar-cream
    instructions: >-
      Смешай белки и сахар в чистой жаропрочной металлической чаше. Поставь
      на водяную баню так, чтобы дно чаши не касалось воды. Постоянно перемешивая,
      нагрей до 72–74 °C и убедись, что сахар растворился. Для максимальной
      пищевой безопасности можно использовать пастеризованные белки и
      следовать инструкции производителя.
  - id: whip-meringue
    title: Взбить и охладить швейцарскую меренгу
    instructions: >-
      Перелей смесь в чашу Ankarsrum и взбивай воздушными венчиками на высокой
      скорости до плотной меренги. Продолжай взбивать, пока меренга и чаша
      не остынут примерно до комнатной температуры. Если меренга ещё тёплая,
      масло при добавлении может растаять и крем станет жидким.
  - id: make-buttercream
    title: Собрать фисташковый масляный крем
    ingredients:
      - ingredient: butter
      - ingredient: pistachio-paste
      - ingredient: rum
      - ingredient: salt-cream
      - ingredient: vanilla
    instructions: >-
      Масло должно быть мягким, но не тёплым, примерно 20–22 °C. Постепенно
      вводи его в меренгу небольшими кусочками, взбивая до гладкого крема.
      Если крем сначала выглядит жидким или слегка расслоившимся, продолжай
      взбивать: эмульсия часто собирается через несколько минут. Добавь
      фисташковую пасту, соль и семена стручка ванили. В самом конце постепенно
      вмешай ром. Взбей до однородности. Если крем перегрелся и стал жидким,
      охлади чашу 10–15 минут и снова взбей. Ожидаемый выход — около 1,7 кг.
  - id: prepare-confit
    title: Приготовить ягодное конфи
    ingredients:
      - ingredient: berry-base
      - ingredient: pectin-nh
      - ingredient: sugar-confit
      - ingredient: citric-acid
      - ingredient: water
      - ingredient: lemon-juice
    instructions: >-
      Выбери один вариант ягодной основы: малиновое варенье или пюре (малину
      рекомендуется протереть от косточек), вишнёвое варенье или пюре (удали
      косточки; при желании измельчи и протри) либо черничное варенье или пюре
      (можно оставить мякоть). Отмерь 180 г уже после удаления косточек и
      процеживания. Смешай пектин NH с сахаром. Нагрей основу примерно до
      40 °C, тонкой струйкой всыпь смесь, постоянно перемешивая венчиком.
      Доведи до уверенного кипения и провари 30–45 секунд. Сними с огня.
      Добавь либо раствор лимонной кислоты в воде, либо лимонный сок; начинай
      с меньшего количества и регулируй кислотность по вкусу. Полностью остуди:
      после охлаждения конфи станет гуще. Если используемое варенье уже очень
      густое и хорошо желируется, начни с 1–1,5 г пектина NH. Если оно жидкое,
      стандартные 2 г оставь. Перед сборкой размешай конфи до пластичной
      однородной консистенции.
  - id: assemble
    title: Собрать торт
    instructions: >-
      Положи первый корж на подложку. Равномерно распредели по нему 600–650 г
      фисташкового крема, оставив часть крема для бортика. Отсади по периметру
      бортик из 80–100 г крема. Внутри бортика распредели 160–180 г охлаждённого
      ягодного конфи, не доводя его до края. Накрой вторым коржом и аккуратно
      выровняй. Нанеси тонкий черновой слой крема примерно 100 г и охлади торт
      до стабилизации. Затем покрой верх и бока оставшимся кремом; на финальное
      покрытие ориентировочно уйдёт 500–600 г, на декор можно оставить ещё
      50–100 г. Не обязательно использовать весь крем — оставь запас, если
      покрытие уже достаточно ровное. Ромовую пропитку не используй.
  - id: mature
    title: Выдержать перед подачей
    instructions: >-
      Убери торт в закрытом контейнере в холодильник минимум на 6–8 часов,
      лучше на ночь, чтобы слои стабилизировались и дакуаз немного смягчился.
      Перед подачей достань примерно на 20–30 минут, чтобы масляный крем
      стал мягче и аромат фисташки и ванили раскрылся.
  - id: freeze
    title: Заморозить торт (по желанию)
    instructions: >-
      Полностью собранный и покрытый кремом торт сначала охлади в холодильнике
      до стабилизации. Поставь его в морозильник без упаковки на 2–3 часа,
      чтобы поверхность затвердела, затем герметично упакуй в несколько слоёв
      пищевой плёнки и фольги либо помести в плотную герметичную коробку.
      Храни при −18 °C до 4–6 недель для хорошего качества. Свежие ягоды и
      хрустящий декор лучше добавить после размораживания.
  - id: thaw
    title: Разморозить перед подачей
    instructions: >-
      Переставь торт из морозильника в холодильник и размораживай в упаковке
      10–12 часов или всю ночь. После полного размораживания сними упаковку.
      Перед подачей дай торту постоять при комнатной температуре 20–30 минут.
      Не размораживай целый торт при комнатной температуре, чтобы поверхность
      не нагрелась и не покрылась конденсатом раньше, чем оттает середина.
tips:
  - >-
    Температура духовки указана как фактическая по термометру: 165 °C с
    конвекцией. При одновременной выпечке на двух уровнях следи за разницей
    в готовности коржей и доставай каждый отдельно при необходимости.
  - >-
    Массу дакуаза лучше распределять кондитерским мешком полосами, а затем
    аккуратно выравнивать лопаткой. Не дави на массу и не разглаживай её
    слишком долго, чтобы сохранить воздушность.
  - >-
    Количество ягодной основы указано после процеживания и удаления косточек.
    Для трёх вариантов используется одинаковая базовая дозировка пектина,
    но если варенье уже очень густое или содержит много добавленного пектина,
    его количество следует уменьшить.
  - >-
    Внутреннее конфи оставляй внутри кремового бортика: так оно не будет
    выдавливаться наружу при сборке и нарезке.
  - >-
    Для чистых порционных срезов хорошо охлади торт. Используй длинный тонкий
    нож, прогревай его в горячей воде и вытирай насухо перед каждым разрезом.
  - >-
    Торт можно замораживать целиком. Дакуаз после размораживания может стать
    немного мягче, но крем и ягодное конфи обычно хорошо сохраняют структуру.
storage:
  - Храни в закрытом контейнере в холодильнике; перед подачей дай постоять при комнатной температуре 20–30 минут.
  - Для длительного хранения заморозь герметично упакованный торт при −18 °C на срок до 4–6 недель; размораживай в упаковке в холодильнике 10–12 часов или всю ночь.
