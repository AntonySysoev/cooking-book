id: pistachio-dacquoise-blueberry
title: Фисташковый дакуаз с черникой
description: Прямоугольный фисташковый дакуаз, разрезанный вдоль на две равные половины и собранный с толстым слоем фисташкового швейцарского масляного крема и тонкой кислой черничной прослойкой.
category: desserts
also_in: [baking-and-dough]
subcategory: cakes-and-pastries
tags:
  - дакуаз
  - фисташка
  - черника
  - масляный крем
  - торт
