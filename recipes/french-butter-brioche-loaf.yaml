id: french-butter-brioche-loaf
title: Французская масляная бриошь
description: >-
  Богатая французская бриошь с высоким содержанием сливочного масла,
  выраженным сливочно-яичным вкусом и нежным волокнистым мякишем.
  Не молочный хлеб: основную роль во вкусе и текстуре здесь играют яйца
  и масло. Тесто проходит длительную холодную ферментацию и замешивается
  в Ankarsrum.
category: baking-and-dough
subcategory: bread
tags:
  - бриошь
  - французская выпечка
  - сдобное тесто
  - сливочное масло
  - хлеб
yield:
  quantity: 1
  unit: буханка (около 900 г теста)
time:
  active_minutes: 50
  total_minutes_min: 780
  total_minutes_max: 1380
equipment:
  - Тестомес Ankarsrum с роликом и скребком
  - Хлебная форма IKEA VINTERROCKA
  - Весы с точностью до 0,1 г
  - Контейнер для холодной ферментации
  - Термометр-щуп
  - Кисточка для смазывания
ingredient_groups:
  - id: dough
    title: Тесто
  - id: finish
    title: Для смазывания
ingredients:
  - id: flour
    name: Пшеничная мука
    quantity: 400
    unit: г
    group: dough
    note: Предпочтительна сильная белая мука с содержанием белка около 12–13%.
  - id: eggs
    name: Яйца без скорлупы
    quantity: 200
    unit: г
    group: dough
    note: Обычно это около 4 крупных яиц; ориентируйся на массу.
  - id: milk
    name: Молоко 3–3,5%
    quantity: 35
    unit: г
    group: dough
  - id: butter
    name: Сливочное масло 82%
    quantity: 200
    unit: г
    group: dough
    note: Пластичное, примерно 18–20 °C, не растопленное.
  - id: sugar
    name: Сахар
    quantity: 50
    unit: г
    group: dough
  - id: salt
    name: Соль
    quantity: 8
    unit: г
    group: dough
  - id: yeast
    name: Инстантные сухие дрожжи
    quantity: 3.5
    unit: г
    group: dough
  - id: egg-wash
    name: Яйцо для смазывания
    quantity: 50
    unit: г
    group: finish
    note: Взболтай до однородности; количество указано по массе без скорлупы.
steps:
  - id: prepare
    title: Подготовить ингредиенты
    ingredients:
      - ingredient: flour
      - ingredient: eggs
      - ingredient: milk
      - ingredient: butter
      - ingredient: sugar
      - ingredient: salt
      - ingredient: yeast
    instructions: >-
      Отвесь все ингредиенты. Яйца и молоко лучше использовать прохладными,
      чтобы тесто не перегревалось во время долгого замеса. Масло нарежь
      небольшими кубиками и оставь при 18–20 °C: оно должно легко проминаться,
      сохранять форму и не блестеть от растапливания.
  - id: initial-mix
    title: Смешать тесто
    ingredients:
      - ingredient: flour
      - ingredient: eggs
      - ingredient: milk
      - ingredient: sugar
      - ingredient: yeast
    instructions: >-
      Установи в Ankarsrum ролик и скребок. Добавь муку, яйца, молоко,
      сахар и дрожжи. Начни на низкой скорости и перемешивай до исчезновения
      сухой муки и образования однородного теста. Затем добавь соль.
  - id: develop-gluten
    title: Развить клейковину
    ingredients:
      - ingredient: salt
    instructions: >-
      Продолжай замес на умеренной скорости, пока тесто не станет заметно
      более гладким, упругим и начнёт хорошо растягиваться. До добавления масла
      уже должен сформироваться крепкий клейковинный каркас. При необходимости
      делай короткие паузы, если тесто нагревается или размазывается по чаше.
  - id: add-butter
    title: Постепенно ввести масло
    ingredients:
      - ingredient: butter
    instructions: >-
      Вводи масло небольшими порциями, примерно по 10–15 г, каждый раз дожидаясь,
      пока предыдущая порция полностью вмешается и тесто снова соберётся.
      После внесения всего масла продолжай замес до гладкого, блестящего
      и очень эластичного состояния. Тесто должно растягиваться в тонкую
      полупрозрачную плёнку. Следи, чтобы его температура по возможности
      не превышала 26 °C; если оно заметно нагрелось, останови замес и охлади.
  - id: short-bulk
    title: Начать брожение
    instructions: >-
      Переложи тесто в контейнер, слегка смазанный нейтральным маслом, накрой
      и оставь при комнатной температуре на 30–45 минут. Оно должно немного
      ожить и слегка увеличиться, но не обязано удваиваться.
  - id: cold-fermentation
    title: Охладить тесто
    instructions: >-
      Убери закрытый контейнер в холодильник при 3–5 °C на 8–14 часов.
      За это время тесто охладится, станет плотным и удобным для формовки,
      а вкус — более выразительным. Если тесто сильно увеличивается уже
      в холодильнике, переходи к формовке раньше, не дожидаясь конца интервала.
  - id: shape
    title: Сформовать бриошь
    quantities:
      - id: dough-balls
        quantity: 6
        unit: частей
    instructions: >-
      Слегка смажь хлебную форму. Раздели холодное тесто на {{count:dough-balls}}
      равных частей. Подкатай каждую часть в гладкий шар и уложи в форму
      в два ряда по три шара. Не подсыпай много муки: поверхность шариков
      должна оставаться слегка липкой, чтобы они хорошо соединились при расстойке.
  - id: final-proof
    title: Расстоять
    instructions: >-
      Накрой форму и оставь тесто при фактической температуре 26–28 °C.
      Расстойка может занять примерно 3–5 часов, иногда дольше в прохладных
      условиях. Дождись, пока шары объединятся, тесто станет очень воздушным
      и поднимется примерно на 1–2 см выше края формы. При лёгком нажатии
      пальцем вмятина должна медленно и не полностью восстанавливаться.
      Не отправляй бриошь в духовку недорасстоявшейся.
  - id: egg-wash
    title: Смазать поверхность
    ingredients:
      - ingredient: egg-wash
    instructions: >-
      Осторожно взболтай яйцо до однородности. Мягкой кисточкой нанеси тонкий
      равномерный слой, стараясь не прокалывать и не осаживать поднявшееся тесто.
  - id: bake
    title: Выпечь
    instructions: >-
      Заранее разогрей духовку до фактических 170 °C по термометру,
      режим верхний и нижний нагрев, без конвекции. Выпекай на среднем уровне
      примерно 40–45 минут. Если верх начинает слишком быстро темнеть,
      свободно прикрой его фольгой. Готовность проверь термометром:
      температура в центре мякиша должна составлять 92–94 °C.
  - id: cool
    title: Остудить
    instructions: >-
      Оставь бриошь в форме на 5–10 минут, затем аккуратно извлеки и полностью
      остуди на решётке. Не разрезай горячей: мякишу нужно стабилизироваться,
      иначе он может смяться и показаться липким.
tips:
  - >-
    Масло вводится только после развития клейковины. Если добавить его в самом
    начале, жир затруднит формирование прочной тестовой структуры.
  - >-
    Не используй растопленное или слишком мягкое масло. При перегреве теста
    масло начнёт отделяться, а тесто потеряет способность удерживать форму.
  - >-
    Время окончательной расстойки сильно зависит от температуры теста и помещения.
    Главный ориентир — объём и воздушность, а не часы.
storage:
  - >-
    Полностью остывшую бриошь храни герметично при комнатной температуре
    2–3 дня. Для более долгого хранения нарежь ломтями, упакуй герметично
    и заморозь. Размораживай при комнатной температуре или прогревай ломти
    прямо из морозильника в тостере.
