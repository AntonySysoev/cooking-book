id: pyanse
title: Пянсе
description: Паровые дрожжевые булочки с сочной мясной начинкой, капустой и луком.
category: main-dishes
subcategory: dumplings
tags: [пянсе, паровые булочки, мясной фарш, капуста]
yield:
  quantity: 10
  unit: булочек
time:
  active_minutes: 60
  total_minutes_min: 150
  total_minutes_max: 210
equipment:
  - Ankarsrum
  - Мясорубка с решёткой 6 мм
  - Пароварка-мантоварка на 4 уровня
ingredient_groups:
  - id: dough
    title: Тесто
  - id: filling
    title: Начинка
