steps:
  - id: dough
    title: Замесить тесто
    ingredients:
      - ingredient: flour
      - ingredient: water
      - ingredient: yeast
      - ingredient: sugar
      - ingredient: salt
    instructions: >-
      Раствори сахар, соль и сухие дрожжи в тёплой воде. Оставь на 5–10 минут; быстродействующим дрожжам активизация не обязательна. Добавь муку и перемешай до грубого теста. Накрой и оставь на 10 минут. Затем вымеси в Ankarsrum до гладкости и эластичности. Тесто должно быть мягким; не подсыпай лишнюю муку только из-за небольшой липкости.
  - id: first-proof
    title: Дать тесту подняться
    instructions: >-
      Накрой тесто и оставь примерно на 1,5 часа при температуре около 24–26 °C. Через 35–45 минут один раз обомни и снова накрой. К концу подъёма тесто должно заметно увеличиться в объёме.
  - id: prepare-cabbage
    title: Подготовить капусту
    ingredients:
      - ingredient: cabbage-white
      - ingredient: cabbage-red
      - ingredient: salt-filling
    instructions: >-
      Тонко нашинкуй белую и красную капусту. Посоли частью соли для начинки, хорошо помни руками и оставь на 10–15 минут, чтобы капуста пустила сок. Затем тщательно отожми лишнюю жидкость. Учитывай солёность соевого соуса и не обязательно использовать всю указанную соль.
  - id: cook-filling
    title: Обжарить начинку
    ingredients:
      - ingredient: pork
      - ingredient: onion
      - ingredient: sweet-pepper
      - ingredient: hot-pepper
      - ingredient: garlic
      - ingredient: coriander
      - ingredient: black-pepper
      - ingredient: soy
      - ingredient: oil-vegetables
      - ingredient: sesame-oil
      - ingredient: salt-filling
      - ingredient: msg
    instructions: >-
      Пропусти свинину через мясорубку с решёткой 6 мм. Нарежь лук тонкими перьями, сладкий перец — небольшими кусочками, измельчи чеснок и острый перец. Разогрей растительное масло в большой сковороде. Обжарь лук 3–4 минуты до мягкости, добавь фарш и готовь, разбивая комочки, пока он не потеряет сырой вид. Добавь отжатую капусту и сладкий перец, обжаривай, помешивая, пока овощи не размягчатся и лишняя влага не испарится. В конце добавь чеснок, острый перец, кориандр, чёрный перец, соевый соус и по желанию глутамат натрия и кунжутное масло. Перемешай и готовь ещё 1–2 минуты. Проверь вкус на соль. Полностью остуди начинку перед лепкой.
  - id: divide
    title: Разделить тесто
    instructions: >-
      Слегка смажь рабочую поверхность растительным маслом. Раздели тесто на 12 равных частей примерно по 67 г. Округли их в колобки, накрой и оставь на 10 минут. Формуй в том же порядке, в котором округлял колобки, чтобы они отдыхали одинаковое время.
  - id: fill
    title: Сформовать пянсе
    instructions: >-
      Разомни каждый колобок пальцами в круг: края сделай тоньше, а середину оставь немного толще. Скалка не обязательна. Распредели остывшую начинку между 12 булочками. Подтяни края к центру и тщательно защипни сверху, при желании сделав защип «косичкой». Не переполняй булочки и хорошо закрывай шов.
  - id: proof
    title: Расстоять булочки
    instructions: >-
      Положи каждую булочку на отдельный небольшой кусочек пергамента, слегка смазанный маслом. Размести на уровнях мантоварки с промежутками и оставь под накрытием на 10 минут, чтобы тесто немного поднялось.
  - id: steam
    title: Приготовить на пару
    instructions: >-
      Заранее доведи воду в мантоварке до активного кипения. Установи уровни с булочками, оставляя пространство для циркуляции пара. Готовь на сильном пару 15 минут, считая после восстановления активного парообразования. Выключи огонь и не открывай крышку ещё 10 минут: постепенное остывание помогает булочкам не осесть. Затем осторожно открой крышку.
  - id: sauce
    title: Приготовить соус
    ingredients:
      - ingredient: soy-sauce
      - ingredient: chili-oil
      - ingredient: sesame
      - ingredient: sauce-coriander
      - ingredient: spring-onion
      - ingredient: sauce-garlic
    instructions: >-
      Мелко нарежь зелёный лук и измельчи чеснок. Смешай их с соевым соусом, чили-маслом, жареным кунжутом и молотым кориандром. Дай соусу постоять 5–10 минут. Подавай отдельно; по желанию соус можно добавить внутрь надрезанной булочки.
tips:
  - Тесто масштабировано с оригинала на 12 булочек: примерно по 67 г теста на каждую.
  - Капусту важно хорошо отжать, а готовую начинку полностью остудить перед лепкой.
  - Острота перца различается: 3 г — ориентир; для очень острого перца начни с 1.5 г.
storage:
  - Готовые пянсе храни в холодильнике до 2 дней. Разогревай на пару 5–8 минут.
  - Готовые остывшие пянсе можно заморозить в герметичной упаковке. Для лучшего результата сначала заморозь их в один слой, затем переложи в пакет или контейнер. Разогревай без предварительного размораживания на пару примерно 10–15 минут, до полного прогрева.
