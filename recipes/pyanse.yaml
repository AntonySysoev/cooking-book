steps:
  - id: dough
    title: Замесить тесто
    ingredients:
      - ingredient: flour
      - ingredient: water
      - ingredient: yeast
      - ingredient: sugar
      - ingredient: salt
      - ingredient: oil-dough
    instructions: >-
      Смешай воду, дрожжи и сахар. Добавь муку и соль, замеси в Ankarsrum до гладкого теста, затем введи масло. Накрой и оставь до увеличения примерно вдвое.
  - id: meat
    title: Подготовить мясо
    ingredients:
      - ingredient: pork
      - ingredient: beef
    instructions: >-
      Пропусти охлаждённое мясо через мясорубку с решёткой 6 мм. Если мясо уже фарш, просто охлади его перед смешиванием.
  - id: vegetables
    title: Подготовить овощи и начинку
    ingredients:
      - ingredient: cabbage
      - ingredient: onion
      - ingredient: garlic
      - ingredient: soy
      - ingredient: sesame-oil
      - ingredient: black-pepper
      - ingredient: salt-filling
    instructions: >-
      Мелко нашинкуй капусту и лук, чеснок измельчи. Смешай овощи с мясом, соевым соусом, кунжутным маслом, перцем и солью. Не отжимай капусту насухо: сок поможет сохранить начинку сочной.
  - id: divide
    title: Разделить тесто
    instructions: >-
      Раздели поднявшееся тесто на 10 частей. Каждую округли, накрой и дай отдохнуть 10 минут.
  - id: fill
    title: Сформовать пянсе
    instructions: >-
      Раскатай каждую часть в круг с более тонкими краями и более толстой серединой. Положи начинку в центр, собери края сверху и тщательно защипни шов. Оставь немного места для расширения.
  - id: proof
    title: Расстоять
    instructions: >-
      Положи булочки швом вверх на квадраты пергамента и оставь на 20–30 минут. Между ними должно быть пространство.
  - id: steam
    title: Приготовить на пару
    instructions: >-
      Доведи воду в мантоварке до устойчивого кипения. Разложи булочки на смазанные или выстеленные пергаментом уровни, не перегружая их. Готовь на сильном пару 20–25 минут после восстановления активного парообразования. После выключения оставь под крышкой 5 минут, затем открывай осторожно.
tips:
  - Не открывай крышку в первые 20 минут приготовления: резкий перепад температуры может осадить тесто.
  - Начинка должна быть холодной при формовании; готовность мяса проверь в самой крупной булочке.
storage:
  - Готовые пянсе храни в холодильнике до 2 дней. Разогревай на пару 5–8 минут.
