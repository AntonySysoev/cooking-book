steps:
  - id: dough
    title: Замесить тесто
    ingredients:
      - ingredient: flour
      - ingredient: water
      - ingredient: yeast
      - ingredient: sugar
      - ingredient: salt
      - ingredient: oil-dough
    instructions: >-
      Смешай тёплую воду, дрожжи и сахар. Добавь муку и соль, замеси в Ankarsrum до гладкого эластичного теста, затем введи растительное масло и вымеси до однородности. Гидратация по воде — около 67%; не добавляй лишнюю муку только из-за небольшой липкости.
  - id: first-proof
    title: Дать тесту подняться
    instructions: >-
      Накрой тесто и оставь примерно на 45–60 минут при температуре около 24–26 °C, пока объём не увеличится примерно в 1,5–2 раза. В прохладном помещении подъём займёт больше времени.
  - id: vegetables
    title: Подготовить овощи
    ingredients:
      - ingredient: cabbage-white
      - ingredient: cabbage-red
      - ingredient: onion
      - ingredient: sweet-pepper
      - ingredient: hot-pepper
      - ingredient: garlic
      - ingredient: coriander
      - ingredient: black-pepper
      - ingredient: oil-vegetables
    instructions: >-
      Тонко нашинкуй обе капусты, мелко нарежь лук и сладкий перец. Острый перец измельчи; при необходимости удали семена и перегородки. Чеснок измельчи. Разогрей растительное масло в большой сковороде. Обжарь лук 3–4 минуты, добавь капусту и готовь ещё 6–10 минут, пока она не осядет и лишняя влага в основном не испарится. Добавь сладкий перец и жарь 2–3 минуты. В конце добавь острый перец, чеснок, кориандр и чёрный перец, перемешай и готовь ещё 30–60 секунд. Полностью остуди овощи.
  - id: meat
    title: Смешать начинку
    ingredients:
      - ingredient: pork
      - ingredient: soy
      - ingredient: sesame-oil
      - ingredient: salt-filling
      - ingredient: msg
    instructions: >-
      Пропусти охлаждённую свинину через мясорубку с решёткой 6 мм. Смешай сырой фарш с полностью остывшими овощами, соевым соусом, кунжутным маслом, солью и, по желанию, глутаматом натрия. Держи начинку в холодильнике до формования.
  - id: divide
    title: Разделить тесто
    instructions: >-
      Раздели поднявшееся тесто на равные части — всего {{yield.quantity}}. Каждую округли, накрой и дай отдохнуть 10 минут.
  - id: fill
    title: Сформовать пянсе
    instructions: >-
      Раскатай каждую часть в круг с более тонкими краями и более толстой серединой. Каждая часть теста весит примерно 87 г для партии из 12 булочек. Распредели начинку между булочками. Собери края сверху и тщательно защипни шов. Оставь немного места для расширения.
  - id: proof
    title: Расстоять булочки
    instructions: >-
      Положи булочки швом вверх на квадраты пергамента и оставь под накрытием на 20–30 минут, пока они немного не увеличатся и не станут пышнее. Между ними должно быть пространство.
  - id: steam
    title: Приготовить на пару
    instructions: >-
      Доведи воду в мантоварке до устойчивого кипения. Разложи булочки на выстеленные пергаментом уровни, не перегружая их. Готовь на сильном пару 25–30 минут после восстановления активного парообразования; крупным булочкам может понадобиться больше времени. Не открывай крышку во время приготовления. После выключения оставь под крышкой 5 минут, затем открывай осторожно. В самой крупной булочке температура в центре мясной начинки должна достигнуть как минимум 71 °C.
  - id: sauce
    title: Приготовить соус
    ingredients:
      - ingredient: soy-sauce
      - ingredient: chili-oil
      - ingredient: sesame
      - ingredient: sauce-coriander
      - ingredient: spring-onion
      - ingredient: sauce-garlic
    instructions: >-
      Мелко нарежь зелёный лук и измельчи чеснок. Смешай с соевым соусом, чили-маслом, кунжутом и молотым кориандром. Дай постоять 5–10 минут и подавай отдельно к горячим пянсе.
tips:
  - На 600 г муки и 400 г воды гидратация теста составляет 66,7% — тесто будет мягким и немного липким, что нормально для пышных паровых булочек.
  - Начинку смешивай только после полного остывания овощей, чтобы не начать готовить свиной фарш заранее.
  - Острота перца различается: 4 г — ориентир; для очень острого перца начни с 2 г.
storage:
  - Готовые пянсе храни в холодильнике до 2 дней. Разогревай на пару 5–8 минут.
  - Готовые остывшие пянсе можно заморозить в герметичной упаковке. Для лучшего результата сначала заморозь их в один слой, затем переложи в пакет или контейнер. Разогревай без предварительного размораживания на пару примерно 10–15 минут, до полного прогрева.
