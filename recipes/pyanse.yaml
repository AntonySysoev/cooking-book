id: pyanse
title: Пянсе
description: Паровые дрожжевые булочки со свининой, белой и красной капустой, сладким и острым перцем. Начинка обжаривается до готовности, булочки готовятся на пару.
category: main-dishes
subcategory: dumplings
tags: [пянсе, паровые булочки, свинина, капуста, острый перец]
yield:
  quantity: 12
  unit: булочек
time:
  active_minutes: 75
  total_minutes_min: 150
  total_minutes_max: 210
equipment:
  - Ankarsrum
  - Мясорубка с решёткой 6 мм
  - Пароварка-мантоварка на 4 уровня
