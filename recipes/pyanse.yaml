id: pyanse
title: Пянсе
description: Паровые дрожжевые булочки со свининой, обжаренными овощами, белой и красной капустой, сладким и острым перцем; подаются с пикантным соусом.
category: main-dishes
subcategory: dumplings
tags: [пянсе, паровые булочки, свинина, капуста, острый перец]
yield:
  quantity: 16
  unit: булочек
time:
  active_minutes: 75
  total_minutes_min: 150
  total_minutes_max: 210
equipment:
  - Ankarsrum
  - Мясорубка с решёткой 6 мм
  - Пароварка-мантоварка на 4 уровня
