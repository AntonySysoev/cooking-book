id: homemade-vanilla-extract-jack-daniels
title: Домашний ванильный экстракт на Jack Daniel’s
description: >-
  Насыщенный ванильный экстракт на виски крепостью 45%. Ваниль дополняется
  карамельными, дубовыми и фруктовыми оттенками Tennessee whiskey. Подходит
  для выпечки, шоколадных десертов, мороженого и кремов.
category: sauces-and-preserves
subcategory: sauces
tags: [ваниль, ванильный экстракт, домашние заготовки, Jack Daniel’s, виски]
yield:
  quantity: 1
  unit: небольшая бутылка (около 200 г до потерь на настаивание)
time:
  active_minutes: 15
  total_minutes_min: 129600
  total_minutes_max: 525600
equipment:
  - Весы с точностью до 0,1 г
  - Небольшая чистая стеклянная бутылка с плотной крышкой
  - Нож и разделочная доска
ingredient_groups:
  - id: ingredients
    title: Ингредиенты
ingredients:
  - id: whiskey
    name: Jack Daniel’s Tennessee whiskey, 45%
    quantity: 200
    unit: г
    group: ingredients
  - id: vanilla
    name: Натуральные стручки ванили
    quantity: 40
    unit: г
    group: ingredients
steps:
  - id: prepare-vanilla
    title: Подготовить стручки
    ingredients:
      - ingredient: vanilla
    instructions: >-
      Убедись, что стручки сухие, чистые и без следов плесени. Разрежь каждый
      вдоль, раскрой и нарежь кусочками примерно по 1–2 см. Семена не выскребай:
      они тоже должны попасть в экстракт. Не промывай стручки водой.
  - id: combine
    title: Залить виски
    ingredients:
      - ingredient: whiskey
      - ingredient: vanilla
    instructions: >-
      Переложи стручки и семена в чистую сухую стеклянную бутылку подходящего
      объёма. Залей виски так, чтобы ваниль была полностью погружена. Если
      стручки всплывают, используй узкую бутылку или чистый стеклянный грузик,
      пригодный для контакта с пищей. Плотно закрой крышку.
  - id: extract
    title: Настаивать
    instructions: >-
      Храни бутылку в тёмном шкафу при стабильной комнатной температуре,
      вдали от солнца и источников тепла. Встряхивай примерно раз в неделю
      первый месяц, затем время от времени. Через 3 месяца оцени аромат;
      для более полного вкуса выдерживай 6–12 месяцев. Не нагревай и не
      оставляй бутылку открытой.
  - id: use
    title: Использовать и хранить
    instructions: >-
      Используй экстракт вместе с небольшим количеством настоявшихся семян
      или процеживай порцию непосредственно перед добавлением в рецепт.
      Стручки можно оставить в бутылке для дальнейшего настаивания. Если
      извлекаешь их, работай чистым сухим прибором. Не доливай алкоголь
      автоматически: при пополнении меняется концентрация и срок созревания.
tips:
  - >-
    Соотношение 40 г ванили на 200 г виски выбрано как насыщенная домашняя
    пропорция, а не как стандартизированный коммерческий экстракт. Реальная
    интенсивность зависит от сорта, влажности и качества стручков.
  - >-
    Jack Daniel’s 45% сам по себе имеет ноты карамели, ванили и дуба. Они
    останутся частью вкуса экстракта; он не будет нейтральным и особенно
    хорошо подойдёт шоколаду, карамели, мороженому и пряной выпечке.
  - >-
    Используй только сухие стручки. Не добавляй в бутылку стручки, которые
    предварительно настаивались в молоке: остатки молока и влаги нежелательны
    для хранения алкогольного экстракта.
storage:
  - >-
    Храни плотно закрытым в тёмном прохладном шкафу. Всегда используй чистую
    сухую ложку или пипетку и не допускай попадания воды или пищевых остатков
    в бутылку. При появлении плесени, необычного помутнения или постороннего
    запаха экстракт не используй.
