id: homemade-vanilla-extract
title: Домашний ванильный экстракт
description: >-
  Концентрированный домашний ванильный экстракт на алкогольной основе.
  Выбор напитка позволяет менять профиль: от нейтральной ванили на водке
  до сочетания ванили с фруктовыми, древесными или карамельными нотами.
category: sauces-and-preserves
subcategory: sauces
tags: [ваниль, ванильный экстракт, домашние заготовки, настойка, ваниль]
yield:
  quantity: 1
  unit: небольшая бутылка (около 200 г исходного алкоголя)
time:
  active_minutes: 15
  total_minutes_min: 129600
  total_minutes_max: 525600
equipment:
  - Весы с точностью до 0,1 г
  - Небольшая чистая стеклянная бутылка с плотной крышкой
  - Нож и разделочная доска
ingredient_groups:
  - id: ingredients
    title: Ингредиенты
ingredients:
  - id: alcohol
    name: Питьевой алкоголь без добавленного сахара, крепостью 40–50%
    quantity: 200
    unit: г
    group: ingredients
    note: Выбери напиток по желаемому вкусу; варианты описаны в советах.
  - id: vanilla
    name: Натуральные стручки ванили
    quantity: 40
    unit: г
    group: ingredients
steps:
  - id: prepare-vanilla
    title: Подготовить стручки
    ingredients:
      - ingredient: vanilla
    instructions: >-
      Используй сухие, чистые стручки без следов плесени. Разрежь каждый вдоль,
      раскрой и нарежь кусочками примерно по 1–2 см. Семена не выскребай:
      они тоже должны попасть в экстракт. Не промывай стручки водой.
  - id: combine
    title: Залить алкоголем
    ingredients:
      - ingredient: alcohol
      - ingredient: vanilla
    instructions: >-
      Переложи стручки и семена в чистую сухую стеклянную бутылку подходящего
      объёма. Залей алкоголем так, чтобы ваниль была полностью погружена.
      Выбирай узкую бутылку, если в широкой стручки не покрываются жидкостью.
      Плотно закрой крышку.
  - id: extract
    title: Настаивать
    instructions: >-
      Храни бутылку в тёмном шкафу при стабильной комнатной температуре,
      вдали от солнца и источников тепла. Встряхивай примерно раз в неделю
      первый месяц, затем время от времени. Через 3 месяца оцени аромат;
      для более полного вкуса выдерживай 6–12 месяцев. Не нагревай и не
      оставляй бутылку открытой.
  - id: use
    title: Использовать
    instructions: >-
      Используй экстракт вместе с небольшим количеством настоявшихся семян
      или процеживай порцию непосредственно перед добавлением в рецепт.
      Стручки можно оставить в бутылке для дальнейшего настаивания. Если
      извлекаешь их, работай чистым сухим прибором. Не доливай алкоголь
      автоматически: при пополнении меняется концентрация и срок созревания.
tips:
  - >-
    Базовая пропорция — 40 г стручков на 200 г алкоголя. Это намеренно
    насыщенная домашняя заготовка, а не стандартизированный коммерческий
    экстракт. Интенсивность зависит от сорта, влажности, свежести и качества
    стручков.
  - >-
    Выбирай несладкий питьевой алкоголь крепостью примерно 40–50%.
    Водка даст наиболее нейтральный профиль и позволит ванили звучать
    самостоятельно. Бренди или коньяк добавят виноградные, фруктовые,
    древесные и иногда дубовые оттенки; это хорошо сочетается с кремами,
    карамелью и праздничной выпечкой.
  - >-
    Ракия тоже подходит, если это чистый несладкий дистиллят крепостью
    40–50%. Виноградная ракия обычно даст фруктовые и винные ноты, а
    сливовая, абрикосовая или другая фруктовая — более узнаваемый аромат
    исходного фрукта. Чем выразительнее ракия, тем заметнее она повлияет
    на экстракт; для тонкой ванили выбирай мягкую и чистую.
  - >-
    Виски добавит дубовые, зерновые, карамельные и пряные оттенки.
    Бурбон обычно ярче по ванильно-карамельному профилю; Tennessee whiskey
    и другие мягкие виски тоже подойдут, но их собственный характер
    останется в экстракте.
  - >-
    Нейтральный или светлый несладкий ром даст мягкий тростниковый фон.
    Тёмный ром добавит мелассовые, карамельные и иногда древесные ноты.
    Пряный ром лучше не выбирать: корица, гвоздика и другие специи могут
    перебить ваниль. Джин тоже обычно слишком ботанический для универсального
    экстракта.
  - >-
    Не используй ликёры, сладкие настойки и напитки с добавленным сахаром:
    их крепость часто ниже желательной, а сахар и ароматизаторы меняют
    профиль и затрудняют универсальное дозирование. Не используй технический
    спирт или алкоголь неизвестного происхождения.
  - >-
    Количество ванили можно увеличить до 50–60 г на те же 200 г алкоголя.
    Экстракт может стать интенсивнее, но прирост аромата не будет
    пропорциональным: свободной жидкости меньше относительно стручков,
    они впитывают алкоголь, их сложнее полностью погрузить, а дополнительная
    ваниль даёт всё меньшую отдачу. При 25–30 г на 200 г получится более
    мягкий вариант. Если стручки не покрываются алкоголем, используй более
    узкую бутылку или увеличь количество алкоголя.
  - >-
    Используй только сухие стручки. Не добавляй стручки, которые предварительно
    настаивались в молоке: остатки молока и влаги нежелательны для длительного
    хранения алкогольного экстракта.
storage:
  - >-
    Храни плотно закрытым в тёмном прохладном шкафу. Всегда используй чистую
    сухую ложку или пипетку и не допускай попадания воды или пищевых остатков
    в бутылку. При появлении плесени, необычного помутнения или постороннего
    запаха экстракт не используй.
