steps:
  - id: prepare
    title: Подготовить ингредиенты
    instructions: >-
      Доведи масло для теста и начинки до мягкого состояния. Подготовь форму
      для 12 крупных булочек. Молоко должно быть прохладным или слегка тёплым,
      но не горячим. Сливочный сыр для крема заранее достань из холодильника,
      а маскарпоне и сливки оставь холодными.
  - id: soak-blueberries
    title: Размягчить чернику
    ingredients:
      - ingredient: dried-blueberries
      - ingredient: soaking-water
    instructions: >-
      Залей сушёную чернику водой температурой около 70–80 °C и оставь
      на 15–20 минут. Откинь на сито, дай воде стечь около 5 минут и тщательно
      обсуши ягоды. Примерно треть ягод мелко поруби, остальные оставь целыми.
      Воду после замачивания не используй в начинке.
  - id: mix-dough
    title: Замесить тесто
    ingredients:
      - ingredient: flour
      - ingredient: milk
      - ingredient: eggs
      - ingredient: dough-sugar
      - ingredient: yeast
      - ingredient: salt
        part: dough
    instructions: >-
      Установи в Ankarsrum ролик и скребок. Соедини молоко, яйца, сахар и дрожжи,
      добавь муку и соль. Замешивай на низкой скорости 3–4 минуты до объединения
      ингредиентов, затем продолжай замес до развития клейковины.
  - id: add-butter
    title: Ввести масло
    ingredients:
      - ingredient: butter
        part: dough
    instructions: >-
      Постепенно введи 90 г мягкого масла небольшими порциями, дожидаясь,
      пока каждая порция распределится. Продолжай замес примерно 10–15 минут
      на умеренной скорости. Готовое тесто должно стать гладким, эластичным
      и растяжимым. Оно может немного липнуть к рукам; не добавляй лишнюю муку
      только ради сухой поверхности.
  - id: first-proof
    title: Первое брожение
    instructions: >-
      Переложи тесто в слегка смазанную маслом ёмкость, накрой и оставь
      при температуре около 25–27 °C на 60–90 минут, до увеличения объёма
      примерно в 1,7–2 раза. В прохладном помещении брожение может занять дольше.
  - id: prepare-filling
    title: Подготовить ягодную смесь
    ingredients:
      - ingredient: brown-sugar
      - ingredient: cornstarch
      - ingredient: lemon-zest
      - ingredient: lemon-juice
      - ingredient: cinnamon
      - ingredient: berry-jam
    instructions: >-
      Смешай коричневый сахар, крахмал, лимонную цедру, лимонный сок и корицу,
      если используешь, затем вмешай варенье до однородности. Если в варенье
      много жидкого сиропа, лучше предварительно уварить его и полностью остудить.
      Смесь должна распределяться тонким слоем, не растекаясь по тесту.
  - id: roll-dough
    title: Раскатать тесто
    instructions: >-
      Выложи подошедшее тесто на слегка подпылённую мукой поверхность. При
      необходимости дай ему отдохнуть 5–10 минут. Раскатай в прямоугольник
      примерно 45 × 50 см толщиной около 5–7 мм.
  - id: spread-filling
    title: Распределить начинку
    ingredients:
      - ingredient: butter
        part: filling
      - ingredient: dried-blueberries
    instructions: >-
      Равномерно распредели по тесту 70 г мягкого масла, оставив свободными
      около 2–3 см вдоль одного длинного края. Нанеси подготовленную черничную
      смесь тонким равномерным слоем, не доходя до свободного края. Распредели
      обсушенную чернику. Не делай начинку слишком толстой и не заполняй
      свободный край, чтобы рулет хорошо склеился. При сворачивании не сдавливай
      рулет чрезмерно: витки должны держать форму, но не выдавливать начинку.
  - id: shape
    title: Сформовать роллы
    instructions: >-
      Сверни тесто в плотный рулет вдоль стороны длиной 50 см, чтобы рулет
      получился длиной около 45 см. Острым ножом или нитью нарежь его на
      12 одинаковых частей. Переложи роллы срезом вверх в смазанную форму,
      оставляя небольшие промежутки для подъёма.
  - id: second-proof
    title: Расстойка
    instructions: >-
      Накрой форму и оставь роллы при температуре около 25–27 °C на 40–60 минут.
      Они должны заметно увеличиться в объёме, стать воздушными и почти
      соприкасаться. Ориентируйся на состояние теста, а не только на время.
  - id: prepare-sauce
    title: Приготовить черничный соус
    ingredients:
      - ingredient: sauce-blueberries
      - ingredient: sauce-jam
      - ingredient: sauce-sugar
      - ingredient: sauce-lemon-juice
      - ingredient: sauce-cornstarch
      - ingredient: sauce-water
    instructions: >-
      Положи чернику, варенье, сахар и лимонный сок в небольшой ковшик.
      Прогрей на среднем огне 4–6 минут, пока ягоды не начнут лопаться.
      Разотри часть ягод ложкой, оставив часть целыми. Отдельно размешай
      крахмал в холодной воде до однородности, влей тонкой струйкой в ягоды
      и провари 30–60 секунд, постоянно помешивая, пока соус не станет
      блестящим и достаточно густым, чтобы держаться на ложке. Сними с огня.
      Соус должен быть текучим в горячем виде: при остывании он загустеет.
  - id: bake
    title: Выпечь
    instructions: >-
      Заранее разогрей духовку. Выпекай при фактической температуре 180 °C,
      используя верхний и нижний нагрев без конвекции, примерно 22–28 минут.
      Начни проверять готовность с 20-й минуты. Роллы должны стать золотистыми,
      а тесто в центре — пропечься; ориентир температуры в центре около 93–96 °C.
      Если верх темнеет слишком быстро, прикрой форму фольгой.
  - id: prepare-frosting
    title: Приготовить густой крем
    ingredients:
      - ingredient: cream-cheese
      - ingredient: mascarpone
      - ingredient: icing-sugar
      - ingredient: cream
      - ingredient: vanilla
      - ingredient: salt
        part: frosting
    instructions: >-
      Перемешай сливочный сыр с сахарной пудрой, ванилью и солью до гладкости.
      Добавь холодный маскарпоне и осторожно перемешай на низкой скорости
      в Ankarsrum с помощью Cookie Beaters, только до объединения. Введи 20 г
      сливок и перемешай. Если крем слишком плотный, добавляй оставшиеся сливки
      порциями по 5 г, максимум до общего количества 30 г. Не взбивай крем
      до пышности и не перемешивай дольше необходимого, чтобы маскарпоне
      не стал зернистым или не расслоился.
  - id: finish
    title: Добавить соус и крем
    instructions: >-
      После выпечки оставь роллы на 5–8 минут. Пока они ещё горячие, ложкой
      распредели часть тёплого черничного соуса по верхушкам и в промежутки
      между витками, чтобы он затёк внутрь спиралей. Остальной соус подай отдельно.
      Если хочешь использовать сливочный крем, подожди ещё 10–15 минут и нанеси
      его тонким слоем или отдельными завитками. Крем необязателен: соус уже
      даёт булочкам дополнительную сочность.
tips:
  - >-
    Чернику для начинки обязательно обсуши после замачивания: лишняя вода
    может сделать начинку мокрой и помешать формированию спиралей.
  - >-
    Используй густое варенье без избытка сиропа. Черничную смесь распределяй
    тонким слоем: слишком толстая начинка может вытечь, а тесто — склеиться.
  - >-
    Не затягивай рулет слишком туго и не передерживай роллы на расстойке.
    Они должны стать воздушными и почти соприкасаться, но не осесть.
  - >-
    Соус добавляй в горячие булочки после короткого отдыха: так он затечёт
    в промежутки между витками. Не выливай сразу весь соус в форму, чтобы
    нижняя часть булочек не размокла.
  - >-
    Для крема используй Cookie Beaters, а не Balloon Whisks: цель — гладкая
    густая масса с минимальной аэрацией.
  - >-
    Если булочки быстро темнеют, прикрой их фольгой в конце выпечки.
storage:
  - >-
    После полного остывания храни булочки с кремом в закрытом контейнере
    в холодильнике до 3 дней. Перед подачей дай порции немного согреться.
  - >-
    Булочки без крема можно заморозить после полного остывания.
