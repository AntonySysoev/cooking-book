id: blueberry-rolls-cream-cheese
title: Черничные роллы с белой сливочной прослойкой
description: >-
  Мягкие сдобные роллы с сушёной черникой, ягодным вареньем и лимонной
  цедрой, с белыми полосами сливочной начинки из маскарпоне и сливочного сыра
  внутри и густым сливочным кремом сверху. Тесто замешивается в Ankarsrum.
category: baking-and-dough
also_in: [desserts]
subcategory: buns-and-pastries
tags:
  - черника
  - ягодные булочки
  - сливочный крем
  - маскарпоне
  - сдобное тесто
yield:
  quantity: 12
  unit: крупных булочек
time:
  active_minutes: 60
  total_minutes_min: 210
  total_minutes_max: 270
equipment:
  - Планетарный тестомес Ankarsrum
  - Насадка-ролик и скребок для замеса теста
  - Cookie Beaters для перемешивания крема
  - Скалка
  - Форма для выпечки
  - Нож или нить для нарезки рулета
