id: orange-chocolate-macarons
title: Апельсиновые макароны с тёмным шоколадом, кардамоном и ромом
description: >-
  Макароны на итальянской меренге с апельсиновым гелем в центре и кольцом
  шоколадного ганаша с тёмным ромом. Кардамон поддерживает цитрусовый аромат,
  а тёмный шоколад уравновешивает сладость апельсина.
category: desserts
subcategory: cakes-and-pastries
tags:
  - макароны
  - macarons
  - апельсин
  - тёмный шоколад
  - кардамон
  - ром
  - итальянская меренга
yield:
  quantity: 42
  unit: макарона
time:
  active_minutes: 110
  total_minutes_min: 360
  total_minutes_max: 540
equipment:
  - Весы с точностью до 0,1 г
  - Ankarsrum с Balloon Whisks для итальянской меренги
  - Блендер Ninja PowerBowl для короткого измельчения геля при необходимости
  - Кондитерский мешок с круглой насадкой 8–10 мм
  - Кухонный термометр для сиропа
  - Противни и силиконовый коврик или пергамент
  - Мелкое сито для сухих ингредиентов
ingredient_groups:
  - id: shells
    title: Миндальные оболочки
  - id: orange-gel
    title: Апельсиновый гель
  - id: chocolate-ganache
    title: Шоколадный ганаш с ромом
