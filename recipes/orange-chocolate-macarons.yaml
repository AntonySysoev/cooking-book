steps:
  - id: sift-dry
    title: Подготовить сухую смесь
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
    instructions: >-
      Просей миндальную муку с сахарной пудрой. Крупные частицы миндаля коротко
      измельчи отдельно и просей повторно; не перемалывай долго, чтобы орех
      не начал выделять масло.
  - id: almond-paste
    title: Смешать миндальную пасту
    ingredients:
      - ingredient: egg-whites
        part: almond-mixture
    instructions: >-
      Добавь 75 г белков к сухой смеси и перемешай лопаткой до густой однородной
      пасты. Накрой, чтобы она не подсыхала.
  - id: meringue
    title: Приготовить итальянскую меренгу
    ingredients:
      - ingredient: egg-whites
        part: meringue
      - ingredient: caster-sugar
      - ingredient: syrup-water
    instructions: >-
      Нагрей сахар с водой в сотейнике до 118 °C, не перемешивая после растворения
      сахара. Когда сироп достигнет 108–110 °C, начни взбивать оставшиеся 75 г
      белков в Ankarsrum с Balloon Whisks до мягких пиков. Влей сироп тонкой
      струёй между венчиком и стенкой чаши и взбивай до плотной блестящей меренги,
      остывшей примерно до 40–45 °C.
  - id: macaronage
    title: Выполнить макаронаж
    instructions: >-
      Вмешай примерно треть меренги в миндальную пасту, затем в 2–3 приёма
      введи остаток. Складывай массу лопаткой снизу вверх, поворачивая миску.
      Остановись, когда тесто станет блестящим и будет стекать широкой непрерывной
      лентой; след должен сливаться с поверхностью примерно за 10–20 секунд.
  - id: pipe-shells
    title: Отсадить и подсушить оболочки
    instructions: >-
      Переложи массу в кондитерский мешок с круглой насадкой 8–10 мм и отсади
      круги диаметром 3,5–4 см, держа мешок вертикально. Постучи противнем
      по столу, проколи видимые пузырьки и оставь оболочки при комнатной
      температуре на 20–45 минут, пока поверхность не станет сухой и не будет
      липнуть к чистому пальцу.
  - id: bake-shells
    title: Выпечь оболочки
    instructions: >-
      Выпекай при фактической температуре 145 °C, верхний и нижний нагрев без
      конвекции, на среднем уровне примерно 15–18 минут, по одному противню.
      Начни проверять с 14-й минуты. Готовая оболочка держит юбочку, а верх
      не скользит отдельно от основания при лёгком касании. Полностью остуди
      перед снятием с коврика.
  - id: orange-gel
    title: Приготовить апельсиновый гель
    ingredients:
      - ingredient: orange-puree
      - ingredient: orange-sugar
      - ingredient: orange-glucose
      - ingredient: pectin
      - ingredient: lemon-juice
      - ingredient: orange-zest
      - ingredient: cardamom
    instructions: >-
      Смешай сахар с пектином NH. Нагрей апельсиновое пюре примерно до 40–45 °C,
      тонкой струёй всыпь сахарно-пектиновую смесь, непрерывно перемешивая.
      Добавь глюкозный сироп, доведи до кипения и провари 30–60 секунд,
      чтобы пектин полностью активировался. Сними с огня, вмешай лимонный сок,
      цедру и кардамон. Переложи в неглубокую ёмкость, накрой плёнкой в контакт
      и охлади до полного загустения. Перед отсадкой коротко пробей в PowerBowl
      импульсами или разомни венчиком до однородной отсаживаемой консистенции.
  - id: chocolate-ganache
    title: Приготовить шоколадный ганаш с ромом
    ingredients:
      - ingredient: dark-chocolate
      - ingredient: cream
      - ingredient: butter
      - ingredient: ganache-glucose
      - ingredient: rum
      - ingredient: salt
    instructions: >-
      Нагрей сливки с глюкозным сиропом до 75–80 °C. В три приёма влей смесь
      в шоколад, каждый раз тщательно эмульгируя от центра к краям. При наличии
      погружного блендера кратко пробей эмульсию, удерживая насадку под
      поверхностью. При 35–40 °C добавь мягкое сливочное масло и соль,
      эмульгируй до гладкости. Когда ганаш остынет до 30–32 °C, добавь ром
      и перемешай до однородности. Накрой плёнкой в контакт и созревай
      в холодильнике 8–12 часов.
  - id: assemble
    title: Собрать макароны с двумя текстурами
    instructions: >-
      Переложи ганаш и апельсиновый гель в отдельные кондитерские мешки.
      Отсади на половину оболочек кольцо из ганаша, оставив центр свободным,
      затем заполни центр гелем. Ориентир на один макарон — около 7 г ганаша
      и 3 г геля. Накрой второй половинкой и слегка прижми, чтобы начинка
      распределилась, но не вытекла за край.
  - id: mature
    title: Дать макаронам созреть
    instructions: >-
      Разложи макароны в герметичный контейнер и выдержи в холодильнике при
      3–5 °C 18–24 часа. Перед подачей дай постоять 15–20 минут при комнатной
      температуре.
tips:
  - >-
    Для этого рецепта используй именно пектин NH: он активируется кипячением
    и после охлаждения образует гель, который можно снова сделать текучим
    кратким нагревом или измельчением.
  - >-
    Если используешь Atlantis Spiced Red Rum, не увеличивай кардамон:
    пряный профиль рома уже добавляет специи. Если берёшь нейтральный тёмный
    ром, кардамон можно увеличить лишь немного, примерно до 0,15 г.
  - >-
    Кольцо ганаша удерживает гель в центре, но не создаёт герметичного барьера:
    при длительном хранении влага из апельсиновой вставки постепенно может
    переходить в оболочку. Лучший результат ожидай в первые 24–48 часов.
storage:
  - >-
    Храни собранные макароны в герметичном контейнере в холодильнике при
    3–5 °C до 2 дней. Перед подачей дай им немного согреться.
  - >-
    Незаполненные полностью остывшие оболочки можно заморозить в герметичном
    контейнере; размораживай их закрытыми, чтобы избежать конденсата.
