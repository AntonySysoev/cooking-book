    quantity: 200
    unit: г
    group: shells
  - id: egg-whites
    name: Яичные белки
    quantity: 150
    unit: г
    group: shells
    note: Без следов желтка; разделить на две порции по 75 г.
    parts:
      - id: almond-mixture
        name: Для миндальной пасты
        quantity: 75
        group: shells
      - id: meringue
        name: Для меренги
        quantity: 75
        group: shells
