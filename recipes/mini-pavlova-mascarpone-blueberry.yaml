id: mini-pavlova-mascarpone-blueberry
title: Порционная Павлова с маскарпоне и черникой
description: Хрустящие снаружи и нежные внутри мини-Павловы с кремом из маскарпоне и сливок, черничным вареньем и свежими ягодами.
category: desserts
subcategory: cakes-and-pastries
tags:
  - Павлова
  - меренга
  - маскарпоне
  - черника
  - порционный десерт
yield:
  quantity: 8
  unit: шт.
time:
  active_minutes: 45
  total_minutes_min: 300
  total_minutes_max: 360
equipment:
  - Духовка с верхним и нижним нагревом
  - Ankarsrum с венчиком
  - Противень
  - Пергамент
  - Кондитерский мешок или ложка для крема
ingredient_groups:
  - id: meringue
    title: Меренга
  - id: cream
    title: Крем с маскарпоне
  - id: topping
    title: Для сборки
ingredients:
  - id: egg-whites
    name: Яичные белки
    quantity: 190
    unit: г
    group: meringue
    note: Примерно белки от 6 яиц
  - id: sugar
    name: Мелкий белый сахар
    quantity: 300
    unit: г
    group: meringue
  - id: cornstarch
    name: Кукурузный крахмал
    quantity: 12
    unit: г
    group: meringue
  - id: lemon-juice
    name: Лимонный сок
    quantity: 10
    unit: г
    group: meringue
  - id: vanilla-meringue
    name: Ванильная эссенция
    quantity: 5
    unit: мл
    group: meringue
  - id: salt
    name: Соль
    quantity: 0.3
    unit: г
    group: meringue
  - id: mascarpone
    name: Маскарпоне
    quantity: 250
    unit: г
    group: cream
  - id: cream
    name: Сливки 33–35%
    quantity: 250
    unit: г
    group: cream
  - id: icing-sugar
    name: Сахарная пудра
    quantity: 20
    unit: г
    group: cream
  - id: vanilla-cream
    name: Ваниль
    quantity: 2
    unit: г
    group: cream
    optional: true
  - id: blueberry-jam
    name: Черничное варенье
    quantity: 110
    unit: г
    group: topping
  - id: fresh-blueberries
    name: Свежая черника
    quantity: 125
    unit: г
    group: topping
    optional: true
steps:
  - id: oven
    title: Подготовить духовку
    instructions: >-
      Поставь решётку примерно в середину духовки. Разогрей до фактических
      120 °C по термометру, режим верх + низ, без конвекции. После постановки
      противня снизь температуру до фактических 105–110 °C. Ориентируйся именно
      на температуру термометра, а не на цифру на панели.
  - id: whip
    title: Взбить белки
    ingredients:
      - ingredient: egg-whites
      - ingredient: salt
    instructions: >-
      Белки должны быть комнатной температуры. В абсолютно чистой чаше Ankarsrum
      начни взбивать белки с солью на средней скорости. Когда появится однородная
      белая пена, постепенно увеличь скорость и взбивай до мягких пиков.
  - id: sugar
    title: Постепенно добавить сахар
    ingredients:
      - ingredient: sugar
    instructions: >-
      Продолжая взбивать, добавляй сахар небольшими порциями, примерно по одной
      столовой ложке, давая каждой порции немного раствориться. После добавления
      всего сахара взбивай ещё несколько минут до очень белой, блестящей и плотной
      меренги, которая держит чёткий пик. Разотри немного смеси между пальцами:
      кристаллики сахара должны почти не ощущаться.
  - id: starch
    title: Вмешать крахмал, кислоту и ваниль
    ingredients:
      - ingredient: cornstarch
      - ingredient: lemon-juice
      - ingredient: vanilla-meringue
    instructions: >-
      Смешай крахмал, лимонный сок и ваниль, добавь к меренге и аккуратно вмешай
      лопаткой до равномерного распределения. Не перемешивай дольше необходимого.
  - id: shape
    title: Сформировать 8 гнёзд
    instructions: >-
      Застели противень пергаментом. Раздели меренгу на 8 примерно одинаковых
      порций диаметром 8–9 см. Сформируй гнёзда высотой около 4–5 см: края должны
      быть выше центра, а в середине оставь углубление для крема. Не делай стенки
      слишком тонкими, чтобы внутри сохранилась нежная середина.
  - id: bake
    title: Высушить меренгу
    instructions: >-
      Поставь противень в духовку и снизь температуру до фактических 105–110 °C.
      Суши примерно 1 час 15 минут – 1 час 30 минут. Поверхность должна стать
      сухой, а меренги — легко отходить от пергамента; цвет остаётся белым или
      слегка кремовым. Выключи духовку и оставь Павловы внутри до полного
      остывания, минимум на 2–3 часа. Не открывай дверцу часто во время сушки.
  - id: cream
    title: Приготовить крем с маскарпоне
    ingredients:
      - ingredient: mascarpone
      - ingredient: cream
      - ingredient: icing-sugar
      - ingredient: vanilla-cream
    instructions: >-
      Маскарпоне и сливки должны быть хорошо охлаждёнными. Коротко размешай
      маскарпоне с сахарной пудрой и ванилью на небольшой скорости до однородности.
      Постепенно влей холодные сливки и взбивай до плотного, гладкого крема,
      который держит форму. Остановись сразу, как только крем станет устойчивым:
      перевзбитая смесь может расслоиться.
  - id: jam
    title: Подготовить варенье
    ingredients:
      - ingredient: blueberry-jam
    instructions: >-
      Если варенье густое, размешай его ложкой. При необходимости добавь 1–2
      чайные ложки воды или немного лимонного сока, чтобы оно легко наносилось
      на крем и сохраняло приятную кислинку.
  - id: assemble
    title: Собрать перед подачей
    ingredients:
      - ingredient: mascarpone
      - ingredient: cream
      - ingredient: blueberry-jam
      - ingredient: fresh-blueberries
    instructions: >-
      Непосредственно перед подачей положи в каждое остывшее гнездо примерно
      40–50 г крема и сделай небольшое углубление. Добавь сверху около 12–15 г
      черничного варенья. Для аккуратной подачи выложи варенье ложкой, затем
      укрась свежей черникой. Для мраморного эффекта нанеси несколько капель
      варенья на крем и проведи шпажкой, создавая фиолетовые завитки.
tips:
  - >-
    Не собирай Павловы заранее: влага из крема и варенья постепенно размягчает
    меренгу. Наполняй гнёзда непосредственно перед подачей.
  - >-
    Время сушки зависит от размера гнёзд и особенностей духовки. Если поверхность
    ещё липкая или меренги не отходят от пергамента, продолжи сушку небольшими
    интервалами при той же фактической температуре.
storage:
  - >-
    Незаполненные полностью остывшие меренги храни в герметичном контейнере
    в сухом месте. Крем храни отдельно в холодильнике. Собранные Павловы лучше
    подавать сразу.
