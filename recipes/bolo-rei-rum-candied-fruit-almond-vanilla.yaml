id: bolo-rei-rum-candied-fruit-almond-vanilla
title: Боло рей с ромовыми цукатами, миндалём и ванилью
description: >-
  Португальский праздничный хлеб-венок из мягкого сдобного дрожжевого теста
  с ромовыми цукатами, миндалём и цитрусовой цедрой. Тесто замешивается
  в Ankarsrum; готовый хлеб хорошо переносит заморозку.
category: baking-and-dough
also_in: [desserts]
subcategory: buns-and-pastries
tags:
  - bolo rei
  - португальская выпечка
  - сдобное тесто
  - цукаты
  - ром
  - миндаль
  - ваниль
  - праздничный хлеб
yield:
  quantity: 1
  unit: большой венок (около 1,3 кг теста)
time:
  active_minutes: 50
  total_minutes_min: 600
  total_minutes_max: 1020
equipment:
  - Тестомес Ankarsrum с роликом и скребком
  - Весы с точностью до 0,1 г
  - Большая ёмкость для брожения
  - Противень и пергамент
  - Жаропрочная чашка для центра венка, по желанию
  - Термометр-щуп
ingredient_groups:
  - id: preferment
    title: Опара
  - id: dough
    title: Основное тесто
  - id: filling
    title: Цукаты и миндаль
  - id: finish
    title: Смазывание и глазирование
ingredients:
  - id: flour
    name: Сильная пшеничная мука
    quantity: 500
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 100
        group: preferment
      - id: dough
        name: В основное тесто
        quantity: 400
        group: dough
    note: Предпочтительна хлебная мука с содержанием белка около 12–14%.
  - id: milk
    name: Молоко
    quantity: 110
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 70
        group: preferment
      - id: dough
        name: В основное тесто
        quantity: 40
        group: dough
  - id: yeast
    name: Инстантные сухие дрожжи
    quantity: 3.5
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 0.5
        group: preferment
      - id: dough
        name: В основное тесто
        quantity: 3
        group: dough
  - id: eggs
    name: Яйца без скорлупы
    quantity: 150
    unit: г
    group: dough
    note: Примерно 3 крупных яйца; ориентируйся на массу.
  - id: sugar
    name: Сахар
    quantity: 85
    unit: г
    group: dough
  - id: honey
    name: Мёд
    quantity: 15
    unit: г
    group: dough
  - id: butter
    name: Сливочное масло 82%
    quantity: 110
    unit: г
    group: dough
    note: Мягкое и пластичное, примерно 18–20 °C, не растопленное.
  - id: salt
    name: Соль
    quantity: 7
    unit: г
    group: dough
  - id: vanilla
    name: Ванильный экстракт
    quantity: 4
    unit: г
    group: dough
  - id: orange-zest
    name: Апельсиновая цедра
    quantity: 5
    unit: г
    group: dough
  - id: lemon-zest
    name: Лимонная цедра
    quantity: 2
    unit: г
    group: dough
  - id: candied-fruit
    name: Цукаты, вымоченные в роме
    quantity: 180
    unit: г
    group: filling
    note: Масса после стекания лишнего рома и обсушивания поверхности.
  - id: almonds
    name: Миндаль
    quantity: 100
    unit: г
    parts:
      - id: dough
        name: В тесто
        quantity: 70
        group: filling
      - id: topping
        name: Для украшения
        quantity: 30
        group: filling
    note: Для теста подойдёт рубленый миндаль; для украшения — рубленый или лепестки.
  - id: egg-wash
    name: Яйцо для смазывания
    quantity: 50
    unit: г
    group: finish
    note: Взбитое целое яйцо; остаток можно использовать в другом блюде.
  - id: apricot-jam
    name: Абрикосовый джем
    quantity: 30
    unit: г
    group: finish
    note: Для тонкого глазирования; протри через сито, если в джеме есть кусочки.
steps:
  - id: prepare-fruit
    title: Подготовить цукаты и миндаль
    ingredients:
      - ingredient: candied-fruit
      - ingredient: almonds
    instructions: >-
      Слей с цукатов лишний ром, оставь на сите на 30–60 минут и тщательно
      промокни бумажным полотенцем. Крупные кусочки нарежь до 5–8 мм.
      Отвесь 180 г после обсушивания. Если миндаль сырой, слегка подсуши его
      на сухой сковороде или в духовке и полностью остуди; отмерь часть для теста
      и часть для украшения.
  - id: make-preferment
    title: Замесить опару
    ingredients:
      - ingredient: flour
        part: preferment
      - ingredient: milk
        part: preferment
      - ingredient: yeast
        part: preferment
    instructions: >-
      Смешай муку, молоко и дрожжи до однородного плотного теста. Накрой и оставь
      на 8–12 часов при фактической температуре 18–21 °C. Опара должна стать
      пористой и заметно увеличиться. Если нужно испечь в тот же день, оставь
      примерно на 60–90 минут при 25–27 °C до заметного подъёма.
  - id: prepare-dough
    title: Подготовить ингредиенты
    ingredients:
      - ingredient: eggs
      - ingredient: sugar
      - ingredient: honey
      - ingredient: butter
      - ingredient: salt
      - ingredient: vanilla
      - ingredient: orange-zest
      - ingredient: lemon-zest
    instructions: >-
      Взвесь яйца без скорлупы. Нарежь масло кубиками и доведи до пластичного
      состояния при 18–20 °C. Растри цедру с сахаром пальцами, чтобы высвободить
      ароматические масла.
  - id: develop-gluten
    title: Замесить и развить клейковину
    ingredients:
      - ingredient: flour
        part: dough
      - ingredient: milk
        part: dough
      - ingredient: yeast
        part: dough
      - ingredient: eggs
    instructions: >-
      Установи в Ankarsrum ролик и скребок. Добавь основную муку, молоко, дрожжи,
      яйца и опару, разделённую на небольшие кусочки. Начни на низкой скорости
      до исчезновения сухой муки, затем меси на умеренной скорости примерно
      8–12 минут, пока тесто не станет гладким и упругим. До внесения масла
      клейковина уже должна начать хорошо развиваться.
  - id: add-sugar
    title: Ввести сахар и мёд
    ingredients:
      - ingredient: sugar
      - ingredient: honey
      - ingredient: orange-zest
      - ingredient: lemon-zest
    instructions: >-
      Добавь сахар с цедрой в 3–4 приёма, каждый раз дожидаясь, пока тесто снова
      соберётся. Затем введи мёд. После сахара тесто временно может стать более
      рыхлым — продолжай замес, пока оно не станет однородным.
  - id: add-butter
    title: Ввести масло и ароматизаторы
    ingredients:
      - ingredient: butter
      - ingredient: salt
      - ingredient: vanilla
    instructions: >-
      Добавляй масло порциями по 10–15 г, дожидаясь полного вмешивания каждой
      порции. Введи соль и ваниль. Продолжай замес ещё примерно 8–15 минут
      или до гладкого, блестящего и эластичного теста, которое растягивается
      в тонкую плёнку. Целевая температура теста после замеса — 24–26 °C.
      Если тесто заметно нагревается, сделай паузу и дай ему остыть.
  - id: add-inclusions
    title: Вмешать цукаты и миндаль
    ingredients:
      - ingredient: candied-fruit
      - ingredient: almonds
        part: dough
    instructions: >-
      Добавь обсушенные цукаты и часть миндаля для теста. Перемешивай на минимальной
      скорости только до равномерного распределения, не затягивая замес.
  - id: first-proof
    title: Первое брожение
    instructions: >-
      Переложи тесто в слегка смазанную ёмкость, накрой и оставь при фактической
      температуре 25–27 °C примерно на 1,5–2,5 часа. Оно должно заметно вырасти,
      стать воздушным и увеличиться ориентировочно в 1,5–2 раза. Ориентируйся
      на состояние теста, а не только на время.
  - id: shape
    title: Сформовать венок
    instructions: >-
      Осторожно выпусти самые крупные пузыри и оставь тесто на 10–15 минут,
      чтобы оно расслабилось. Сформируй толстый жгут и соедини концы в кольцо
      на противне с пергаментом. Сделай центральное отверстие около 10–12 см:
      при расстойке и выпечке оно уменьшится. При желании поставь в центр
      смазанную жаропрочную чашку, чтобы отверстие сохранило форму.
  - id: final-proof
    title: Расстоять и украсить
    ingredients:
      - ingredient: egg-wash
      - ingredient: almonds
        part: topping
      - ingredient: candied-fruit
    instructions: >-
      Накрой венок и оставь при фактической температуре 26–28 °C примерно
      на 1–2 часа, пока он заметно не распушится. При лёгком нажатии пальцем
      вмятина должна медленно восстанавливаться. Взбей яйцо для смазывания,
      аккуратно покрой поверхность, затем распредели оставшийся миндаль и
      несколько красивых кусочков цукатов, слегка вдавливая их в тесто.
  - id: bake
    title: Выпечь
    instructions: >-
      Разогрей духовку до фактических 180 °C, режим верх-низ без конвекции.
      Выпекай примерно 30–40 минут. Если верх быстро темнеет, прикрой фольгой.
      Готовность лучше проверить термометром: температура в центре мякиша
      должна достигнуть 92–94 °C.
  - id: glaze-and-cool
    title: Покрыть джемом и остудить
    ingredients:
      - ingredient: apricot-jam
    instructions: >-
      Пока венок горячий, слегка подогрей джем и тонко смажь поверхность.
      Остуди на решётке не менее 2 часов перед нарезкой, чтобы мякиш стабилизировался.
tips:
  - >-
    Для более воздушного мякиша не увеличивай количество цукатов выше 180–200 г:
    влажные сладкие кусочки утяжеляют тесто. Перед добавлением обязательно обсуши их.
  - >-
    Если цукаты очень сладкие, не увеличивай сахар в тесте. Ваниль должна оставаться
    фоновым ароматом, а основными нотами будут цитрус, ром и миндаль.
storage:
  - >-
    Полностью остуди хлеб, нарежь на порции и заморозь в герметичной упаковке.
    Для лучшего качества используй в течение 1–2 месяцев. Размораживай при комнатной
    температуре; при желании прогрей кусочки при фактических 150 °C.
