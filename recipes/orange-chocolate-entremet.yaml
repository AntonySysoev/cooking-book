id: orange-chocolate-entremet
title: Апельсиново-шоколадный энтреме
description: >-
  Многослойный прямоугольный энтреме размером 35 × 25 см: шоколадно-миндальный
  дакуаз, тонкий хрустящий слой с фундуковым пралине, яркое апельсиновое конфи,
  нежное апельсиновое кремё, воздушный мусс на тёмном шоколаде 65% и зеркальная
  шоколадная глазурь. Рецепт изначально разработан без цедры: интенсивность
  апельсина достигается свежей мякотью и увариванием сока, а не ароматизаторами.
category: desserts
subcategory: cakes-and-pastries
tags:
  - энтреме
  - апельсин
  - шоколад
  - муссовый торт
  - дакуаз
  - пралине
  - зеркальная глазурь
yield:
  quantity: 20
  unit: порций
  unit_forms:
    one: порция
    few: порции
    many: порций
time:
  active_minutes: 300
  total_minutes_min: 2880
  total_minutes_max: 4320
equipment:
  - Духовка с верхним и нижним нагревом и конвекцией
  - Регулируемая прямоугольная форма 35 × 25 см, желательно высотой не менее 5 см
  - Противень и пергамент для выпечки дакуаза
  - Ankarsrum с Balloon Whisks для взбивания белков и сливок
  - Блендер Ninja для приготовления пралине
  - Погружной блендер Bosch для эмульгирования кремё, мусса и глазури
  - Весы с точностью до 0,1 г
  - Кухонный термометр
  - Ацетатная плёнка
  - Мелкое сито
  - Кондитерская лопатка и венчик
  - Решётка и поддон для глазирования
  - Морозильник с температурой около −18 °C
