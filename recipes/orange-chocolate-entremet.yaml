steps:
  - id: make-praline
    title: Приготовить фундуковое пралине
    ingredients:
      - ingredient: praline-hazelnuts
      - ingredient: praline-sugar
    instructions: >-
      Разложи фундук на противне и подсуши при фактических 160 °C около
      10–12 минут. Полностью остуди. Отдельно расплавь сахар в сухом сотейнике
      до янтарной карамели, не перемешивая после растворения кристаллов;
      при необходимости слегка покачивай сотейник. Смешай карамель с фундуком,
      выложи на пергамент и полностью остуди. Поломай карамель на небольшие
      куски и измельчи в Ninja короткими импульсами, затем продолжай до текучей
      пасты. Отвесь 100 г пралине для хрустящего слоя; остаток убери в чистую
      сухую банку. Периодически останавливай блендер и счищай массу со стенок.
      Не перегревай мотор и не добавляй воду.
  - id: bake-dacquoise
    title: Испечь шоколадно-миндальный дакуаз
    ingredients:
      - ingredient: egg-whites
      - ingredient: dacquoise-sugar
      - ingredient: almond-flour
      - ingredient: icing-sugar
      - ingredient: cocoa
      - ingredient: flour
    instructions: >-
      Разогрей духовку до фактических 165 °C в режиме конвекции. Просей вместе
      миндальную муку, сахарную пудру, какао и пшеничную муку. В Ankarsrum
      с Balloon Whisks взбей белки до мягкой пены, затем постепенно всыпь сахар
      и взбей до устойчивой блестящей меренги. Не пересушивай её. В три приёма
      аккуратно вмешай сухую смесь лопаткой. Распредели массу на пергаменте
      прямоугольником ровно 35 × 25 см, толщиной около 8–10 мм.
      Выпекай на среднем уровне примерно 15–18 минут. Готовый дакуаз пружинит
      при лёгком нажатии и не выглядит сырым в центре. Полностью остуди,
      затем обрежь до точного размера 35 × 25 см.
  - id: prepare-crunchy-layer
    title: Нанести хрустящий слой
    ingredients:
      - ingredient: crunchy-chocolate
      - ingredient: praline
      - ingredient: feuilletine
    instructions: >-
      Растопи тёмный шоколад до 40–45 °C. Добавь пралине и перемешай до
      однородности. Вмешай фейетин или измельчённые вафли и сразу распредели
      тонким равномерным слоем по одной стороне дакуаза. Удобнее наносить
      массу на сторону, которая при сборке будет обращена внутрь торта.
      Охлади до застывания. Не измельчай вафли в блендере: нужны отдельные
      хрустящие хлопья.
  - id: make-orange-confit
    title: Приготовить апельсиновое конфи
    ingredients:
      - ingredient: orange-pulp
      - ingredient: orange-juice
        part: confit
      - ingredient: orange-zest
        part: confit-zest
      - ingredient: confit-sugar
      - ingredient: nh-pectin
      - ingredient: confit-lemon
    instructions: >-
      Тщательно очисти апельсины: удали кожуру, всю белую часть, косточки
      и грубые перегородки. Взвесь нужное количество чистой мякоти и измельчи
      её Ninja до однородного пюре. Смешай сахар с NH-пектином. Соедини пюре
      с апельсиновым соком и нагрей примерно до 40 °C. Дождиком всыпь
      сахарно-пектиновую смесь, постоянно перемешивая венчиком. Доведи до
      полноценного кипения и провари 30–45 секунд. Сними с огня, вмешай
      лимонный сок. Вылей в отдельную рамку или контейнер размером примерно
      33 × 23 см, застеленный плёнкой. Распредели слоем около 5–6 мм,
      остуди и заморозь до полного затвердевания.
  - id: make-orange-cremeux
    title: Приготовить апельсиновое кремё
    ingredients:
      - ingredient: orange-juice
        part: cremeux
      - ingredient: orange-zest
        part: cremeux-zest
      - ingredient: cremeux-sugar
      - ingredient: egg-yolks
      - ingredient: whole-egg
      - ingredient: butter
      - ingredient: cremeux-gelatin
      - ingredient: cremeux-water
      - ingredient: cremeux-lemon
      - ingredient: vanilla
    quantities:
      - id: reduced-orange-juice
        quantity: 160
        unit: г
    instructions: >-
      Отвесь апельсиновый сок и увари в небольшом сотейнике на умеренном огне
      до {{amount:reduced-orange-juice}}. Сними с огня, добавь цедру и оставь
      под крышкой на 8–10 минут, затем процеди. Остуди сок до тёплого
      состояния. Замочи желатин в холодной воде. Растри цедру с сахаром
      пальцами, чтобы высвободить эфирные масла. Смешай ароматный сахар,
      уваренный сок, желтки и целое яйцо. Нагревай на слабом или среднем огне, постоянно перемешивая
      силиконовой лопаткой, до 82–84 °C; не допускай кипения и сворачивания
      яиц. Сними с огня, добавь набухший желатин и перемешай. Остуди массу
      до 40–45 °C, добавь холодное масло кубиками и эмульгируй погружным
      блендером до гладкой блестящей текстуры. Вмешай лимонный сок и ваниль.
      Распредели кремё поверх уже замороженного конфи в рамке 33 × 23 см.
      Заморозь вставку до твёрдого состояния.
  - id: prepare-glaze
    title: Приготовить зеркальную шоколадную глазурь
    ingredients:
      - ingredient: glaze-chocolate
      - ingredient: glucose
      - ingredient: glaze-sugar
      - ingredient: glaze-water
      - ingredient: condensed-milk
      - ingredient: glaze-gelatin
      - ingredient: glaze-gelatin-water
    instructions: >-
      Замочи желатин в холодной воде. В сотейнике соедини сахар, глюкозный
      сироп и воду. Доведи сироп до 103 °C. Сними с огня, добавь сгущённое
      молоко, затем набухший желатин. Вылей смесь на мелко нарубленный шоколад,
      дай постоять около минуты и эмульгируй погружным блендером, держа насадку
      полностью погружённой, чтобы не набрать пузырьков. Процеди через мелкое
      сито, накрой плёнкой в контакт и убери в холодильник минимум на 8 часов,
      лучше на ночь.
  - id: make-mousse
    title: Приготовить шоколадный мусс
    ingredients:
      - ingredient: mousse-chocolate
      - ingredient: milk
      - ingredient: mousse-cream
      - ingredient: orange-zest
        part: mousse-zest
      - ingredient: mousse-gelatin
      - ingredient: mousse-water
    instructions: >-
      Замочи желатин в холодной воде. Мелко нарубленный шоколад помести
      в высокий узкий стакан. Нагрей молоко до 75–80 °C, сними с огня,
      раствори в нём набухший желатин и вылей на шоколад в три приёма,
      каждый раз эмульгируя от центра к краям. Пробей погружным блендером
      до гладкой блестящей эмульсии. Остуди шоколадную основу до 32–35 °C.
      Отдельно взбей холодные сливки в Ankarsrum с Balloon Whisks до мягких
      пиков: след от венчика должен сохраняться, но масса ещё легко стекает.
      Вмешай треть сливок в шоколадную основу венчиком, затем аккуратно
      введи оставшиеся сливки лопаткой. Используй мусс сразу, пока он
      сохраняет текучесть.
  - id: assemble-entremet
    title: Собрать энтреме
    instructions: >-
      Выставь регулируемую форму на размер 35 × 25 см и высоту около 5 см.
      Установи её на ровную жёсткую подложку или противень, выстели внутренние
      стенки ацетатной плёнкой. Положи дакуаз хрустящим слоем вверх. Распредели
      примерно половину мусса тонким слоем по поверхности и особенно тщательно
      заполни углы. Достань замороженную апельсиновую вставку 33 × 23 см:
      конфи должно оказаться снизу, кремё сверху. Уложи вставку по центру,
      оставив равномерные поля по периметру. Заполни боковые промежутки
      оставшимся муссом, затем покрой верх тонким ровным слоем. Легко постучи
      формой по столу, чтобы удалить крупные воздушные карманы, не сдвигая
      вставку. Разровняй поверхность, накрой и заморозь при −18 °C минимум
      на 12 часов, лучше на ночь.
  - id: glaze-entremet
    title: Покрыть замороженный энтреме глазурью
    instructions: >-
      Подготовь решётку над поддоном. Осторожно разогрей глазурь короткими
      импульсами или на водяной бане, не перегревая. Перемешай и при
      необходимости кратко эмульгируй погружным блендером. Рабочая температура
      глазури — 32–34 °C. Достань энтреме из морозильника, сними рамку и
      ацетатную плёнку. Поставь на решётку и одним непрерывным движением
      залей глазурью, начиная с центра и направляя поток к краям. Не
      разравнивай глазурь лопаткой. Дай стечь 1–2 минуты, убери свисающие
      капли и перенеси торт на подложку.
  - id: thaw-and-serve
    title: Разморозить и нарезать
    instructions: >-
      Перенеси покрытый энтреме в холодильник при 4 °C на 8–10 часов.
      Для чистого среза используй длинный тонкий нож, нагретый в горячей воде
      и тщательно вытертый насухо перед каждым разрезом. Нарезай порции
      шириной примерно 3,5–4 см. Не оставляй готовый десерт надолго при
      комнатной температуре: мусс должен оставаться прохладным.
tips:
  - >-
    Рецепт специально разработан без апельсиновой цедры. Не пытайся заменить
    её большим количеством лимонного сока или ароматизатором. Вкус усиливают
    свежая мякоть в конфи и уваривание апельсинового сока в кремё. Для
    выраженного апельсинового профиля используй ароматные спелые апельсины.
  - >-
    На всю рецептуру требуется 430 г свежевыжатого апельсинового сока и 200 г
    очищенной мякоти. Трёх апельсинов может не хватить: ориентируйся на вес
    подготовленных компонентов, а не на количество плодов. Если сока мало,
    допустимо довести его качественным 100% апельсиновым соком без добавок.
  - >-
    Желатин в рецепте рассчитан на порошковый желатин 200 Bloom. Если на
    упаковке указана другая сила, количество нужно пересчитать; листовой
    желатин также подходит, но его массу определяют по Bloom, а не по числу
    листов.
  - >-
    Пектин NH используется только в апельсиновом конфи. Желатин в кремё,
    муссе и глазури не заменяй агаром или пектином в той же массе: они дают
    другую структуру и требуют отдельной переработки формулы.
  - >-
    Для хрустящего слоя фейетин можно заменить нейтральными тонкими вафлями
    без начинки. Измельчай их руками, чтобы сохранить хруст.
  - >-
    Глазури получается с запасом, необходимым для равномерного покрытия
    большого прямоугольного торта. Остаток можно заморозить и использовать
    повторно после аккуратного разогрева и эмульгирования.
storage:
  - >-
    После глазирования и размораживания храни энтреме в закрытой коробке
    в холодильнике при 4 °C и употреби в течение 48 часов.
  - >-
    Собранный энтреме до глазирования можно хранить в морозильнике при −18 °C
    до 2–3 недель, плотно защищённым от запахов и высыхания. Размораживай
    только в холодильнике.
  - >-
    Не замораживай повторно полностью размороженный энтреме. Для подачи
    нарезай только нужное количество порций, оставляя остальной торт
    охлаждённым.
