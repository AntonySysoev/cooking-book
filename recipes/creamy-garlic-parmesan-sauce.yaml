id: creamy-garlic-parmesan-sauce
title: Сливочно-чесночный соус с пармезаном
description: Универсальный густой сливочный соус с чесноком и пармезаном — для белой пиццы, пасты, запечённых овощей и курицы.
category: sauces-and-preserves
subcategory: sauces
tags:
  - сливочный соус
  - чеснок
  - пармезан
  - соус для пиццы
yield:
  quantity: 300
  unit: г соуса
time:
  active_minutes_min: 10
  active_minutes_max: 15
  total_minutes_min: 15
  total_minutes_max: 20
equipment:
  - Небольшой сотейник
  - Венчик
  - Тёрка для сыра
ingredient_groups:
  - id: sauce
    title: Соус
ingredients:
  - id: cream
    name: Сливки 20–30%
    quantity: 250
    unit: г
    group: sauce
  - id: butter
    name: Сливочное масло
    quantity: 30
    unit: г
    group: sauce
  - id: flour
    name: Пшеничная мука
    quantity: 10
    unit: г
    group: sauce
    note: Примерно 1 ровная столовая ложка.
  - id: garlic
    name: Чеснок
    quantity_min: 1
    quantity_max: 2
    unit: зубчика
    group: sauce
  - id: parmesan
    name: Пармезан или другой твёрдый выдержанный сыр
    quantity: 30
    unit: г
    group: sauce
    note: Мелко натереть.
  - id: salt
    name: Соль
    quantity: 1
    unit: г
    group: sauce
    note: Добавляй по вкусу с учётом солёности сыра.
  - id: pepper
    name: Чёрный перец
    quantity: 0.2
    unit: г
    group: sauce
  - id: nutmeg
    name: Мускатный орех
    quantity: 0.1
    unit: г
    group: sauce
steps:
  - id: garlic
    title: Ароматизировать масло
    ingredients:
      - ingredient: butter
      - ingredient: garlic
    instructions: >-
      Растопи сливочное масло в сотейнике на слабом огне. Раздави чеснок плоской
      стороной ножа, добавь в масло и прогревай 1–2 минуты, не допуская
      подрумянивания. Удали чеснок, если хочешь мягкий аромат; для более
      выраженного вкуса можно мелко нарезать его и оставить в соусе.
  - id: roux
    title: Приготовить мучную основу
    ingredients:
      - ingredient: flour
    instructions: >-
      Всыпь муку в ароматизированное масло и готовь около минуты, непрерывно
      помешивая венчиком. Не зажаривай до тёмного цвета: достаточно лёгкого
      кремового оттенка, чтобы убрать вкус сырой муки.
  - id: cream
    title: Ввести сливки
    ingredients:
      - ingredient: cream
    instructions: >-
      Постепенно влей сливки, постоянно работая венчиком, чтобы не образовались
      комочки. Доведи до очень слабого кипения и готовь на минимальном огне
      2–3 минуты, помешивая, пока соус не станет похож на жидкую сметану.
  - id: finish
    title: Добавить сыр и специи
    ingredients:
      - ingredient: parmesan
      - ingredient: salt
      - ingredient: pepper
      - ingredient: nutmeg
    instructions: >-
      Сними сотейник с огня. Вмешай мелко натёртый сыр, перец и мускатный орех;
      соль добавляй понемногу после пробы. Размешай до расплавления сыра.
      Если соус слишком густой, разбавь небольшим количеством сливок или молока.
  - id: cool
    title: Остудить или подать
    instructions: >-
      Для белой пиццы полностью остуди соус перед нанесением на тесто и используй
      тонкий слой, чтобы не переувлажнить основу. Для пасты, овощей или курицы
      можно подать соус тёплым.
tips:
  - Для пиццы наноси тонкий слой остывшего соуса: слишком большое количество может сделать центр пиццы влажным.
  - Сыр лучше натирать мелко и вмешивать после снятия с огня, чтобы он плавился равномерно.
  - Если используешь сливки 30%, соус получится более насыщенным; при повторном разогреве подогревай его на слабом огне, не доводя до бурного кипения.
storage:
  - Остуди быстро, убери в закрытую ёмкость и храни в холодильнике при температуре не выше 4 °C до 3 дней. Разогревай мягко, помешивая.
