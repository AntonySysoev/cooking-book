id: fudgy-brownies-pecan-whiskey
title: Фаджи-брауни с пеканом и виски
description: Насыщенные шоколадные брауни с ароматом подрумяненного масла, поджаренным пеканом и ванильно-дубовыми нотами Jack Daniel’s.
category: desserts
subcategory: cakes-and-pastries
also_in: [baking-and-dough]
tags:
  - брауни
  - шоколад
  - пекан
  - виски
  - двойная порция
yield:
  quantity: 2
  unit: формы 19 × 19 см
time:
  active_minutes: 30
  total_minutes_min: 60
  total_minutes_max: 90
equipment:
  - Духовка с верхним и нижним нагревом
  - Две формы 19 × 19 см
  - Пергамент
  - Кастрюля для подрумянивания масла
  - Миски и лопатка
  - Венчик или миксер
  - Кухонные весы
  - Кухонный термометр по желанию
ingredient_groups:
  - id: chocolate-base
    title: Шоколадная основа
  - id: additions
    title: Добавки
ingredients:
  - id: dark-chocolate
    name: Тёмный шоколад 60–70%
    quantity: 400
    unit: г
    group: chocolate-base
  - id: butter
    name: Сливочное масло 82%
    quantity: 220
    unit: г
    group: chocolate-base
    note: До подрумянивания
  - id: eggs
    name: Яйца без скорлупы
    quantity: 300
    unit: г
    group: chocolate-base
    note: Примерно 6 крупных яиц
  - id: white-sugar
    name: Белый сахар
    quantity: 300
    unit: г
    group: chocolate-base
  - id: brown-sugar
    name: Тёмный коричневый сахар
    quantity: 100
    unit: г
    group: chocolate-base
  - id: flour
    name: Пшеничная мука тип 650
    quantity: 130
    unit: г
    group: chocolate-base
    note: Можно заменить мукой из спельты тип 630
  - id: cocoa
    name: Несладкий какао-порошок
    quantity: 50
    unit: г
    group: chocolate-base
  - id: vanilla
    name: Ванильный экстракт
    quantity: 10
    unit: г
    group: chocolate-base
  - id: fine-salt
    name: Мелкая соль
    quantity: 2.5
    unit: г
    group: chocolate-base
  - id: pecans
    name: Пекан
    quantity: 135
    unit: г
    group: additions
    note: 120–150 г по вкусу
  - id: whiskey
    name: Jack Daniel’s Single Barrel Tennessee Whiskey
    quantity: 15
    unit: г
    group: additions
    optional: true
  - id: coffee
    name: Крепкий кофе из мокки
    quantity: 12
    unit: г
    group: additions
    optional: true
  - id: flaky-salt
    name: Хлопья морской соли для верха
    quantity: 1.2
    unit: г
    group: additions
    optional: true
steps:
  - id: prepare-oven
    title: Подготовить духовку и формы
    instructions: >-
      Застели дно и борта двух форм 19 × 19 см пергаментом. Для брауни разогрей
      духовку до фактических 175 °C по термометру, верхний и нижний нагрев,
      без конвекции. Если выпекаешь обе формы одновременно, поставь их на один
      уровень с промежутком между ними; если духовка греет неравномерно,
      лучше выпекать по очереди. Сначала можно поджарить пекан при фактических
      160 °C, а затем повысить температуру.
  - id: toast-pecans
    title: Поджарить пекан
    ingredients:
      - ingredient: pecans
    instructions: >-
      Разложи пекан одним слоем и подсушивай при фактических 160 °C около
      8–10 минут, пока не появится ореховый аромат. Полностью остуди и поруби
      кусочками примерно 5–10 мм. Не измельчай в крошку. Переключи духовку
      на фактические 175 °C для брауни.
  - id: brown-butter
    title: Подрумянить масло
    ingredients:
      - ingredient: butter
    instructions: >-
      Растопи масло в светлой кастрюле на среднем огне. Продолжай нагревать,
      часто помешивая: сначала масло вспенится, затем появятся коричневые
      молочные частицы и ореховый аромат. Сними с огня, когда частицы станут
      янтарно-коричневыми; не допускай почернения. Не процеживай осадок —
      он даёт вкус.
  - id: melt-chocolate
    title: Растопить шоколад
    ingredients:
      - ingredient: dark-chocolate
    instructions: >-
      Мелко поруби шоколад и добавь к горячему подрумяненному маслу. Оставь
      на 1–2 минуты, затем размешай до гладкости. Если шоколад растаял не
      полностью, очень осторожно прогрей на минимальном огне, постоянно
      помешивая. Дай смеси остыть до тёплого состояния.
  - id: flavour
    title: Добавить виски и кофе
    ingredients:
      - ingredient: whiskey
      - ingredient: coffee
    instructions: >-
      Если используешь кофе, приготовь крепкую мокку и отвесь только 10–15 г.
      Когда шоколадная смесь уже не горячая, вмешай виски и отмеренный кофе.
      Не добавляй алкоголь в кипящую смесь. Виски при выпечке не гарантированно
      испарится полностью.
  - id: whip-eggs
    title: Взбить яйца с сахаром
    ingredients:
      - ingredient: eggs
      - ingredient: white-sugar
      - ingredient: brown-sugar
      - ingredient: vanilla
    instructions: >-
      В большой миске взбей яйца, белый и коричневый сахар, а также ванильный
      экстракт примерно 4–6 минут, пока масса не станет заметно светлее,
      гуще и пышнее. Сахар может раствориться не полностью — это нормально.
      Яйца не должны быть ледяными.
  - id: combine
    title: Соединить шоколадную и яичную массы
    instructions: >-
      Влей шоколадную смесь в яичную в 2–3 приёма, аккуратно перемешивая
      лопаткой до однородности. Шоколадная смесь должна быть тёплой, не горячей,
      чтобы яйца не свернулись и масса не потеряла слишком много воздуха.
  - id: dry-ingredients
    title: Вмешать муку и какао
    ingredients:
      - ingredient: flour
      - ingredient: cocoa
      - ingredient: fine-salt
    instructions: >-
      Просей муку, какао и мелкую соль. Вмешай лопаткой только до исчезновения
      сухих участков. Не вымешивай долго: лишнее развитие клейковины сделает
      текстуру более хлебной, а не фаджи.
  - id: divide
    title: Добавить пекан и разложить по формам
    ingredients:
      - ingredient: pecans
    instructions: >-
      Вмешай остывший рубленый пекан, оставив немного для украшения по желанию.
      Раздели тесто поровну между двумя подготовленными формами и разровняй.
      При желании разложи сверху несколько кусочков ореха.
  - id: bake
    title: Выпекать без пересушивания
    ingredients:
      - ingredient: flaky-salt
    instructions: >-
      Выпекай при фактических 175 °C на среднем уровне, без конвекции. Начни
      проверять через 20–22 минуты; обычно требуется около 22–30 минут,
      но время зависит от формы и духовки. Края должны схватиться, а центр
      оставаться слегка подвижным. Шпажка из центра должна выходить с влажными
      крошками, но не с жидким тестом. Не жди сухой шпажки. Если используешь
      хлопья соли, посыпь поверхность сразу после выпечки или в последние
      минуты, чтобы часть хлопьев закрепилась.
  - id: cool
    title: Остудить и дать текстуре стабилизироваться
    instructions: >-
      Дай брауни постоять в форме 30–40 минут, затем осторожно перенеси на
      решётку и полностью остуди. Для наиболее плотной текстуры и чистой
      нарезки заверни остывшие брауни и оставь на несколько часов, лучше на ночь.
tips:
  - >-
    Готовые брауни продолжают формировать текстуру при охлаждении. Не оценивай
    готовность по мягкости горячего центра и не допекай до состояния бисквита.
  - >-
    Признаки правильной готовности: края держат форму, центр слегка дрожит,
    но не выглядит жидким, а шпажка выходит с влажными крошками. Полностью
    неподвижный центр и сухая шпажка часто означают, что брауни перепеклись.
  - >-
    Пекан не нужно пропитывать: поджаривание усиливает ореховый аромат и
    помогает сохранить текстуру. Виски 15 г даёт умеренный аромат; в следующей
    партии можно увеличить до 20 г по вкусу. Кофе необязателен и должен
    подчёркивать шоколад, а не доминировать.
  - >-
    При использовании муки из спельты тип 630 перемешивай особенно бережно.
storage:
  - Храни в закрытом контейнере при комнатной температуре 2–3 дня или в холодильнике до 5 дней. Перед подачей дай охлаждённому кусочку немного согреться.
