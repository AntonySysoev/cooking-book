id: tiramisu
title: Тирамису
description: >-
  Тирамису с выразительным кофе, шелковистым кремом из маскарпоне,
  тонкой алкогольной нотой и несладким какао.
category: desserts
subcategory: cakes-and-pastries
tags:
  - итальянская кухня
  - маскарпоне
  - кофе
  - десерт без выпечки
  - тирамису
yield:
  quantity_min: 5
  quantity_max: 7
  unit: порций
time:
  active_minutes_min: 30
  active_minutes_max: 40
  total_minutes_min: 750
  total_minutes_max: 1480
equipment:
  - Форма примерно 18 × 18 см или небольшая форма около 20 × 20 см
  - Миксер
  - Две чистые миски
  - Лопатка
  - Венчик
  - Мелкое сито
ingredient_groups:
  - id: cream
    title: Крем
  - id: coffee
    title: Кофейная пропитка
  - id: assembly
    title: Сборка и подача
ingredients:
  - id: mascarpone
    name: Маскарпоне
    quantity: 500
    unit: г
    group: cream
  - id: eggs
    name: Яйца категории M–L
    quantity: 2
    unit: шт.
    parts_mode: components
    note: Используй 2 целых яйца и 1 дополнительный желток. Яйца используются сырыми; для снижения риска выбирай пастеризованные.
    parts:
      - id: yolks
        name: Желтки
        quantity: 2
        group: cream
      - id: whites
        name: Белки
        quantity: 2
        group: cream
  - id: extra_yolk
    name: Дополнительный желток
    quantity: 1
    unit: шт.
    group: cream
  - id: sugar
    name: Белый сахар
    quantity: 50
    unit: г
    parts:
      - id: yolks
        name: Для желтков
        quantity: 33
        group: cream
      - id: whites
        name: Для белков
        quantity: 17
        group: cream
  - id: salt
    name: Мелкая соль
    quantity: 0.4
    unit: г
    group: cream
  - id: coffee
    name: Крепкий эспрессо или концентрированный кофе
    quantity: 210
    unit: г
    group: coffee
    note: Полностью остудить.
  - id: whiskey
    name: Jack Daniel’s, 45%
    quantity: 8
    unit: г
    group: coffee
    optional: true
    note: Можно не добавлять или заменить пряным ромом.
  - id: muscovado
    name: Мусковадо
    quantity_min: 2.5
    quantity_max: 4
    unit: г
    group: coffee
    optional: true
    note: По желанию, для мягкой карамельной ноты в кофе.
  - id: savoiardi
    name: Печенье савоярди
    quantity_min: 170
    quantity_max: 210
    unit: г
    group: assembly
  - id: cocoa
    name: Какао-порошок без сахара
    quantity: 8
    unit: г
    group: assembly
steps:
  - id: coffee
    title: Приготовить кофейную пропитку
    ingredients:
      - ingredient: coffee
      - ingredient: whiskey
      - ingredient: muscovado
    instructions: >-
      Приготовь крепкий кофе и полностью остуди. При желании размешай в нём
      мусковадо и виски. Перелей в широкую неглубокую ёмкость.
  - id: yolks
    title: Взбить желтки
    ingredients:
      - ingredient: eggs
        part: yolks
      - ingredient: extra_yolk
      - ingredient: sugar
        part: yolks
    instructions: >-
      Взбей 3 желтка с 33 г сахара миксером до светлой, густой и пышной массы,
      примерно 3–5 минут.
  - id: mascarpone
    title: Соединить с маскарпоне
    ingredients:
      - ingredient: mascarpone
      - ingredient: salt
    instructions: >-
      Разомни холодный маскарпоне лопаткой до однородности. Вмешай взбитые
      желтки в 2–3 приёма, аккуратно и недолго, чтобы крем не стал жидким.
  - id: whites
    title: Взбить белки
    ingredients:
      - ingredient: eggs
        part: whites
      - ingredient: sugar
        part: whites
    instructions: >-
      В отдельной чистой обезжиренной миске взбей 2 белка до пены. Постепенно
      всыпь 17 г сахара и продолжай взбивать до устойчивых, блестящих пиков.
  - id: combine
    title: Завершить крем
    instructions: >-
      Вмешай белковую пену в маскарпоне в 2–3 приёма лопаткой, движениями
      снизу вверх, стараясь сохранить объём.
  - id: assemble
    title: Собрать тирамису
    ingredients:
      - ingredient: savoiardi
    instructions: >-
      Быстро окунай каждую савоярди в кофе — буквально на мгновение с каждой
      стороны, чтобы печенье не размокло насквозь. Выложи слой печенья,
      распределяй половину крема, затем повтори слои. Разровняй поверхность.
  - id: chill
    title: Охладить
    instructions: >-
      Накрой форму и убери в холодильник при температуре не выше 4 °C минимум
      на 12 часов, лучше на 18–24 часа, чтобы вкус и структура стабилизировались.
  - id: serve
    title: Подать
    ingredients:
      - ingredient: cocoa
    instructions: >-
      Непосредственно перед подачей просей сверху какао. Нарезай чистым ножом,
      протирая его между порциями.
tips:
  - Не передерживай савоярди в кофе: они должны впитать аромат, но сохранять форму.
  - Если кофе уже сладкий, не добавляй мусковадо.
  - В креме используются сырые яйца, которые могут содержать сальмонеллу. Для снижения риска используй пастеризованные яйца; особенно важно избегать сырых яиц для беременных, маленьких детей, пожилых людей и людей с ослабленным иммунитетом. Держи ингредиенты и готовый десерт в холодильнике при температуре не выше 4 °C, работай чистыми руками и инвентарём.
storage:
  - Храни накрытым в холодильнике при температуре не выше 4 °C и съешь в течение 1–2 дней.
