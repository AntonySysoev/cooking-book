id: vanilla-sponge-mascarpone-berries
title: Ванильный бисквитный торт с маскарпоне, ягодами и ромовым сиропом
description: Воздушный ванильный бисквит, нежный крем из маскарпоне и сливок, свежие ягоды и ароматная ромовая пропитка.
category: cakes-and-pastries
also_in: [baking-and-dough]
tags:
  - бисквитный торт
  - маскарпоне
  - свежие ягоды
  - ваниль
  - ромовый сироп
yield:
  quantity_min: 6
  quantity_max: 8
  unit: порций
time:
  active_minutes_min: 75
  active_minutes_max: 90
  total_minutes_min: 390
  total_minutes_max: 510
equipment:
  - Круглая форма диаметром 20 см
  - Миксер Ankarsrum
  - Сито для муки
  - Силиконовая лопатка
  - Решётка для охлаждения
  - Длинный нож-пила для бисквита
  - Кондитерская кисть или ложка для сиропа
  - Кондитерский мешок, по желанию
ingredient_groups:
  - id: sponge
    title: Ванильный бисквит
  - id: syrup
    title: Ромовый сироп
  - id: cream
    title: Крем и начинка
