  - id: eggs
    name: Яйца категории C1
    quantity: 4
    unit: шт.
    group: sponge
    note: Комнатной температуры.
  - id: sugar-sponge
    name: Сахар
    quantity: 120
    unit: г
    group: sponge
  - id: flour
    name: Пшеничная мука высшего сорта
    quantity: 120
    unit: г
    group: sponge
  - id: vanilla
    name: Ванильный экстракт
    quantity: 5
    unit: г
    group: sponge
  - id: salt
    name: Соль
    quantity: 0.5
    unit: г
    group: sponge
  - id: butter
    name: Сливочное масло
    quantity: 20
    unit: г
    group: sponge
    optional: true
    note: Добавляет сочности; можно не использовать.
  - id: water
    name: Вода
    quantity: 60
    unit: г
    group: syrup
  - id: sugar-syrup
    name: Сахар
    quantity: 30
    unit: г
    group: syrup
  - id: rum
    name: Тёмный или золотой ром
    quantity_min: 20
    quantity_max: 30
    unit: г
    group: syrup
  - id: mascarpone
    name: Маскарпоне
    quantity: 250
    unit: г
    group: cream
    note: Хорошо охлаждённый.
  - id: cream
    name: Сливки 30%
    quantity: 300
    unit: г
    group: cream
    note: Холодные. Взбивать вместе с маскарпоне; сливки 30% могут держать форму чуть слабее, чем 33–35%.
  - id: powdered-sugar
    name: Сахарная пудра
    quantity_min: 60
    quantity_max: 70
    unit: г
    group: cream
  - id: berries
    name: Свежие ягоды
    quantity: 350
    unit: г
    group: cream
    note: Например, клубника, малина и голубика; вымыть и тщательно обсушить.
steps:
  - id: prepare
    title: Подготовить форму и духовку
    instructions: >-
      Заранее достань яйца из холодильника, чтобы они согрелись до комнатной
      температуры. Дно формы диаметром 20 см застели пергаментом; боковые стенки
      оставь чистыми и сухими, не смазывай. Разогрей духовку до фактической
      температуры 170 °C, режим верх-низ без конвекции. Просей муку дважды.
  - id: whip-eggs
    title: Взбить яйца с сахаром
    ingredients:
      - ingredient: eggs
      - ingredient: sugar-sponge
      - ingredient: vanilla
      - ingredient: salt
    instructions: >-
      В сухой глубокой чаше взбей яйца с сахаром, ванилью и солью на высокой
      скорости примерно 8–10 минут, до очень светлой пышной массы. След от
      венчика должен оставаться на поверхности 3–4 секунды. Если используешь
      Ankarsrum, следи за массой и останови взбивание, когда она достигнет
      нужной стадии.
  - id: fold-flour
    title: Вмешать муку
    ingredients:
      - ingredient: flour
    instructions: >-
      Введи муку в 2–3 приёма, каждый раз аккуратно складывая массу широкой
      лопаткой снизу вверх от центра к краю. Не перемешивай миксером и не
      мешай дольше необходимого, чтобы сохранить воздух.
  - id: add-butter
    title: Добавить масло, по желанию
    ingredients:
      - ingredient: butter
    instructions: >-
      Если используешь масло, растопи его и остуди до тёплого состояния.
      Смешай с двумя ложками бисквитного теста, затем аккуратно вмешай эту
      смесь в основную массу лопаткой.
  - id: bake
    title: Выпечь бисквит
    instructions: >-
      Перелей тесто в форму, осторожно разровняй и сразу поставь в духовку.
      Выпекай 25–30 минут, не открывая дверцу первые 20 минут. Бисквит готов,
      когда шпажка из центра выходит сухой, а температура в центре составляет
      примерно 95–97 °C. Остуди в форме 10 минут, затем вынь и полностью остуди
      на решётке.
  - id: rest
    title: Выдержать бисквит
    instructions: >-
      Полностью остывший бисквит заверни в плёнку и убери в холодильник минимум
      на 4 часа. Так его будет легче разрезать на три ровных коржа.
  - id: syrup
    title: Приготовить ромовый сироп
    ingredients:
      - ingredient: water
      - ingredient: sugar-syrup
      - ingredient: rum
    instructions: >-
      В маленьком сотейнике соедини воду и сахар, доведи до кипения и размешай
      до полного растворения кристаллов. Полностью остуди сироп и только затем
      добавь ром.
  - id: cream
    title: Взбить крем
    ingredients:
      - ingredient: mascarpone
      - ingredient: cream
      - ingredient: powdered-sugar
    instructions: >-
      Используй хорошо охлаждённые маскарпоне и сливки. Положи их вместе с
      просеянной сахарной пудрой в холодную чашу. Начни взбивать на низкой
      скорости, чтобы соединить ингредиенты, затем увеличь до средней и
      взбивай до плотного крема, который держит форму. Останови миксер сразу,
      как крем станет устойчивым: перевзбитая смесь может стать зернистой.
      Сливки жирностью 30% взбивай особенно внимательно.
  - id: prepare-berries
    title: Подготовить ягоды
    ingredients:
      - ingredient: berries
    instructions: >-
      Вымой ягоды и тщательно обсуши. Клубнику нарежь тонкими ломтиками;
      мелкую малину и голубику можно оставить целыми для начинки и декора.
  - id: assemble
    title: Собрать торт
    instructions: >-
      Разрежь охлаждённый бисквит длинным ножом-пилой на три одинаковых коржа.
      Положи нижний корж на блюдо и равномерно нанеси треть сиропа кистью или
      ложкой. Распредели слой крема и выложи часть ягод по всей поверхности.
      Накрой вторым коржом и повтори пропитку, крем и ягоды. Уложи верхний
      корж, пропитай оставшимся сиропом. Оставшимся кремом покрой верх и бока,
      а сверху укрась оставшимися ягодами.
  - id: chill
    title: Стабилизировать
    instructions: >-
      Убери торт в холодильник на 4–6 часов перед подачей. Храни его охлаждённым,
      поскольку крем содержит маскарпоне и сливки.
tips:
  - Если используешь сочные ягоды, обязательно хорошо обсуши их: лишняя влага может размягчить крем и коржи.
  - Для аккуратной нарезки охлади торт и протирай длинный нож после каждого разреза.
  - Сливки 30% подходят, но крем может быть немного мягче. Охлади чашу и венчик заранее и не перевзбивай смесь.
storage:
  - Храни накрытым в холодильнике при температуре не выше 4 °C и съешь в течение 2 дней.
