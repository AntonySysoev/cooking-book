id: mint-chocolate-macarons
title: Французские макароны с мятой и тёмным шоколадом
description: >-
  Макароны с натуральным ароматом свежей мяты и насыщенным тёмным шоколадом.
  Мята настаивается в сливках, затем полностью фильтруется, а шоколадный ганаш
  получается нежным, но достаточно плотным для аккуратной отсадки.
category: desserts
subcategory: cakes-and-pastries
tags:
  - макароны
  - macarons
  - мята
  - шоколад
  - ганаш
  - итальянская меренга
yield:
  quantity: 32
  unit: макарона
time:
  active_minutes: 100
  total_minutes_min: 360
  total_minutes_max: 480
equipment:
  - Весы с точностью до 0,1 г
  - Ankarsrum с Balloon Whisks для итальянской меренги
  - Блендер Ninja PowerBowl или большая чаша с короткими импульсами
  - Кондитерский мешок с круглой насадкой 8–10 мм
  - Кухонный термометр для сиропа
  - Противни и пергамент
  - Мелкое сито для сухих ингредиентов
  - Нейлоновая мелкая сетка для фильтрации ароматизированных сливок при необходимости
ingredient_groups:
  - id: shells
    title: Миндальные оболочки
  - id: mint-ganache
    title: Мятный шоколадный ганаш
ingredients:
  - id: almond-flour
    name: Миндальная мука
    quantity: 150
    unit: г
    group: shells
    note: Мелкого помола, без крупных частиц.
  - id: icing-sugar
    name: Сахарная пудра
    quantity: 150
    unit: г
    group: shells
  - id: egg-whites
    name: Яичные белки
    quantity: 110
    unit: г
    group: shells
    note: Без следов желтка; разделить на две порции по 55 г.
    parts:
      - id: almond-mixture
        name: Для миндальной пасты
        quantity: 55
        group: shells
      - id: meringue
        name: Для меренги
        quantity: 55
        group: shells
  - id: caster-sugar
    name: Сахар
    quantity: 150
    unit: г
    group: shells
  - id: syrup-water
    name: Вода для сиропа
    quantity: 38
    unit: г
    group: shells
  - id: mint
    name: Свежая мята
    quantity: 20
    unit: г
    group: mint-ganache
    note: Листья и нежные верхушки, без грубых стеблей.
  - id: cream
    name: Сливки 30%
    quantity: 110
    unit: г
    group: mint-ganache
  - id: chocolate
    name: Тёмный шоколад 60–70%
    quantity: 140
    unit: г
    group: mint-ganache
  - id: butter
    name: Сливочное масло 82%
    quantity: 10
    unit: г
    group: mint-ganache
  - id: salt
    name: Мелкая соль
    quantity: 0.4
    unit: г
    group: mint-ganache
steps:
  - id: prepare
    title: Подготовить ингредиенты и противни
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
      - ingredient: egg-whites
        part: almond-mixture
      - ingredient: egg-whites
        part: meringue
      - ingredient: caster-sugar
      - ingredient: syrup-water
    instructions: >-
      Точно отвесь ингредиенты. Обезжирь чашу и Balloon Whisks. Подготовь
      противень с пергаментом и шаблон кругов диаметром 3,5–4 см.
  - id: sift
    title: Подготовить сухую смесь
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
    instructions: >-
      Просей миндальную муку с сахарной пудрой. Если остаются крупные частицы,
      измельчи их короткими импульсами и просей повторно; не перемалывай долго,
      чтобы миндаль не начал выделять масло.
  - id: almond-paste
    title: Смешать миндальную пасту
    ingredients:
      - ingredient: almond-flour
      - ingredient: icing-sugar
      - ingredient: egg-whites
        part: almond-mixture
    instructions: >-
      Добавь 55 г белков к сухой смеси и перемешай лопаткой до густой однородной
      пасты. Накрой, чтобы она не подсыхала.
  - id: meringue
    title: Приготовить итальянскую меренгу
    ingredients:
      - ingredient: egg-whites
        part: meringue
      - ingredient: caster-sugar
      - ingredient: syrup-water
    instructions: >-
      Нагрей сахар с водой в сотейнике до 118 °C по термометру, не перемешивая
      после растворения сахара. Когда сироп достигнет 108–110 °C, начни взбивать
      оставшиеся 55 г белков в Ankarsrum с Balloon Whisks до мягких пиков.
      Влей сироп тонкой струёй между венчиком и стенкой чаши и взбивай до плотной
      блестящей меренги, остывшей примерно до 40–45 °C.
  - id: macaronage
    title: Выполнить макаронаж
    ingredients:
      - ingredient: egg-whites
        part: almond-mixture
      - ingredient: egg-whites
        part: meringue
      - ingredient: almond-flour
      - ingredient: icing-sugar
    instructions: >-
      Вмешай треть меренги в миндальную пасту, затем в 2–3 приёма введи остаток.
      Складывай массу лопаткой снизу вверх. Остановись, когда тесто блестит,
      стекает широкой непрерывной лентой, а след исчезает за 10–20 секунд.
  - id: pipe
    title: Отсадить и подсушить оболочки
    instructions: >-
      Отсади круги 3,5–4 см вертикально держа мешок с круглой насадкой 8–10 мм.
      Постучи противнем по столу, проколи видимые пузырьки и оставь на 20–45 минут,
      пока поверхность не станет сухой и не будет липнуть к пальцу.
  - id: bake
    title: Выпечь оболочки
    instructions: >-
      Выпекай при фактической температуре 145 °C, верхний и нижний нагрев без
      конвекции, на среднем уровне 15–18 минут, по одному противню. Начни проверять
      с 14-й минуты. Полностью остуди перед снятием с пергамента. Готовая оболочка
      не должна скользить верхом отдельно от основания при лёгком касании.
  - id: infuse-mint
    title: Настоять сливки на мяте
    ingredients:
      - ingredient: mint
      - ingredient: cream
    instructions: >-
      Слегка разомни листья мяты руками, не измельчая в кашу. Нагрей сливки
      примерно до 75–80 °C, сними с огня, добавь мяту, накрой и настаивай
      20–30 минут. Попробуй аромат через 20 минут: мята должна быть свежей
      и чистой, без травянистой горечи. Процеди через мелкую нейлоновую сетку,
      аккуратно отожми листья и отвесь получившиеся сливки. Доведи массу сливок
      обратно до 100 г, добавив немного свежих сливок, если часть осталась в листьях.
  - id: mint-ganache
    title: Приготовить шоколадный ганаш
    ingredients:
      - ingredient: cream
      - ingredient: chocolate
      - ingredient: butter
      - ingredient: salt
    instructions: >-
      Мелко наруби шоколад. Нагрей процеженные мятные сливки почти до кипения
      и вылей на шоколад. Оставь на минуту, затем перемешай от центра к краям
      до гладкой блестящей эмульсии. Добавь масло и соль и перемешай. Если есть
      погружной блендер, пробей коротко, удерживая насадку под поверхностью,
      чтобы не вводить воздух. Накрой плёнкой в контакт и охлади 6–12 часов.
  - id: fill
    title: Наполнить макароны
    ingredients:
      - ingredient: cream
      - ingredient: chocolate
      - ingredient: butter
      - ingredient: salt
    instructions: >-
      Перемешай охлаждённый ганаш лопаткой до пластичности. Отсади по 6–7 г
      начинки на половину оболочек и накрой оставшимися. Созревай 12–24 часа
      в холодильнике в закрытом контейнере, затем подавай при прохладной
      комнатной температуре.
tips:
  - >-
    Не измельчай мяту блендером: это может сделать аромат травянистым и придать
    сливкам зелёный оттенок. Настаивание и фильтрация дают более чистый вкус.
  - >-
    Если после процеживания осталось меньше 100 г сливок, долей свежих сливок
    до нужной массы; не компенсируй потери водой.
  - >-
    Для более яркой мяты лучше увеличить время настаивания на 5–10 минут,
    а не кипятить листья.
storage:
  - >-
    Храни собранные макароны в холодильнике в герметичном контейнере до 3 дней.
    Перед подачей дай постоять 15–20 минут при комнатной температуре.
  - >-
    Пустые оболочки можно заморозить в герметичной упаковке.
