id: classic-croissants
title: Классические французские круассаны
description: >-
  Слоёные дрожжевые круассаны с тонкими хрустящими оболочками и выраженной
  медовой структурой мякиша. Тесто проходит ночную холодную ферментацию,
  затем ламинируется сливочным маслом и расстаивается перед выпечкой.
category: baking-and-dough
subcategory: laminated-dough
tags:
  - круассаны
  - французская выпечка
  - слоёное дрожжевое тесто
  - ламинирование
  - Ankarsrum
yield:
  quantity: 15
  unit: круассанов
  unit_forms:
    one: круассан
    few: круассана
    many: круассанов
time:
  active_minutes: 110
  total_minutes_min: 720
  total_minutes_max: 1020
equipment:
  - Тестомес Ankarsrum с роликом и скребком
  - Весы с точностью до 1 г
  - Контейнер с крышкой для холодной ферментации
  - Пергамент для масляного пласта
  - Скалка
  - Линейка или рулетка
  - Острый нож или роликовый нож для теста
  - Два противня
  - Кисточка для смазывания
ingredient_groups:
  - id: dough
    title: Дрожжевое тесто
  - id: lamination
    title: Масляный пласт
  - id: wash
    title: Яичная смазка
ingredients:
  - id: flour
    name: Сильная пшеничная мука
    quantity: 400
    unit: г
    group: dough
    note: >-
      Желательно около 11,5–12,5% белка. Слишком слабая мука хуже удерживает
      слои, а чрезмерно сильная может сделать тесто упругим и затруднить раскатку.
  - id: milk
    name: Молоко
    quantity: 210
    unit: г
    parts:
      - id: dough
        name: В тесто
        quantity: 200
        group: dough
      - id: wash
        name: В яичную смазку
        quantity: 10
        group: wash
    note: Молоко 3–3,5%; для теста используй холодное.
  - id: water
    name: Вода
    quantity: 40
    unit: г
    group: dough
    note: Холодная.
  - id: yeast
    name: Инстантные сухие дрожжи
    quantity: 4
    unit: г
    group: dough
    note: Для свежих прессованных дрожжей используй около 12 г.
  - id: sugar
    name: Сахар
    quantity: 40
    unit: г
    group: dough
  - id: salt
    name: Соль
    quantity: 8
    unit: г
    group: dough
  - id: butter
    name: Сливочное масло 82%
    quantity: 240
    unit: г
    parts:
      - id: dough
        name: В тесто
        quantity: 40
        group: dough
      - id: lamination
        name: Для ламинирования
        quantity: 200
        group: lamination
    note: >-
      Используй пластичное масло без добавок. Для ламинирования масло должно
      раскатываться, не ломаясь и не становясь жирной пастой.
  - id: egg
    name: Яйцо без скорлупы
    quantity: 45
    unit: г
    group: wash
    note: Взбей яйцо и отвесь нужную массу.
steps:
  - id: mix-dough
    title: Замесить тесто
    ingredients:
      - ingredient: flour
      - ingredient: milk
        part: dough
      - ingredient: water
      - ingredient: yeast
      - ingredient: sugar
      - ingredient: salt
    quantities:
      - id: dough-milk
        quantity: 200
        unit: г
      - id: dough-water
        quantity: 40
        unit: г
    instructions: >-
      Охлади муку и жидкость. Раствори дрожжи в {{amount:dough-milk}} молока и
      {{amount:dough-water}} воды. Установи в Ankarsrum ролик и скребок. Добавь муку,
      сахар и соль, влей жидкость и замешивай на умеренно низкой скорости
      до однородного теста, затем ещё несколько минут до умеренного развития
      клейковины. Тесто должно стать гладким и связным, но не обязано проходить
      очень тонкую оконную плёнку: чрезмерно развитая клейковина затруднит
      раскатку и заставит пласт стягиваться. Следи, чтобы тесто не нагревалось.
  - id: add-dough-butter
    title: Ввести масло в тесто
    ingredients:
      - ingredient: butter
        part: dough
    quantities:
      - id: dough-butter
        quantity: 40
        unit: г
    instructions: >-
      Добавь {{amount:dough-butter}} мягкого, но не растопленного масла в 2–3 приёма.
      Каждый раз дождись, пока предыдущая порция разойдётся в тесте. Замешивай
      только до однородности. Целевая температура теста после замеса —
      22–24 °C; если оно теплее, ненадолго убери чашу в холодильник.
  - id: chill-dough
    title: Подготовить тесто к холодной ферментации
    instructions: >-
      Сформируй из теста прямоугольный пласт толщиной около 2 см, плотно заверни
      или положи в закрытый контейнер. Оставь на 20–30 минут при комнатной
      температуре, затем убери в холодильник при 4–5 °C на 8–12 часов.
      Тесто должно охладиться и немного увеличиться, но не обязано удваиваться.
  - id: prepare-butter
    title: Подготовить масляный пласт
    ingredients:
      - ingredient: butter
        part: lamination
    quantities:
      - id: lamination-butter
        quantity: 200
        unit: г
    instructions: >-
      Помести {{amount:lamination-butter}} масла для ламинирования между двумя листами
      пергамента и раскатай в ровный квадрат примерно 16 × 16 см и толщиной
      8–9 мм. Убери в холодильник. Перед ламинированием доведи масло примерно
      до 14–16 °C: оно должно легко сгибаться и раскатываться, не трескаясь,
      но при этом оставаться прохладным и не блестеть от растапливания.
  - id: lock-in-butter
    title: Заключить масло в тесто
    ingredients:
      - ingredient: butter
        part: lamination
    instructions: >-
      Достань охлаждённое тесто и раскатай в квадрат примерно 22 × 22 см.
      Положи масляный пласт по центру по диагонали или прямо, затем заверни
      края теста к центру так, чтобы масло оказалось полностью закрыто.
      Тщательно защипни стыки, не оставляя открытых участков. Если тесто
      сопротивляется или масло становится мягким, охлади заготовку 15–20 минут.
  - id: turn-one
    title: Первая раскатка и складывание
    instructions: >-
      Положи заготовку швом вниз. Раскатывай от центра к краям в длинный
      прямоугольник примерно 55–60 × 18–20 см, стараясь сохранять ровную
      толщину и прямые углы. Стряхни лишнюю муку. Сложи пласт втрое письмом:
      сначала одну короткую треть к центру, затем накрой её оставшейся третью.
      Получится один простой тур из трёх слоёв. Заверни и охлади 30–40 минут.
  - id: turn-two
    title: Вторая раскатка и складывание
    instructions: >-
      Поверни охлаждённую заготовку на 90° относительно предыдущей раскатки,
      чтобы открытый край оказался сбоку. Снова раскатай в прямоугольник
      около 55–60 × 18–20 см и сложи втрое письмом. Работай без сильного
      давления: не выдавливай масло к краям. Заверни и охлади ещё 30–40 минут.
  - id: turn-three
    title: Третья раскатка и складывание
    instructions: >-
      Повтори раскатку и складывание втрое ещё один раз, каждый раз сохраняя
      направление раскатки поперёк предыдущего тура. После третьего простого
      тура заверни тесто и оставь в холодильнике на 45–60 минут. Если при
      раскатке масло начинает размягчаться или тесто становится липким,
      прервись и охлади его, не добавляя муку внутрь слоёв.
  - id: cut-shape
    title: Раскатать пласт и сформовать круассаны
    instructions: >-
      На слегка подпылённой поверхности раскатай тесто в прямоугольник
      примерно 68 × 27 см и толщиной 3,5–4 мм. При необходимости дай тесту
      коротко полежать в холодильнике, если оно стягивается. Подровняй края
      острым ножом. Нарежь длинные треугольники с основанием около 8,5–9 см
      и высотой 25–27 см; чередуй направление треугольников, чтобы экономно
      использовать пласт. Продолжай, пока не получишь {{yield}}.
      У основания каждого треугольника сделай небольшой надрез около 1 см,
      слегка растяни основание в стороны и свободно сверни к вершине,
      не сдавливая слои. Кончик должен оказаться снизу. Слегка изогни края
      в форме полумесяца. Переложи на противни швом вниз, оставляя достаточно
      места для увеличения.
  - id: proof
    title: Провести финальную расстойку
    instructions: >-
      Накрой круассаны так, чтобы поверхность не подсыхала. Расстаивай при
      фактической температуре 24–26 °C и умеренно высокой влажности примерно
      2,5–3,5 часа. Не допускай температуры выше 27 °C: масло начнёт таять
      и вытекать. Готовые круассаны заметно увеличатся, станут лёгкими,
      дрожащими при движении противня; между слоями будут видны тонкие
      прослойки. Если изделия ещё плотные и почти не дрожат, дай им больше
      времени.
  - id: egg-wash
    title: Смазать яйцом
    ingredients:
      - ingredient: egg
      - ingredient: milk
        part: wash
    quantities:
      - id: wash-egg
        quantity: 45
        unit: г
      - id: wash-milk
        quantity: 10
        unit: г
    instructions: >-
      Аккуратно смешай {{amount:wash-egg}} яйца и {{amount:wash-milk}} молока, не создавая
      пены. Тонко смажь верх круассанов непосредственно перед выпечкой.
      Старайся не заливать срезы и открытые слои по бокам: запёкшееся яйцо
      может склеить их и помешать раскрытию слоёв.
  - id: bake
    title: Выпечь до насыщенного золотистого цвета
    instructions: >-
      Заранее хорошо разогрей духовку в режиме верхнего и нижнего нагрева
      без конвекции до фактических 195 °C. Выпекай на среднем или чуть ниже
      среднего уровне примерно 18–22 минуты, до равномерного глубокого
      золотисто-коричневого цвета. Не открывай духовку в начале выпечки.
      Если выпекаешь на двух уровнях, лучше готовить противни по очереди,
      сохраняя вторую партию в холодильнике до момента выпечки.
  - id: cool
    title: Остудить
    instructions: >-
      Переложи круассаны на решётку и дай им остыть не менее 25–30 минут.
      Внутри должны сформироваться сухие, отчётливые слои, а не влажный
      мякиш. Не разрезай их сразу после духовки.
tips:
  - >-
    Успех ламинирования зависит от одинаковой пластичности теста и масла.
    Если масло ломается на куски, оно слишком холодное; если выдавливается
    из-под теста или начинает блестеть, оно слишком тёплое. В обоих случаях
    остановись и скорректируй температуру охлаждением или коротким согреванием.
  - >-
    Между турами держи тесто закрытым в холодильнике. Не используй много
    подпыляющей муки и всегда стряхивай её перед складыванием.
  - >-
    Не сокращай финальную расстойку ради более чёткой формы: недорасстоянные
    круассаны часто раскрываются неравномерно, рвутся по шву и имеют плотный
    хлебный мякиш.
  - >-
    При увеличении множителя готовь несколько отдельных пластов, сохраняя
    размеры раскатки и формовки для одной партии. Не делай один чрезмерно
    большой пласт: с ним трудно работать, а масло прогревается быстрее.
storage:
  - >-
    Лучше всего круассаны в день выпечки. На следующий день верни хрусткость,
    прогрев их 4–6 минут при фактических 160–170 °C.
  - >-
    Для длительного хранения полностью остуди изделия и заморозь в герметичной
    упаковке. Разогревай прямо из морозильника при фактических 160–170 °C
    до прогрева и восстановления хрустящей корочки.
