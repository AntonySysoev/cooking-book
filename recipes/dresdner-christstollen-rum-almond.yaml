steps:
  - id: soak-raisins
    title: Замочить изюм
    ingredients:
      - ingredient: raisins
      - ingredient: rum
    instructions: >-
      Чистый изюм не промывай. Если промыл, тщательно обсуши. Смешай изюм с ромом,
      накрой и оставь на 8–12 часов, перемешав один-два раза. Перед замесом слей
      свободную жидкость, если она осталась; не добавляй её в тесто.
  - id: prepare-fruit
    title: Подготовить цукаты и миндаль
    ingredients:
      - ingredient: orangeat
      - ingredient: citronat
      - ingredient: almonds
    instructions: >-
      Нарежь цукаты кубиками 4–6 мм. Миндаль крупно поруби; при желании подсуши
      при 150 °C 8–10 минут и полностью остуди.
  - id: brown-butter
    title: Приготовить коричневое масло
    ingredients:
      - ingredient: butter
        part: dough
    quantities:
      - id: brown-butter-input
        quantity: 250
        unit: г
      - id: brown-butter-output
        quantity: 210
        unit: г
    instructions: >-
      Подрумянь всё масло, предназначенное для теста ({{amount:brown-butter-input}}). Растопи его в небольшой светлой кастрюле на среднем огне.
      Продолжай нагревать, помешивая и соскребая со дна молочные частицы, пока
      они не станут орехово-коричневыми, а аромат — выраженно ореховым.
      Сразу перелей в миску, захватив все поджаренные частицы. Ориентировочный
      выход — {{amount:brown-butter-output}}. Не процеживай масло. Дай ему
      остыть до пластичного, мягкого состояния; не вводи горячим или жидким.
      Не пытайся довести массу коричневого масла до исходных 250 г молоком:
      испарившаяся вода будет возвращена отдельно молоком в тесте.
  - id: preferment
    title: Приготовить опару
    ingredients:
      - ingredient: flour
        part: preferment
      - ingredient: milk
        part: preferment
      - ingredient: yeast
      - ingredient: dry-yeast
      - ingredient: sugar
        part: preferment
    quantities:
      - id: preferment-milk
        quantity: 160
        unit: г
      - id: preferment-flour
        quantity: 200
        unit: г
      - id: preferment-sugar
        quantity: 10
        unit: г
    instructions: >-
      Смешай {{amount:preferment-milk}} молока, {{amount:preferment-flour}} муки
      и {{amount:preferment-sugar}} сахара. Добавь все дрожжи выбранного вида:
      либо {{amount:yeast}} свежих прессованных, либо {{amount:dry-yeast}}
      инстантных сухих. Замеси в Ankarsrum роликом до однородной мягкой массы.
      Накрой и оставь при 24–26 °C примерно на 45–60 минут, до заметного подъёма
      и пористой поверхности.
  - id: mix-dough
    title: Замесить тесто
    ingredients:
      - ingredient: flour
        part: main
      - ingredient: milk
        part: main
      - ingredient: egg
      - ingredient: sugar
        part: main
      - ingredient: butter
        part: dough
      - ingredient: salt
      - ingredient: lemon-zest
      - ingredient: vanilla
      - ingredient: cardamom
      - ingredient: nutmeg
      - ingredient: cinnamon
    quantities:
      - id: main-flour
        quantity: 300
        unit: г
      - id: main-milk
        quantity: 100
        unit: г
      - id: main-egg
        quantity: 50
        unit: г
      - id: main-sugar
        quantity: 90
        unit: г
    instructions: >-
      Используй в Ankarsrum ролик и скребок. Добавь к опаре
      {{amount:main-flour}} муки, {{amount:main-milk}} молока и
      {{amount:main-egg}} яйца.
      Замешивай до появления заметной упругости и развития клейковины.
      Затем добавь {{amount:main-sugar}} сахара, растёртого с цедрой,
      соль, специи и ваниль. Когда они распределятся, постепенно введи всё
      остывшее до пластичного состояния коричневое масло небольшими порциями,
      каждый раз дожидаясь полного вмешивания. Замешивай до гладкого, эластичного
      и связного теста. Не перегревай его: ориентир после замеса 23–25 °C.
  - id: add-fruit
    title: Вмешать фрукты и миндаль
    ingredients:
      - ingredient: raisins
      - ingredient: orangeat
      - ingredient: citronat
      - ingredient: almonds
    instructions: >-
      Добавь изюм, цукаты и миндаль. Перемешивай на минимальной скорости только
      до равномерного распределения. Если Ankarsrum начинает раздавливать изюм,
      закончи вмешивание руками.
  - id: bulk
    title: Первое брожение
    instructions: >-
      Накрой тесто и оставь при 22–24 °C примерно на 60–90 минут.
      Ориентируйся на увеличение объёма примерно на 30–40% и заметное
      расслабление теста; удвоения ждать не нужно. Если в помещении теплее,
      проверяй тесто раньше, чтобы масло не начало заметно размягчаться.
  - id: shape
    title: Сформовать штоллены
    ingredients:
      - ingredient: marzipan
    quantities:
      - id: stollen-count
        quantity: 2
        unit: часть
        unit_forms:
          one: часть
          few: части
          many: частей
      - id: marzipan-half
        quantity: 125
        unit: г
    instructions: >-
      Раздели тесто на {{count:stollen-count}} равные части.
      Если используешь марципан, раздели его на равные порции
      по {{amount:marzipan-half}} и скатай каждую в колбаску длиной 20–25 см.
      Каждую часть теста расплющи в овал толщиной
      2–3 см, положи колбаску марципана немного в стороне от центра и заверни
      тесто вокруг него, полностью закрыв начинку; слегка защипни шов. Затем
      на каждой заготовке сделай продольное углубление немного в стороне от
      центра и загни одну сторону поверх другой, формируя характерный
      асимметричный валик. Если готовишь без марципана, сразу сформуй такой
      валик из каждой части теста. Переложи штоллены на противень с пергаментом.
  - id: proof
    title: Окончательная расстойка
    instructions: >-
      Накрой заготовки и оставь при 22–24 °C примерно на 45–70 минут.
      Они должны немного увеличиться и стать пухлее, но не обязаны удваиваться.
      Следи за состоянием теста: время зависит от температуры помещения и активности
      опары.
  - id: bake
    title: Выпечь
    instructions: >-
      Разогрей духовку до 190 °C в режиме верхнего и нижнего нагрева,
      без конвекции. Выпекай на уровне чуть ниже среднего 10 минут, затем снизь
      температуру до 170 °C и выпекай ещё примерно 35–50 минут. Если верх быстро
      темнеет, свободно прикрой фольгой. Готовность проверяй термометром:
      температура в центре мякиша должна достигнуть 94–96 °C.
  - id: coat
    title: Покрыть маслом и пудрой
    ingredients:
      - ingredient: butter
        part: coating
      - ingredient: powdered-sugar
    instructions: >-
      Пока штоллены горячие, смажь их со всех сторон растопленным обычным маслом.
      Через 2–3 минуты повтори смазывание и щедро посыпь сахарной пудрой.
      После частичного охлаждения добавь тонкий слой пудры, а после полного
      остывания — последний толстый слой.
  - id: cool-store
    title: Остудить и выдержать
    instructions: >-
      Полностью остуди на решётке и только затем заверни в пергамент и фольгу
      или положи в закрытую упаковку. Выдерживай в прохладном сухом месте.
      Первую пробу можно сделать через 2–3 дня; вкус обычно объединяется за 7–14 дней.
tips:
  - >-
    Выбирай только один вид дрожжей: {{amount:yeast}} свежих прессованных или
    {{amount:dry-yeast}} инстантных сухих. Всё количество выбранного вида добавляется
    в опару; в основное тесто дополнительные дрожжи не нужны.
  - >-
    Не добавляй свободный ром от замачивания: избыток жидкости и спирта меняет
    консистенцию теста и может замедлить брожение.
  - >-
    Используй ролик и скребок Ankarsrum. Масло вводи постепенно после развития
    клейковины; не допускай нагрева теста выше 25–26 °C.
  - >-
    Всё масло для теста подрумянивай вместе с молочными частицами. Не процеживай
    его: поджаренные частицы дают значительную часть орехового аромата.
storage:
  - >-
    После полного остывания храни герметично упакованным в прохладном сухом месте.
    Для первой партии ориентируйся на 1–2 недели выдержки. Для более долгого
    хранения заморозь порциями; лучше использовать в течение 1–2 месяцев.
