id: dresdner-christstollen-rum-almond
title: Дрезденский штоллен с ромовым изюмом и миндалём
description: >-
  Масляный рождественский штоллен с ромовым изюмом, цитрусовыми цукатами,
  миндалём, лимонной цедрой и специями. Всё масло для теста подрумянивается
  до орехового аромата; молоко компенсирует потерю влаги и немного повышает
  гидратацию. После выпечки штоллен покрывается маслом и сахарной пудрой
  и выдерживается для объединения ароматов.
category: baking-and-dough
also_in: [desserts]
subcategory: buns-and-pastries
tags: [штоллен, Dresdner Christstollen, немецкая выпечка, рождественская выпечка, ром, изюм, миндаль]
yield:
  quantity: 2
  unit: штоллен
  unit_forms:
    one: штоллен
    few: штоллена
    many: штолленов
time:
  active_minutes: 105
  total_minutes_min: 805
  total_minutes_max: 925
equipment:
  - Тестомес Ankarsrum с роликом и скребком
  - Весы с точностью до 0,1 г
  - Ёмкость для опары и брожения
  - Небольшая светлая кастрюля для коричневого масла
  - Противень и пергамент
  - Термометр-щуп
ingredient_groups:
  - id: fruit
    title: Фрукты и орехи
  - id: dough
    title: Тесто
  - id: filling
    title: Начинка (по желанию)
  - id: finish
    title: Покрытие
ingredients:
  - id: raisins
    name: Изюм
    quantity: 400
    unit: г
    group: fruit
  - id: rum
    name: Тёмный ром
    quantity: 55
    unit: г
    group: fruit
  - id: orangeat
    name: Апельсиновые цукаты
    quantity: 75
    unit: г
    group: fruit
  - id: citronat
    name: Лимонные цукаты
    quantity: 50
    unit: г
    group: fruit
  - id: almonds
    name: Миндаль
    quantity: 100
    unit: г
    group: fruit
  - id: marzipan
    name: Марципан
    quantity: 250
    unit: г
    group: filling
    optional: true
    note: Скатай по одной колбаске на каждый штоллен; масса каждой — примерно половина общего количества марципана.
  - id: flour
    name: Пшеничная мука
    quantity: 500
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 200
        group: dough
      - id: main
        name: В основное тесто
        quantity: 300
        group: dough
  - id: milk
    name: Молоко 3–3,5%
    quantity: 260
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 160
        group: dough
      - id: main
        name: В основное тесто
        quantity: 100
        group: dough
    note: 160 г идут в опару, 100 г — в основное тесто. Увеличенное количество компенсирует испарение воды при подрумянивании масла и немного повышает гидратацию.
  - id: egg
    name: Яйцо без скорлупы
    quantity: 50
    unit: г
    group: dough
    note: Примерно одно среднее яйцо.
  - id: yeast
    name: Свежие прессованные дрожжи
    quantity: 18
    unit: г
    group: dough
    note: Основной вариант. Если используешь сухие дрожжи, выбери альтернативный ингредиент ниже.
  - id: dry-yeast
    name: Инстантные сухие дрожжи (альтернатива)
    quantity: 6
    unit: г
    group: dough
    optional: true
    note: Все 6 г добавляются в опару вместо свежих прессованных дрожжей; не используй оба вида одновременно.
  - id: sugar
    name: Сахар
    quantity: 100
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 10
        group: dough
      - id: main
        name: В основное тесто
        quantity: 90
        group: dough
  - id: butter
    name: Сливочное масло 82%
    quantity: 330
    unit: г
    parts:
      - id: dough
        name: В тесто
        quantity: 250
        group: dough
      - id: coating
        name: Для покрытия
        quantity: 80
        group: finish
    note: Все 250 г для теста подрумяниваются. Масло для покрытия оставь обычным.
  - id: salt
    name: Соль
    quantity: 7
    unit: г
    group: dough
  - id: lemon-zest
    name: Лимонная цедра
    quantity: 10
    unit: г
    group: dough
  - id: vanilla
    name: Ванильный экстракт
    quantity: 3
    unit: г
    group: dough
  - id: cardamom
    name: Молотый кардамон
    quantity: 2
    unit: г
    group: dough
  - id: nutmeg
    name: Молотый мускатный орех
    quantity: 0.6
    unit: г
    group: dough
  - id: cinnamon
    name: Молотая корица
    quantity: 1
    unit: г
    group: dough
  - id: powdered-sugar
    name: Сахарная пудра
    quantity_min: 100
    quantity_max: 140
    unit: г
