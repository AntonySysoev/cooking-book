id: dresdner-christstollen-rum-almond
title: Дрезденский штоллен с ромовым изюмом и миндалём
description: >-
  Масляный рождественский штоллен с ромовым изюмом, цитрусовыми цукатами,
  миндалём, лимонной цедрой и специями. После выпечки покрывается маслом
  и сахарной пудрой и выдерживается для объединения ароматов.
category: baking-and-dough
also_in: [desserts]
subcategory: buns-and-pastries
tags: [штоллен, Dresdner Christstollen, немецкая выпечка, рождественская выпечка, ром, изюм, миндаль]
yield:
  quantity: 2
  unit: штоллена (примерно по 750–800 г до выпечки)
time:
  active_minutes: 90
  total_minutes_min: 780
  total_minutes_max: 900
equipment:
  - Тестомес Ankarsrum с роликом и скребком
  - Весы с точностью до 0,1 г
  - Ёмкость для опары и брожения
  - Противень и пергамент
  - Термометр-щуп
ingredient_groups:
  - id: fruit
    title: Фрукты и орехи
  - id: dough
    title: Тесто
  - id: filling
    title: Начинка (по желанию)
  - id: finish
    title: Покрытие
ingredients:
  - id: raisins
    name: Изюм
    quantity: 400
    unit: г
    group: fruit
  - id: rum
    name: Тёмный ром
    quantity: 55
    unit: г
    group: fruit
  - id: orangeat
    name: Апельсиновые цукаты
    quantity: 100
    unit: г
    group: fruit
  - id: citronat
    name: Лимонные цукаты
    quantity: 50
    unit: г
    group: fruit
  - id: almonds
    name: Миндаль
    quantity: 75
    unit: г
    group: fruit
  - id: marzipan
    name: Марципан
    quantity: 250
    unit: г
    group: filling
    optional: true
    note: По 125 г на каждый штоллен; можно использовать домашний марципан.
  - id: flour
    name: Пшеничная мука
    quantity: 500
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 200
        group: dough
      - id: main
        name: В основное тесто
        quantity: 300
        group: dough
  - id: milk
    name: Молоко 3–3,5%
    quantity: 200
    unit: г
    parts:
      - id: preferment
        name: В опару
        quantity: 160
        group: dough
      - id: main
        name: В основное тесто
        quantity: 40
        group: dough
  - id: yeast
    name: Свежие прессованные дрожжи
    quantity: 18
    unit: г
    group: dough
    note: Основной вариант. Если используешь сухие дрожжи, выбери альтернативный ингредиент ниже.
  - id: dry-yeast
    name: Инстантные сухие дрожжи (альтернатива)
    quantity: 6
    unit: г
    group: dough
    optional: true
    note: Все 6 г добавляются в опару вместо свежих прессованных дрожжей; не используй оба вида одновременно.
  - id: sugar
    name: Сахар
    quantity: 100
    unit: г
    note: Можно использовать смесь примерно поровну из тёмного мусковадо, коричневого тростникового и белого сахара.
    parts:
      - id: preferment
        name: В опару
        quantity: 10
        group: dough
      - id: main
        name: В основное тесто
        quantity: 90
        group: dough
  - id: butter
    name: Сливочное масло 82%
    quantity: 330
    unit: г
    parts:
      - id: dough
        name: В тесто
        quantity: 250
        group: dough
      - id: coating
        name: Для покрытия
        quantity: 80
        group: finish
  - id: salt
    name: Соль
    quantity: 7
    unit: г
    group: dough
  - id: lemon-zest
    name: Лимонная цедра
    quantity: 5
    unit: г
    group: dough
  - id: vanilla
    name: Ванильный экстракт
    quantity: 3
    unit: г
    group: dough
  - id: cardamom
    name: Молотый кардамон
    quantity: 1
    unit: г
    group: dough
  - id: nutmeg
    name: Молотый мускатный орех
    quantity: 0.3
    unit: г
    group: dough
  - id: cinnamon
    name: Молотая корица
    quantity: 0.5
    unit: г
    group: dough
  - id: powdered-sugar
    name: Сахарная пудра
    quantity_min: 100
    quantity_max: 140
    unit: г
    group: finish
steps:
  - id: soak-raisins
    title: Замочить изюм
    ingredients:
      - ingredient: raisins
      - ingredient: rum
    instructions: >-
      Чистый изюм не промывай. Если промыл, тщательно обсуши. Смешай изюм с ромом,
      накрой и оставь на 8–12 часов, перемешав один-два раза. Перед замесом слей
      свободную жидкость, если она осталась; не добавляй её в тесто.
  - id: prepare-fruit
    title: Подготовить цукаты и миндаль
    ingredients:
      - ingredient: orangeat
      - ingredient: citronat
      - ingredient: almonds
    instructions: >-
      Нарежь цукаты кубиками 4–6 мм. Миндаль крупно поруби; при желании подсуши
      при 150 °C 8–10 минут и полностью остуди.
  - id: preferment
    title: Приготовить опару
    ingredients:
      - ingredient: flour
        part: preferment
      - ingredient: milk
        part: preferment
      - ingredient: yeast
      - ingredient: dry-yeast
      - ingredient: sugar
        part: preferment
    quantities:
      - id: preferment-milk
        quantity: 160
        unit: г
      - id: preferment-flour
        quantity: 200
        unit: г
      - id: preferment-sugar
        quantity: 10
        unit: г
    instructions: >-
      Смешай {{amount:preferment-milk}} молока, {{amount:preferment-flour}} муки
      и {{amount:preferment-sugar}} сахара. Добавь все дрожжи выбранного вида:
      либо {{amount:yeast}} свежих прессованных, либо {{amount:dry-yeast}}
      инстантных сухих. Замеси в Ankarsrum роликом до однородной мягкой массы.
      Накрой и оставь при 24–26 °C примерно на 45–60 минут, до заметного подъёма
      и пористой поверхности.
  - id: mix-dough
    title: Замесить тесто
    ingredients:
      - ingredient: flour
        part: main
      - ingredient: milk
        part: main
      - ingredient: sugar
        part: main
      - ingredient: butter
        part: dough
      - ingredient: salt
      - ingredient: lemon-zest
      - ingredient: vanilla
      - ingredient: cardamom
      - ingredient: nutmeg
      - ingredient: cinnamon
    quantities:
      - id: main-flour
        quantity: 300
        unit: г
      - id: main-milk
        quantity: 40
        unit: г
      - id: main-sugar
        quantity: 90
        unit: г
      - id: main-butter
        quantity: 250
        unit: г
    instructions: >-
      Используй в Ankarsrum ролик и скребок. Масло для теста ({{amount:main-butter}})
      нарежь кубиками и доведи до пластичного состояния при 18–20 °C.
      Для мучной части смешай {{amount:main-flour}} муки с сахаром,
      растёртым с лимонной цедрой, специями и солью. Добавь масло и перемешай
      роликом на низкой скорости до равномерной мелкокрошковатой массы без
      сухих карманов муки; не пытайся развивать клейковину в этой части.
      Влей {{amount:main-milk}} молока и коротко перемешай до однородной
      плотной массы. Добавь ваниль.
      Переложи дрожжевую основу в чашу к мучно-масляной части. На низкой
      скорости соединяй обе части роликом, пока тесто не станет однородным,
      компактным и связным. Не добивайся хлебного оконца и не продолжай замес
      ради выраженной растяжимости: штолленное тесто остаётся плотным.
      Ориентировочная температура теста после замеса — 23–25 °C. Если масса
      заметно нагревается, становится жирной или начинает мазаться, останови
      машину и охлади чашу 10–15 минут. Не исправляй консистенцию дополнительной
      мукой.
  - id: add-fruit
    title: Вмешать фрукты и миндаль
    ingredients:
      - ingredient: raisins
      - ingredient: orangeat
      - ingredient: citronat
      - ingredient: almonds
    instructions: >-
      Добавь изюм, цукаты и миндаль. Перемешивай на минимальной скорости только
      до равномерного распределения. Если Ankarsrum начинает раздавливать изюм,
      закончи вмешивание руками.
  - id: bulk
    title: Первое брожение
    instructions: >-
      Накрой тесто и оставь при 22–24 °C примерно на 60–90 минут.
      Ориентируйся на увеличение объёма примерно на 30–40% и заметное
      расслабление теста; удвоения ждать не нужно. Если в помещении теплее,
      проверяй тесто раньше, чтобы масло не начало заметно размягчаться.
  - id: shape
    title: Сформовать штоллены
    ingredients:
      - ingredient: marzipan
    quantities:
      - id: stollen-count
        quantity: 2
        unit: шт.
      - id: marzipan-half
        quantity: 125
        unit: г
    instructions: >-
      Раздели тесто на {{count:stollen-count}} равные части. Если используешь марципан,
      раздели его на порции по {{amount:marzipan-half}} и сформируй из каждой
      цилиндр длиной 20–25 см. Каждую часть теста расплющи в овал толщиной
      2–3 см, положи цилиндр марципана немного в стороне от центра и заверни
      тесто вокруг него, полностью закрыв начинку; слегка защипни шов. Затем
      на каждой заготовке сделай продольное углубление немного в стороне от
      центра и загни одну сторону поверх другой, формируя характерный
      асимметричный валик. Если готовишь без марципана, сразу сформуй такой
      валик из каждой части теста. Переложи штоллены на противень с пергаментом.
  - id: proof
    title: Окончательная расстойка
    instructions: >-
      Накрой заготовки и оставь при 22–24 °C примерно на 45–70 минут.
      Они должны немного увеличиться и стать пухлее, но не обязаны удваиваться.
      Следи за состоянием теста: время зависит от температуры помещения и активности
      опары.
  - id: bake
    title: Выпечь
    instructions: >-
      Разогрей духовку до 190 °C в режиме верхнего и нижнего нагрева,
      без конвекции. Выпекай на уровне чуть ниже среднего 10 минут, затем снизь
      температуру до 170 °C и выпекай ещё примерно 35–50 минут. Если верх быстро
      темнеет, свободно прикрой фольгой. Готовность проверяй термометром:
      температура в центре мякиша должна достигнуть 94–96 °C.
  - id: coat
    title: Покрыть маслом и пудрой
    ingredients:
      - ingredient: butter
        part: coating
      - ingredient: powdered-sugar
    instructions: >-
      Пока штоллены горячие, смажь их со всех сторон растопленным маслом.
      Через 2–3 минуты повтори смазывание и щедро посыпь сахарной пудрой.
      После частичного охлаждения добавь тонкий слой пудры, а после полного
      остывания — последний толстый слой.
  - id: cool-store
    title: Остудить и выдержать
    instructions: >-
      Полностью остуди на решётке и только затем заверни в пергамент и фольгу
      или положи в закрытую упаковку. Выдерживай в прохладном сухом месте.
      Первую пробу можно сделать через 2–3 дня; вкус обычно объединяется за 7–14 дней.
tips:
  - >-
    Выбирай только один вид дрожжей: {{amount:yeast}} свежих прессованных или
    {{amount:dry-yeast}} инстантных сухих. Всё количество выбранного вида добавляется
    в опару; в основное тесто дополнительные дрожжи не нужны.
  - >-
    Не добавляй свободный ром от замачивания: избыток жидкости и спирта меняет
    консистенцию теста и может замедлить брожение.
  - >-
    В Ankarsrum для этого плотного сдобного теста используй ролик со скребком,
    а не крюк: производитель рекомендует ролик для теста с большим количеством
    масла. Начинай на низкой скорости и фиксируй ролик только после того, как
    тесто начнёт собираться и подниматься по стенке чаши.
  - >-
    Не подсыпай муку, чтобы исправить расслоение масла: останови замес и охлади
    чашу. Не добавляй сухофрукты, пока основное тесто не станет однородным и
    связным.
  - >-
    Не подсыпай много муки при формовании. Штоллен должен быть плотным и маслянистым,
    но не сырым; ориентируйся на 94–96 °C в центре.
storage:
  - >-
    После полного остывания храни герметично упакованным в прохладном сухом месте.
    Для первой партии ориентируйся на 1–2 недели выдержки. Для более долгого
    хранения заморозь порциями; лучше использовать в течение 1–2 месяцев.
