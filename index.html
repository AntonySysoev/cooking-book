<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e7">
  <meta name="description" content="Личная кулинарная книга с рецептами, масштабированием ингредиентов и удобным режимом готовки.">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <title>Cooking Book — кулинарная книга</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Cooking Book — главная">
      <span class="brand-mark" aria-hidden="true">cb</span>
      <span><strong>Cooking Book</strong><small>моя кулинарная книга</small></span>
    </a>
    <div class="header-actions">
      <button class="icon-button wake-toggle-button" id="wake-toggle" type="button" hidden aria-label="Не выключать экран" aria-pressed="false" title="Не выключать экран во время готовки"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="13" rx="2"/><path d="M8 21h8M12 16.5V21"/><rect x="14" y="10" width="6" height="5.5" rx="1"/><path d="M15.5 10V8.8a1.5 1.5 0 0 1 3 0V10"/></svg></button>
      <label class="font-size-control" for="font-size-select" title="Размер текста на всём сайте"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 9 5l5 14M6 14h6M16 8h5M18.5 5.5v13"/></svg><span class="visually-hidden">Размер текста</span><select id="font-size-select" aria-label="Размер текста на всём сайте"><option value="50">50%</option><option value="75">75%</option><option value="100" selected>100%</option><option value="125">125%</option><option value="150">150%</option></select></label>
      <button class="icon-button print-button" id="print-button" type="button" hidden aria-label="Печать рецепта" title="Печать">⎙</button>
    </div>
  </header>
  <main id="app" class="page-shell">
    <div class="loading-state">Загружаю рецепты…</div>
  </main>
  <button class="icon-button top-button" id="top-button" type="button" hidden aria-label="Наверх" title="Наверх"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
  <footer class="site-footer">Cooking Book <span>·</span> рецепты, собранные в одном месте</footer>
  <script src="./assets/app.js" defer></script>
</body>
</html>
