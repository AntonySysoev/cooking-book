<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e7">
  <meta name="description" content="Личная кулинарная книга с рецептами, масштабированием ингредиентов и удобным режимом готовки.">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <title>Cooking Book — кулинарная книга</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Cooking Book — главная">
      <span class="brand-mark" aria-hidden="true">cb</span>
      <span><strong>Cooking Book</strong><small>моя кулинарная книга</small></span>
    </a>
    <div class="header-actions">
      <button class="icon-button cooking-mode-header-button" id="cooking-mode-toggle" type="button" hidden aria-pressed="false" aria-label="Включить режим готовки" title="Режим готовки"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1 10H5L4 10Z"/><path d="M7 10V7a5 5 0 0 1 10 0v3M2 10h20M8 14h.01M12 14h.01M16 14h.01"/></svg></button>
      <div class="print-menu-wrap" id="print-menu-wrap">
        <button class="icon-button print-button" id="print-button" type="button" aria-label="Меню настроек и действий" title="Настройки и действия" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="print-menu" id="print-menu" role="menu" aria-label="Настройки и действия" hidden>
          <button type="button" role="menuitem" id="font-size-toggle" class="menu-setting-button" aria-pressed="false" aria-label="Включить чёрно-белый режим чтения с размером текста 150%" title="Крупный текст и чёрно-белое оформление · 150%"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 9 5l5 14M6 14h6"/><rect x="16" y="5" width="4" height="14" fill="currentColor" stroke="none"/></svg><span>Контрастная тема</span><span class="menu-setting-status" id="font-size-value">100%</span></button>
          <button type="button" role="menuitem" id="wake-toggle" class="menu-setting-button wake-toggle-button" hidden aria-label="Не выключать экран" aria-pressed="false" title="Не выключать экран во время готовки"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="13" rx="2"/><path d="M8 21h8M12 16.5V21"/><rect x="14" y="10" width="6" height="5.5" rx="1"/><path d="M15.5 10V8.8a1.5 1.5 0 0 1 3 0V10"/></svg><span>Не гасить экран</span><span class="menu-setting-status" id="wake-status">Выкл.</span></button>
          <div class="menu-separator" id="recipe-menu-separator" hidden></div>
          <button type="button" role="menuitem" id="print-menu-print" hidden>Печать</button>
          <button type="button" role="menuitem" id="print-menu-link" hidden>Скопировать ссылку</button>
        </div>
      </div>
    </div>
  </header>
  <main id="app" class="page-shell">
    <div class="loading-state">Загружаю рецепты…</div>
  </main>
  <button class="icon-button top-button" id="top-button" type="button" hidden aria-label="Наверх" title="Наверх"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
  <footer class="site-footer">Cooking Book <span>·</span> рецепты, собранные в одном месте</footer>
  <script src="./assets/app.js" defer></script>
</body>
</html>
